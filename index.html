<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sHeeeSh</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff3fa4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Cinzel:wght@700;900&family=Pirata+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>:root {
  --bg: #120e12;
  --bg2: #1c151c;
  --panel: #241a22;
  --line: #3a2b36;
  --ink: #e9e1d8;
  --ink-dim: #a3958f;
  --blood: #8a1c1c;
  --blood-bright: #c0392b;
  --formal: #2e6b4f;
  --gold: #b08d3a;
  --paper: #efe4cf;
  --paper-dark: #d9c9ad;
  --paper-ink: #1b1418;
  --paper-red: #7a1f1f;
  --tile: #f3ead6;
  --tile-ink: #2a2118;
  --radius: 10px;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: "Cascadia Mono", "Consolas", "SF Mono", Menlo, monospace;
  --serif: "Georgia", "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
body { background: radial-gradient(ellipse at 50% -20%, #2a1a24 0%, var(--bg) 60%); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; }
a { color: inherit; }

/* boot */
.boot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.wordmark { font-family: var(--serif); font-weight: 700; letter-spacing: .32em; font-size: 34px; color: var(--ink); }
.wordmark small { display: block; font-family: var(--sans); font-weight: 400; letter-spacing: .18em; font-size: 10px; color: var(--ink-dim); margin-top: 4px; }
.boot-sub { color: var(--ink-dim); font-size: 13px; letter-spacing: .06em; text-align: center; max-width: 420px; padding: 0 20px; }
.boot-sub.err { color: var(--blood-bright); }
.join { display: flex; flex-direction: column; gap: 10px; width: min(360px, 90vw); }
.join input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }
.join .btn { align-self: stretch; }

/* frame */
header.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.25); }
header .wordmark { font-size: 18px; letter-spacing: .28em; }
header .case { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
header .timer { flex: 1; height: 8px; border-radius: 4px; background: #2a1f28; overflow: hidden; position: relative; min-width: 80px; }
header .timer > i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, var(--formal), var(--gold) 60%, var(--blood-bright)); transition: transform .2s linear; }
header .timer.urgent > i { background: var(--blood-bright); }
header .secs { font-family: var(--mono); font-size: 14px; min-width: 3ch; text-align: right; color: var(--ink); }
header .secs.urgent { color: var(--blood-bright); }
header .phase { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }

main.table { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; min-height: 0; }
.center { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; padding-right: 2px; }
aside.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

/* specimen card: paper on the slab */
.card {
  position: relative; background: linear-gradient(160deg, var(--paper) 0%, var(--paper-dark) 100%);
  color: var(--paper-ink); border-radius: 6px; padding: 18px 22px 18px 74px;
  box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.15), inset 0 0 60px rgba(120,80,40,.10);
  transform: rotate(-.4deg);
}
.card::before { /* punched hole */
  content: ""; position: absolute; left: 22px; top: 18px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--bg); box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 0 0 3px rgba(0,0,0,.08);
}
.card::after { /* string */
  content: ""; position: absolute; left: 28px; top: -30px; width: 2px; height: 44px; background: #8b7355; transform: rotate(-12deg); opacity: .8;
}
.card .icon { position: absolute; left: 14px; top: 46px; width: 44px; height: 44px; color: var(--paper-red); opacity: .85; }
.card .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card .head { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #5a4a44; border-bottom: 1px solid rgba(0,0,0,.25); padding-bottom: 6px; margin-bottom: 10px; }
.card .word { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 5vw, 46px); letter-spacing: .12em; text-transform: uppercase; line-height: 1.05; margin: 2px 0 10px; }
.card .word.prev { font-size: clamp(20px, 3vw, 28px); color: #4a3a3a; }
.card .origin { font-family: var(--serif); font-size: 15px; line-height: 1.45; color: #2a2024; }
.card .clue { font-family: var(--serif); font-size: 20px; line-height: 1.35; margin: 4px 0 12px; }
.card .boxes { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.card .boxes i { width: 26px; height: 32px; border: 1.5px solid #5a4a44; border-radius: 3px; display: inline-block; background: rgba(255,255,255,.35); }
.card .stamp {
  position: absolute; right: 18px; top: 14px; padding: 4px 10px; border: 3px solid currentColor; border-radius: 4px;
  font-family: var(--mono); font-weight: 700; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; transform: rotate(8deg); opacity: .85;
}
.stamp.good { color: var(--formal); } .stamp.bad { color: var(--paper-red); } .stamp.gold { color: #7a5f1a; }
.card.pending { transform: rotate(.6deg); background: linear-gradient(160deg, #f4ecdb, #e3d5bb); }
.card.pending .word { font-size: clamp(26px, 4vw, 38px); }
.card .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: #4a3a3a; margin-top: 6px; }
.card .meta .link { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid #5a4a44; border-radius: 999px; }
.card .why { font-family: var(--serif); font-style: italic; font-size: 16px; margin-top: 8px; color: #2a2024; }
.card .worth { font-family: var(--mono); font-size: 12px; color: #5a4a44; margin-top: 8px; }

/* chain */
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain .tag { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
.chain .tag.seed { background: var(--paper); color: var(--paper-ink); border-color: transparent; }
.chain .tag small { color: var(--ink-dim); letter-spacing: 0; text-transform: none; margin-left: 6px; }
.chain .arrow { color: var(--ink-dim); font-size: 12px; }

/* stage */
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stage h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.stage p { margin: 6px 0; color: var(--ink); }
.stage .muted { color: var(--ink-dim); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: #2f2230; color: var(--ink); letter-spacing: .04em; }
.btn:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.blood { background: var(--blood); border-color: #a33; }
.btn.formal { background: var(--formal); border-color: #3f8a68; }
.btn.ghost { background: transparent; }
.btn.big { padding: 14px 22px; font-size: 17px; }
.playform { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.playform input { padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); width: 100%; }
.playform input.word { font-family: var(--serif); font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; padding: 9px 6px; background: var(--bg2); color: var(--ink-dim); border: 0; border-right: 1px solid var(--line); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: #3a2838; color: var(--ink); }
.seg button b { display: block; font-family: var(--mono); font-size: 11px; color: var(--gold); }
.hint { font-size: 12px; color: var(--ink-dim); }
.hint code { font-family: var(--mono); background: var(--bg2); padding: 1px 5px; border-radius: 4px; }
.err { color: var(--blood-bright); font-size: 13px; min-height: 1.2em; }

/* tiles */
.tiles { display: flex; gap: 6px; }
.tile { width: 34px; height: 38px; border-radius: 4px; background: linear-gradient(160deg, var(--tile), #e2d6bd); color: var(--tile-ink); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 20px; position: relative; box-shadow: 0 2px 0 #b8a88c, 0 4px 8px rgba(0,0,0,.4); }
.tile small { position: absolute; right: 3px; bottom: 1px; font-size: 8px; font-family: var(--sans); font-weight: 600; }
.tile.sm { width: 22px; height: 25px; font-size: 13px; box-shadow: 0 1px 0 #b8a88c; }
.tile.sm small { font-size: 6px; right: 2px; bottom: 0; }

/* players */
.players { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.players h3, .log h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.player { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.player:first-of-type { border-top: 0; }
.player .av { width: 28px; height: 28px; border-radius: 50%; background: #3a2838; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); }
.player.current .av { outline: 2px solid var(--gold); outline-offset: 1px; }
.player.off .av { opacity: .4; }
.player .nm { font-size: 14px; display: flex; gap: 6px; align-items: center; }
.player .nm .host { font-size: 9px; letter-spacing: .12em; padding: 1px 5px; border: 1px solid var(--gold); color: var(--gold); border-radius: 3px; }
.player .nm .you { font-size: 9px; letter-spacing: .12em; color: var(--ink-dim); }
.player .sc { font-family: var(--mono); font-size: 16px; }
.player .tiles { grid-column: 2 / span 2; }

/* log */
.log { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; flex: 1; min-height: 120px; overflow: auto; font-size: 13px; }
.log .l { padding: 4px 0; border-top: 1px dashed var(--line); color: var(--ink-dim); }
.log .l:first-of-type { border-top: 0; }
.log .l.good { color: #7fc7a3; } .log .l.bad { color: #e07a70; } .log .l.gold { color: #d9b866; } .log .l.case { color: var(--ink); } .log .l.turn { color: #c9b8d0; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(8,5,8,.72); display: grid; place-items: center; padding: 20px; z-index: 10; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; width: min(640px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
.sheet h2 { margin: 0 0 6px; font-family: var(--serif); letter-spacing: .1em; text-transform: uppercase; font-size: 22px; }
.sheet .sub { color: var(--ink-dim); margin-bottom: 14px; }
.board { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.board .r { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 10px; background: var(--bg2); border-radius: 8px; }
.board .r.win { outline: 1px solid var(--gold); }
.board .r .n { font-family: var(--mono); color: var(--ink-dim); }
.board .r .pts { font-family: var(--mono); font-size: 18px; }
.board .r small { display: block; color: var(--ink-dim); font-size: 12px; }
.cousins { margin: 10px 0; padding: 10px 12px; background: var(--bg2); border-radius: 8px; font-size: 14px; }
.cousins b { color: var(--gold); letter-spacing: .06em; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #2a1a24; border: 1px solid var(--line); color: var(--ink); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 20; font-size: 14px; max-width: 90vw; }
.toast.bad { border-color: var(--blood-bright); }

.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 8px 0 12px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.settings input, .settings select { padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }

.rules { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
.rules b { color: var(--ink); }

@media (max-width: 760px) {
  main.table { grid-template-columns: 1fr; overflow: auto; }
  aside.side { order: 2; }
  .card { padding-left: 64px; }
  header .case { display: none; }
  .log { min-height: 90px; max-height: 160px; }
}

/* ===== specimen plates ===== */
.plate-wrap { perspective: 1200px; }
.plate {
  --ink: #2a2024; --band: #555; --paper: #ece6d3;
  position: relative; color: var(--ink);
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(90,60,30,.18), transparent 60%),
    var(--paper);
  border-radius: 8px; padding: 14px;
  box-shadow: 0 24px 50px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.25) inset, 0 0 0 1px rgba(0,0,0,.25);
  transform: rotate(-.6deg);
  animation: deal .55s cubic-bezier(.2,.9,.3,1.2) both;
  overflow: hidden;
}
.plate::before { /* paper grain */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .3 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.plate::after { /* fold */
  content: ""; position: absolute; left: 0; right: 0; top: 58%; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,.12) 20%, rgba(0,0,0,.12) 80%, transparent);
}
.plate-frame { position: relative; border: 1.5px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 3px; border-radius: 4px; padding: 0; display: grid; grid-template-columns: 180px 1fr; min-height: 300px; }
.plate-frame::before, .plate-frame::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1.5px solid var(--ink); }
.plate-frame::before { left: -7px; top: -7px; border-right: 0; border-bottom: 0; }
.plate-frame::after { right: -7px; bottom: -7px; border-left: 0; border-top: 0; }
.plate-band { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 12px; background: var(--band); color: #f4efe2; font-family: "Special Elite", "Courier New", monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.plate-band .no { opacity: .85; }
.plate-left { border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; background: rgba(255,255,255,.14); }
.plate-art { width: 100%; max-width: 160px; height: auto; color: var(--ink); display: block; }
.plate-fig { margin-top: 6px; font-family: "Special Elite", "Courier New", monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; text-align: center; }
.plate-body { padding: 16px 18px 14px; display: flex; flex-direction: column; min-width: 0; }
.plate-word { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(34px, 5.2vw, 56px); letter-spacing: .10em; text-transform: uppercase; line-height: 1; margin: 2px 0 8px; word-break: break-word; }
.plate-word.prev { font-size: clamp(18px, 2.4vw, 24px); letter-spacing: .14em; opacity: .65; margin-bottom: 2px; }
.plate-rule { height: 1px; background: var(--ink); opacity: .5; margin: 4px 0 10px; position: relative; }
.plate-rule::after { content: "❦"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--paper); padding: 0 6px; font-size: 12px; color: var(--ink); opacity: .9; }
.plate-origin { font-family: "Cormorant Garamond", Georgia, serif; font-size: 17px; line-height: 1.45; font-style: italic; color: var(--ink); }
.plate-origin b { font-style: normal; }
.plate-why { font-family: "Cormorant Garamond", Georgia, serif; font-size: 17px; font-style: italic; margin-top: 6px; }
.plate-why .who { font-family: "Special Elite", "Courier New", monospace; font-style: normal; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-right: 6px; }
.plate-clue { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; line-height: 1.3; margin: 6px 0 12px; }
.plate-boxes { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.plate-boxes i { width: 24px; height: 30px; border: 1.5px solid var(--ink); border-radius: 2px; background: rgba(255,255,255,.4); display: inline-block; }
.plate-foot { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; font-family: "Special Elite", "Courier New", monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.plate-foot .bar { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.plate-foot .bar i { display: block; width: 2px; background: var(--ink); }
.plate-verdict { font-family: "Special Elite", "Courier New", monospace; font-size: 11px; letter-spacing: .06em; margin-top: 8px; padding: 6px 8px; border-left: 3px solid var(--band); background: rgba(0,0,0,.05); }
.plate .stamp { right: 18px; top: 46px; font-family: "Special Elite", "Courier New", monospace; font-size: 15px; letter-spacing: .24em; padding: 6px 12px; border-width: 3px; mix-blend-mode: multiply; opacity: .8; animation: slam .35s cubic-bezier(.2,1.4,.4,1) both; filter: url(#rough); }
.plate .stamp.good { color: #2b6a45; } .plate .stamp.bad { color: #8a1c1c; } .plate .stamp.gold { color: #8a6a1a; }
.plate.pending { transform: rotate(.5deg); }
@keyframes deal { from { opacity: 0; transform: translateY(40px) rotate(-6deg) scale(.96); } to { opacity: 1; transform: translateY(0) rotate(-.6deg) scale(1); } }
@keyframes slam { from { opacity: 0; transform: rotate(8deg) scale(2.6); } 70% { opacity: .9; transform: rotate(8deg) scale(.95); } to { opacity: .8; transform: rotate(8deg) scale(1); } }
.chain .tag { font-family: "Special Elite", "Courier New", monospace; }
.chain .tag.seed { background: var(--paper); }
.wordmark, .sheet h2 { font-family: "Cormorant Garamond", Georgia, serif; }
.card .word, .card .clue, .card .origin { font-family: "Cormorant Garamond", Georgia, serif; }
@media (max-width: 760px) {
  .plate-frame { grid-template-columns: 1fr; }
  .plate-left { border-right: 0; border-bottom: 1.5px solid var(--ink); }
  .plate-art { max-width: 120px; }
}

/* ===== hangman keys, cold case, reports ===== */
.keys { display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; margin-bottom: 10px; }
.keys button { padding: 8px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); font-family: "Special Elite", "Courier New", monospace; font-size: 14px; }
.keys button.hit { background: var(--formal); border-color: #3f8a68; }
.keys button.miss { background: #3a1a1a; color: #a66; text-decoration: line-through; }
.keys button:disabled { cursor: default; }
.plate-boxes i.on { display: inline-grid; place-items: center; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 20px; background: rgba(255,255,255,.7); }
.cold { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.cold h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.clues { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
.clue { font-size: 13px; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
.clue .n { font-family: "Special Elite", "Courier New", monospace; font-size: 11px; color: var(--gold); min-width: 1.4em; }
.clue.locked { color: var(--ink-dim); font-size: 12px; font-style: italic; }
.cold-c .n { font-family: "Special Elite", "Courier New", monospace; color: var(--gold); margin-right: 4px; }
.log .l.remark { color: #b9a58f; font-style: italic; font-family: "Cormorant Garamond", Georgia, serif; font-size: 14px; }
.log .l.twist { color: #e0b070; }
.log .l.cold { color: var(--gold); }
.report { margin: 10px 0; padding: 12px 14px; background: var(--paper); color: var(--paper-ink); border-radius: 4px; font-family: "Special Elite", "Courier New", monospace; font-size: 13px; line-height: 1.5; box-shadow: 0 8px 20px rgba(0,0,0,.4); transform: rotate(-.4deg); }
.accuse-h { margin: 14px 0 4px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
.accuse .btn { flex: 1; min-width: 120px; }
@media (max-width: 760px) { .keys { grid-template-columns: repeat(9, 1fr); } }
@media (max-width: 760px) { .center { overflow: visible; } }

/* ===== simple table ===== */
.seg button.on { background: color-mix(in srgb, var(--c, #3a2838) 35%, var(--bg2)); color: var(--ink); }
.seg button b { color: var(--c, var(--gold)); }
.how { display: flex; flex-direction: column; gap: 8px; }
.howrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px 10px; align-items: center; font-size: 13px; }
.howrow small { grid-column: 2 / span 2; color: var(--ink-dim); font-size: 12px; }
.howrow .pts { font-family: var(--mono); color: var(--ink); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
.rules .dot { margin-right: 4px; }
label.pname[hidden] { display: none; }
.plate-why .who { color: var(--paper-ink); }

/* ===== neon goth: black, hot pink, violet, cyan. Loaded after style.css. ===== */
:root {
  --bg: #07050a; --bg2: #100b14; --panel: #120c17; --line: #2a1f33;
  --ink: #f2e9ff; --ink-dim: #9f8fb3;
  --blood: #c0186a; --blood-bright: #ff3fa4; --formal: #1f7a5a; --gold: #c77dff;
  --paper: #0f0a13; --paper-dark: #0a070d; --paper-ink: #f2e9ff; --paper-red: #ff3fa4;
  --tile: #16101c; --tile-ink: #f2e9ff;
  --neon: #ff3fa4; --neon2: #a45cff; --neon3: #35e3ff;
  --display: "Cinzel", "Cormorant Garamond", Georgia, serif;
  --gothic: "Pirata One", "Cinzel", Georgia, serif;
  --mono: "Share Tech Mono", "Cascadia Mono", Consolas, monospace;
}
body {
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1px 1px at 78% 32%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 88% 82%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 60% 12%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 25% 88%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 52% 45%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(ellipse at 50% -10%, #2a0f2e 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, #0b1a24 0%, transparent 45%),
    var(--bg);
}
.wordmark { font-family: var(--gothic); font-weight: 400; letter-spacing: .12em; color: var(--neon); text-shadow: 0 0 8px var(--neon), 0 0 24px rgba(255,63,164,.6); }
header.top { border-bottom: 1px solid #3a1a3a; background: rgba(0,0,0,.35); }
header .case { color: var(--ink-dim); font-family: var(--mono); letter-spacing: .1em; }
/* the clock is a saber */
header .timer { height: 10px; border-radius: 6px; background: #1a0f1f; box-shadow: inset 0 0 0 1px #2a1a2f; position: relative; overflow: visible; margin-left: 24px; }
header .timer::before { content: ""; position: absolute; left: -24px; top: -3px; width: 22px; height: 16px; border-radius: 3px; background: linear-gradient(90deg, #666, #bbb 40%, #444); box-shadow: inset 0 0 2px #000; }
header .timer > i { border-radius: 6px; background: #fff; box-shadow: 0 0 6px #fff, 0 0 14px var(--neon), 0 0 30px var(--neon), 0 0 50px rgba(255,63,164,.6); transition: transform .2s linear; }
header .timer.urgent > i { box-shadow: 0 0 6px #fff, 0 0 14px #ff2e4d, 0 0 30px #ff2e4d, 0 0 50px rgba(255,46,77,.7); }
header .secs { font-family: var(--mono); color: var(--neon3); text-shadow: 0 0 8px var(--neon3); }
header .secs.urgent { color: #ff2e4d; text-shadow: 0 0 8px #ff2e4d; }
.btn { border-color: #3a2445; background: #180f1f; color: var(--ink); font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.btn.blood { background: linear-gradient(180deg, #d61c78, #8a1150); border-color: #ff3fa4; box-shadow: 0 0 12px rgba(255,63,164,.45), inset 0 1px 0 rgba(255,255,255,.25); color: #fff; }
.btn.formal { background: linear-gradient(180deg, #1f8a6a, #135a45); border-color: #35e3ff; box-shadow: 0 0 12px rgba(53,227,255,.35); color: #fff; }
.btn.big { font-size: 15px; }
.stage, .players, .log { background: rgba(18,12,23,.85); border-color: #2a1f33; box-shadow: 0 0 0 1px rgba(164,92,255,.08), 0 10px 30px rgba(0,0,0,.5); }
.stage h3, .players h3, .log h3 { color: var(--neon2); text-shadow: 0 0 10px rgba(164,92,255,.5); font-family: var(--mono); }
.playform input, .join input, .settings input, .settings select { background: #0b070f; border-color: #3a2445; color: var(--ink); }
.playform input.word { font-family: var(--display); letter-spacing: .14em; color: var(--neon3); text-shadow: 0 0 10px rgba(53,227,255,.5); }
.playform input:focus, .settings input:focus, .settings select:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 10px rgba(255,63,164,.4); }
.seg { border-color: #3a2445; }
.seg button { background: #0b070f; color: var(--ink-dim); font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
.seg button.on { background: #1a0f22; color: var(--ink); box-shadow: inset 0 -3px 0 var(--c, var(--neon)), 0 0 14px color-mix(in srgb, var(--c, var(--neon)) 40%, transparent); }
.player .av { background: #1a0f22; border: 1px solid #3a2445; color: var(--neon3); font-family: var(--mono); }
.player.current .av { outline-color: var(--neon); box-shadow: 0 0 12px var(--neon); }
.player .sc { color: var(--ink); text-shadow: 0 0 8px rgba(255,255,255,.3); }
.player .nm .you { color: var(--neon); }
.chain .tag { background: #0f0a13; border-color: #3a2445; color: var(--ink); font-family: var(--mono); }
.chain .tag.seed { background: var(--neon); color: #1a0510; border-color: transparent; box-shadow: 0 0 14px rgba(255,63,164,.6); }
.chain .arrow { color: var(--neon2); }
.overlay { background: rgba(4,2,6,.8); }
.sheet { background: #0f0a13; border-color: #3a2445; box-shadow: 0 0 0 1px rgba(255,63,164,.15), 0 30px 80px rgba(0,0,0,.8), 0 0 60px rgba(164,92,255,.15); }
.sheet h2 { font-family: var(--gothic); font-weight: 400; letter-spacing: .1em; color: var(--neon); text-shadow: 0 0 10px rgba(255,63,164,.6); font-size: 30px; }
.board .r { background: #160f1d; }
.board .r.win { outline-color: var(--neon); box-shadow: 0 0 14px rgba(255,63,164,.4); }
.cousins { background: #160f1d; color: var(--ink); }
.cousins b { color: var(--neon3); }
.rules { color: var(--ink-dim); }
.toast { background: #160f1d; border-color: var(--neon2); box-shadow: 0 0 20px rgba(164,92,255,.4); }
.toast.bad { border-color: var(--neon); }
/* plates go black-light */
.plate { background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.05), transparent 55%), var(--paper); box-shadow: 0 24px 50px rgba(0,0,0,.8), 0 0 0 1px color-mix(in srgb, var(--ink) 40%, transparent), 0 0 40px color-mix(in srgb, var(--ink) 18%, transparent); }
.plate::before { opacity: .25; mix-blend-mode: screen; }
.plate::after { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 25%, transparent) 20%, color-mix(in srgb, var(--ink) 25%, transparent) 80%, transparent); }
.plate-frame { border-color: var(--ink); outline-color: color-mix(in srgb, var(--ink) 45%, transparent); box-shadow: inset 0 0 30px color-mix(in srgb, var(--ink) 8%, transparent); }
.plate-frame::before, .plate-frame::after { border-color: var(--ink); }
.plate-band { background: var(--band); color: #fff; font-family: var(--mono); text-shadow: 0 0 6px rgba(255,255,255,.5); }
.plate-left { border-right-color: color-mix(in srgb, var(--ink) 45%, transparent); background: rgba(255,255,255,.02); }
.plate-art { color: var(--ink); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--ink) 70%, transparent)); }
.plate-fig { color: var(--ink); font-family: var(--mono); opacity: .8; }
.plate-word { font-family: var(--display); font-weight: 700; color: var(--ink); text-shadow: 0 0 10px color-mix(in srgb, var(--ink) 80%, transparent), 0 0 34px color-mix(in srgb, var(--ink) 45%, transparent); letter-spacing: .16em; }
.plate-word.prev { color: var(--ink); opacity: .55; text-shadow: none; }
.plate-rule { background: var(--ink); opacity: .6; box-shadow: 0 0 8px var(--ink); }
.plate-rule::after { content: "✦"; background: var(--paper); color: var(--ink); }
.plate-origin, .plate-why { color: #e6dcf0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 18px; }
.plate-why .who { color: var(--ink); font-family: var(--mono); }
.plate-foot { color: var(--ink); opacity: .7; font-family: var(--mono); }
.plate-foot .bar i { background: var(--ink); box-shadow: 0 0 4px var(--ink); }
.plate-verdict { border-left-color: var(--ink); background: rgba(255,255,255,.04); color: #e6dcf0; font-family: var(--mono); }
.plate .stamp { position: absolute; right: 18px; top: 46px; font-family: var(--mono); border-width: 2px; mix-blend-mode: normal; opacity: .95; }
.plate .stamp.good { color: #4dff88; text-shadow: 0 0 8px #4dff88; box-shadow: 0 0 12px rgba(77,255,136,.4), inset 0 0 12px rgba(77,255,136,.15); }
.plate .stamp.bad { color: #ff2e4d; text-shadow: 0 0 8px #ff2e4d; box-shadow: 0 0 12px rgba(255,46,77,.4), inset 0 0 12px rgba(255,46,77,.15); }
.plate .stamp.gold { color: var(--neon3); text-shadow: 0 0 8px var(--neon3); box-shadow: 0 0 12px rgba(53,227,255,.4); }
.howrow .pts { color: var(--neon3); }
.hint b { color: var(--neon); }
.how b, .rules b { color: var(--ink); }

/* dictionary lookups on the card */
.plate-dict { margin-top: 10px; padding: 8px 10px; border-top: 1px dashed color-mix(in srgb, var(--ink) 45%, transparent); font-family: "Cormorant Garamond", Georgia, serif; font-size: 15px; line-height: 1.4; color: #d9cfe6; display: flex; flex-direction: column; gap: 4px; }
.plate-dict .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); margin-right: 6px; }

/* narrow screens and phones: one column that scrolls as a whole */
@media (max-width: 760px) {
  main.table { display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; gap: 14px; }
  .center, aside.side { flex: none; min-height: auto; overflow: visible; }
  .plate-frame { grid-template-columns: 1fr; }
  .plate .stamp { top: 52px; right: 16px; font-size: 12px; }
}

/* objections and votes */
.votes { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.voter { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #160f1d; border-radius: 8px; }
.voter .nm { flex: 1; font-size: 14px; }
.voter.done { opacity: .7; }
.voter .cast { font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--neon3); }
#objform { margin-top: 10px; }
#objby { margin-left: 6px; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a2445; background: #0b070f; color: var(--ink); }

/* pass screen, tree, colours */
.overlay.pass { background: rgba(4,2,6,.92); }
.passsheet { text-align: center; border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 60px color-mix(in srgb, var(--pc) 35%, transparent); }
.passlbl { font-family: var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); font-size: 12px; }
.passsheet h2 { font-size: 44px; margin: 6px 0; }
.passsheet .row { justify-content: center; }
.btn.pc { background: var(--pc); border-color: var(--pc); color: #0a060c; font-weight: 700; box-shadow: 0 0 18px color-mix(in srgb, var(--pc) 60%, transparent); }
.sheet.wide { width: min(760px, 100%); }
svg.tree { width: 100%; height: auto; margin: 10px 0; background: #0b070f; border-radius: 8px; border: 1px solid #2a1f33; }
label.pname .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); margin-right: 6px; box-shadow: 0 0 6px var(--pc); }
label.pname { flex-direction: row; align-items: center; gap: 6px; flex-wrap: wrap; }
label.pname input { flex: 1; min-width: 90px; }

/* structure: turn track, steps, play form labels, stake */
.track { display: flex; flex-direction: column; gap: 6px; }
.turns { display: flex; flex-wrap: wrap; gap: 6px; }
.turn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; border: 1px solid #2a1f33; background: #0f0a13; color: var(--ink-dim); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
.turn i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: #1a0f22; color: var(--pc); font-size: 11px; }
.turn.done { opacity: .45; text-decoration: line-through; }
.turn.now { color: var(--ink); border-color: var(--pc); box-shadow: 0 0 12px color-mix(in srgb, var(--pc) 55%, transparent); }
.turn.now i { background: var(--pc); color: #0a060c; }
.steps { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.step.done { color: #6f5f80; text-decoration: line-through; }
.step.now { color: var(--neon3); text-shadow: 0 0 8px var(--neon3); }
.steps .sep { color: #3a2445; }
.playform .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }
.dbl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dashed #3a2445; border-radius: 8px; color: var(--ink); font-size: 14px; cursor: pointer; }
.dbl small { flex-basis: 100%; color: var(--ink-dim); font-size: 12px; }
.dbl.off { opacity: .5; cursor: default; }
.dbl input { accent-color: var(--neon); }

/* deck picker */
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
.deck { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--dk) 45%, transparent); background: #0b070f; color: var(--dk); cursor: pointer; }
.deck:hover { box-shadow: 0 0 16px color-mix(in srgb, var(--dk) 45%, transparent); background: #120b17; }
.deck .dart { width: 54px; height: 66px; color: var(--dk); }
.deck .dart svg { width: 100%; height: 100%; fill: none; stroke: currentColor; }
.deck .dname { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-align: center; color: var(--ink); }
.deck .dn { font-size: 11px; color: var(--ink-dim); }
</style>

ixteenth-century anatomist thought the memory structure looked like one. It does.',clue:"Seahorse in the brain",cousins:["hippopotamus","hippodrome"]},{cat:"neuro",word:"amygdala",origin:'Greek amygdal\u0113, "almond". The fear centre is the size and shape of one.',clue:"Almond of fear",cousins:["almond"]},{cat:"neuro",word:"cortex",origin:'Latin cortex, "bark" of a tree. The thinking part of the brain is its bark.',clue:"Tree bark on the brain",cousins:["cork","decorticate"]},{cat:"neuro",word:"cerebellum",origin:'Latin: "little brain". Tucked under the big one, running your balance without asking.',clue:"Little brain",cousins:["cerebral","cerebrum"]},{cat:"neuro",word:"thalamus",origin:'Greek thalamos, "inner chamber, bedroom". The relay station at the centre of the brain was named for the innermost room of a Greek house.',clue:"Bedroom at the centre of the brain",cousins:["epithalamium"]},{cat:"neuro",word:"dopamine",origin:"From DOPA, its chemical parent (dihydroxyphenylalanine), plus amine. Named 1957. The name is a chemist's abbreviation; the reputation came later.",clue:"Reward chemical with an acronym for a name",cousins:["amine","amino"]},{cat:"neuro",word:"serotonin",origin:'Latin serum + Greek tonos ("tension"): a substance in blood serum that tightened blood vessels. Found in 1948, mood came later.',clue:"Blood-serum tightener turned mood chemical",cousins:["serum","tone","tonic"]},{cat:"neuro",word:"adrenaline",origin:'Latin ad ("near") + renes ("kidneys"): from the glands sitting on top of the kidneys. Named 1901.',clue:"Fight-or-flight, from next to the kidneys",cousins:["renal","adrenal"]},{cat:"neuro",word:"hormone",origin:`Greek hormaein, "to set in motion, urge on". Coined 1905 by Starling for the body's chemical messengers.`,clue:"Chemical messenger that urges on",cousins:[]},{cat:"neuro",word:"placebo",origin:'Latin placebo, "I shall please": the first word of the Vespers for the dead, then a flatterer, then a medicine given to please rather than cure.',clue:"I shall please, in Latin",cousins:["please","pleasant","placid"]},{cat:"neuro",word:"psychedelic",origin:'Greek psych\u0113 ("mind") + d\u0113loun ("to make visible"): mind-manifesting. Coined in 1956 by Humphry Osmond in a letter to Aldous Huxley, in rhyme.',clue:"Mind-manifesting, coined in a rhyme to Huxley",cousins:["psyche","psychology"]},{cat:"neuro",word:"psychology",origin:'Greek psych\u0113 ("breath, soul") + logia ("study"). The soul was breath before it was mind.',clue:"Study of the breath-soul",cousins:["psyche","psychiatry","psychedelic"]},{cat:"neuro",word:"schizophrenia",origin:'Greek skhizein ("to split") + phr\u0113n ("mind"). Coined 1908 by Bleuler. It never meant split personality; it meant a mind split from itself.',clue:"Split mind, misunderstood since 1908",cousins:["schism","frenetic","frantic"]},{cat:"neuro",word:"delirium",origin:'Latin delirare, "to go off the furrow", from lira, the ridge a plough leaves. A ploughman who wandered from the line.',clue:"Off the plough's furrow",cousins:["delirious"]},{cat:"neuro",word:"trauma",origin:'Greek trauma, "wound". Physical only until the 1890s, when Freud and others moved it inside.',clue:"Wound that moved inside",cousins:["traumatic"]},{cat:"neuro",word:"anxiety",origin:'Latin angere, "to choke, squeeze". Anger and angina are the same throat.',clue:"A choking, in Latin",cousins:["anger","angina","anguish"]},{cat:"neuro",word:"insulin",origin:'Latin insula, "island", for the islets of Langerhans in the pancreas that make it. Named 1916, isolated 1921.',clue:"Hormone from little islands",cousins:["island","insular","peninsula","isolate"]},{cat:"neuro",word:"virus",origin:'Latin virus, "poison, slimy liquid, venom". It meant any infectious agent until microscopes found the actual thing in the 1890s.',clue:"Slime and poison, in Latin",cousins:["virulent"]},{cat:"neuro",word:"bacteria",origin:'Greek bakt\u0113rion, "little staff", for the rod shapes first seen. Named 1838.',clue:"Little staffs under the microscope",cousins:[]},{cat:"neuro",word:"caffeine",origin:"German Kaffein, from Kaffee, isolated in 1819 by Runge, at Goethe's suggestion.",clue:"Stimulant Goethe asked a chemist to find",cousins:["coffee","caf\xE9"]},{cat:"neuro",word:"ketamine",origin:"Chemist's shorthand: keto- (a ketone group) + amine. Synthesised 1962 as a safer anaesthetic than PCP.",clue:"Anaesthetic named from two chemical groups",cousins:["amine","ketone"]},{cat:"neuro",word:"aspirin",origin:"Bayer, 1899: a- (acetyl) + spir- (from Spiraea, the meadowsweet plant that yields salicylic acid) + -in.",clue:"Painkiller named for meadowsweet",cousins:[]},{cat:"neuro",word:"philosophy",origin:'Greek philos ("loving") + sophia ("wisdom"). Pythagoras is said to have coined it because only the gods could be wise; humans could only love it.',clue:"Love of wisdom",cousins:["sophist","sophisticated","philanthropy"]},{cat:"neuro",word:"stoic",origin:'Greek stoa, "porch". Zeno taught under a painted colonnade in Athens; his students were the porch people.',clue:"Unmoved, from a porch in Athens",cousins:[]},{cat:"neuro",word:"cynic",origin:'Greek kynikos, "dog-like". Diogenes lived in a barrel, barked at Alexander, and took the insult as a title.',clue:"Dog-like philosopher",cousins:["canine"]},{cat:"neuro",word:"skeptic",origin:'Greek skeptikos, "given to looking about, inquiring". A skeptic was someone who kept looking rather than deciding.',clue:"One who keeps looking about",cousins:["scope","telescope"]},{cat:"neuro",word:"hedonism",origin:'Greek h\u0113don\u0113, "pleasure", from h\u0113dys, "sweet". Sweet is the same root, from the same tongue.',clue:"Pleasure-seeking, from the Greek for sweet",cousins:["sweet"]},{cat:"neuro",word:"nihilism",origin:`Latin nihil, "nothing". Coined in the 1810s, made famous by Turgenev's novel in 1862.`,clue:"Belief in nothing, from Latin for nothing",cousins:["annihilate","nil"]},{cat:"neuro",word:"paradox",origin:'Greek para ("against") + doxa ("opinion"): something contrary to what everyone thinks.',clue:"Against received opinion",cousins:["orthodox","dogma","doxology"]},{cat:"neuro",word:"utopia",origin:'Thomas More, 1516: Greek ou ("not") + topos ("place"). No-place. He knew.',clue:"No-place, coined by More",cousins:["topic","topography","dystopia"]},{cat:"neuro",word:"empathy",origin:'Coined 1909 to translate German Einf\xFChlung, "feeling into", a term from aesthetics about projecting yourself into a painting. People came later.',clue:"Feeling into, first for paintings",cousins:["sympathy","pathos","pathetic"]},{cat:"neuro",word:"atom",origin:'Greek atomos, "uncuttable". Named for the thing that could not be split. Then it was split.',clue:"Uncuttable, until 1938",cousins:["anatomy","tome","lobotomy"]},{cat:"neuro",word:"electron",origin:'Greek \u0113lektron, "amber". Rub amber and it sparks; the Greeks noticed, and the word waited two thousand years for the particle.',clue:"Amber, waiting for its particle",cousins:["electric","electricity"]},{cat:"neuro",word:"entropy",origin:'Greek en ("in") + trop\u0113 ("turning"), coined 1865 by Clausius on the model of energy. The measure of things turning in on themselves.',clue:"A turning-in, coined to rhyme with energy",cousins:["trope","tropical","heliotrope"]},{cat:"neuro",word:"quantum",origin:'Latin quantum, "how much". Planck used it in 1900 for the smallest amount of energy that could exist. The word means a quantity; the physics made it mean the smallest one.',clue:"How much, in Latin",cousins:["quantity","quantify"]},{cat:"neuro",word:"hypothesis",origin:'Greek hypo ("under") + thesis ("a placing"): the thing you put underneath an argument to hold it up.',clue:"What you place under an argument",cousins:["thesis","synthesis","antithesis"]},{cat:"neuro",word:"theory",origin:'Greek the\u014Dria, "a looking at, contemplation", from the\u014Dros, spectator. Theatre is the same gaze.',clue:"A looking-at, same gaze as theatre",cousins:["theatre","theorem"]},{cat:"neuro",word:"dementia",origin:`Latin de ("out of") + mens ("mind"). Out of one's mind, as a medical term since the 1700s.`,clue:"Out of mind, in Latin",cousins:["mental","mention","demented"]},{cat:"neuro",word:"catatonia",origin:'Greek kata ("down") + tonos ("tension"): a tension pulled all the way down. Named 1874.',clue:"Tension pulled down",cousins:["tone","tonic"]}]});var Ee=C((_t,Ie)=>{"use strict";Ie.exports=[{cat:"neuro",word:"autopsy",origin:`Greek autopsia, "seeing for oneself". The examiner looks rather than takes anyone's word for it.`,clue:"Seeing for yourself, on a slab",cousins:["optic","synopsis","biopsy"]},{cat:"neuro",word:"coroner",origin:`Anglo-Norman corouner, the officer of the crown who recorded deaths and the king's share of the dead's goods. From Latin corona, "crown".`,clue:"Crown officer of the dead",cousins:["crown","corona","coronation"]},{cat:"neuro",word:"morgue",origin:'La Morgue, the Paris building where unidentified bodies were laid out for viewing. Earlier a prison room where new arrivals were stared at; French morguer, "to look at haughtily".',clue:"Paris viewing room for the unclaimed",cousins:[]},{cat:"neuro",word:"surgeon",origin:'Greek kheirourgos, "working by hand": kheir ("hand") + ergon ("work"). A surgeon is a hand-worker; a physician only had to think.',clue:"One who works by hand",cousins:["energy","chiropractor","chirography"]},{cat:"neuro",word:"hospital",origin:'Latin hospitalis, "of a guest". A place for guests before it was a place for the sick. Hostel, hotel and hospice are the same house.',clue:"Guest house for the sick",cousins:["hostel","hotel","hospice","hospitality","host"]},{cat:"neuro",word:"patient",origin:'Latin patiens, "suffering, enduring". The one who suffers, and the virtue of putting up with it.',clue:"The one who suffers",cousins:["passion","passive","compassion"]},{cat:"neuro",word:"doctor",origin:'Latin doctor, "teacher", from docere, "to teach". The medical sense arrived in the 1300s; the teaching sense never left.',clue:"Teacher, before physician",cousins:["doctrine","document","docile"]},{cat:"neuro",word:"symptom",origin:'Greek symptoma, "a happening, a falling together": syn + piptein ("to fall"). What befalls you.',clue:"A falling-together",cousins:["syndrome"]},{cat:"neuro",word:"syndrome",origin:'Greek syndrom\u0113, "a running together": syn + dromos ("running"). Several signs arriving at once.',clue:"A running-together of signs",cousins:["hippodrome","palindrome","symptom"]},{cat:"neuro",word:"coma",origin:'Greek k\u014Dma, "deep sleep". Cemetery, "sleeping place", is a cousin: both from the same root for lying down.',clue:"Deep sleep, in Greek",cousins:["cemetery"]},{cat:"neuro",word:"lethargy",origin:'Greek l\u0113thargia, from l\u0113th\u0113, "forgetfulness", the river the dead drank from. Lethal is a relative by way of Latin.',clue:"Torpor from the river of forgetting",cousins:["lethal"]},{cat:"neuro",word:"hypnosis",origin:'Greek hypnos, "sleep", the god of it. Coined in the 1840s by James Braid, who regretted it: the state, he said, was not sleep.',clue:"Named for the god of sleep, wrongly",cousins:["hypnotic"]},{cat:"neuro",word:"autism",origin:'Greek autos, "self". Coined 1911 by Bleuler for withdrawal into the self; given its modern sense by Kanner and Asperger in the 1940s.',clue:"Self, as a diagnosis",cousins:["automatic","autonomy","autopsy"]},{cat:"neuro",word:"mania",origin:'Greek mania, "madness", from mainesthai, "to rage". Mantis, the seer, and mantic prophecy come from the same frenzy.',clue:"Madness, in Greek",cousins:["maniac","mantis","mantic"]},{cat:"neuro",word:"phobia",origin:'Greek phobos, "fear, flight", the personified panic that sends armies running. Deimos and Phobos, the moons of Mars, are Terror and Fear.',clue:"Fear that makes you run",cousins:["phobos"]},{cat:"neuro",word:"delusion",origin:'Latin deludere, "to play false, mock": de + ludere ("to play"). The mind playing a trick on its owner.',clue:"The mind playing false",cousins:["ludicrous","illusion","allude","prelude"]},{cat:"neuro",word:"apathy",origin:'Greek apatheia, "without feeling", a Stoic ideal before it was a complaint.',clue:"Without feeling, once a virtue",cousins:["pathos","sympathy","empathy","pathetic"]},{cat:"neuro",word:"euphoria",origin:'Greek euphoria, "power of bearing easily", from eu + pherein ("to carry"). A medical word for feeling well that became a word for feeling too well.',clue:"Bearing easily",cousins:["metaphor","phosphorus","fertile"]},{cat:"neuro",word:"catharsis",origin:'Greek katharsis, "purging, cleansing". Aristotle used it for what tragedy does to the audience; doctors used it for laxatives.',clue:"Purging, by tragedy or laxative",cousins:["cathartic","catherine"]},{cat:"neuro",word:"stigma",origin:'Greek stigma, "mark, brand", the tattoo pricked into a slave or criminal. The plural stigmata went to the saints.',clue:"A brand on a slave",cousins:["stick","instinct","distinct"]},{cat:"neuro",word:"charisma",origin:'Greek kharisma, "gift of grace", a favour from the gods. Theology until Max Weber lent it to politics in the 1920s.',clue:"Gift of grace, lent to politicians",cousins:["charity","eucharist"]},{cat:"neuro",word:"sadism",origin:"The Marquis de Sade, whose novels made cruelty a philosophy. The word arrived in the 1880s, a century after his books.",clue:"Cruelty named for a marquis",cousins:[]},{cat:"neuro",word:"masochism",origin:"Leopold von Sacher-Masoch, author of Venus in Furs. Krafft-Ebing named the condition after him in 1886, to his lasting irritation.",clue:"Named for a novelist who objected",cousins:[]},{cat:"neuro",word:"fetish",origin:`Portuguese feiti\xE7o, "charm, sorcery", from Latin facticius, "made by art". Traders' word for West African objects of worship; the psychology came in 1887.`,clue:"A made charm",cousins:["fact","factory","artificial"]},{cat:"neuro",word:"taboo",origin:'Tongan tapu, "forbidden, set apart". Captain Cook brought it back in 1777.',clue:"Forbidden, from Tonga",cousins:[]},{cat:"neuro",word:"nirvana",origin:'Sanskrit nirv\u0101\u1E47a, "blowing out", as of a candle. The extinction of desire, not a place.',clue:"A candle blown out",cousins:[]},{cat:"neuro",word:"karma",origin:'Sanskrit karman, "act, deed". The word means the doing; the consequence is the doctrine.',clue:"Deed, in Sanskrit",cousins:[]},{cat:"neuro",word:"mantra",origin:'Sanskrit mantra, "instrument of thought", from man, "to think". Mind is the same root.',clue:"Instrument of thought",cousins:["mind","mental","mention","monument"]},{cat:"neuro",word:"yoga",origin:'Sanskrit yoga, "yoking, union". Yoke, in English, is its cousin.',clue:"A yoking",cousins:["yoke","join","junction","conjugal"]},{cat:"neuro",word:"agnostic",origin:'Coined by Thomas Huxley in 1869: Greek a- ("not") + gn\u014Dstos ("known"). A confession of not knowing, dressed as a position.',clue:"Not knowing, coined by Huxley",cousins:["know","diagnosis","ignore","noble"]},{cat:"neuro",word:"academy",origin:"Akad\u0113meia, the grove outside Athens where Plato taught, named for the hero Akademos.",clue:"Plato's grove",cousins:["academic"]},{cat:"neuro",word:"paradigm",origin:'Greek paradeigma, "pattern, example", from para + deiknynai ("to show"). Grammar-school word until Kuhn made it a revolution in 1962.',clue:"A pattern shown beside",cousins:["policy","teach","token","digit"]},{cat:"neuro",word:"rhetoric",origin:'Greek rh\u0113torik\u0113, the art of the rh\u0113t\u014Dr, the public speaker. From a root meaning "to say"; word and verb are distant cousins.',clue:"The speaker's art",cousins:["word","verb","irony"]},{cat:"neuro",word:"oxygen",origin:'Greek oxys ("sharp, acid") + -gen\u0113s ("producing"). Lavoisier named it "acid-maker" in 1777. He was wrong; the name stayed.',clue:"Acid-maker, mistakenly",cousins:["oxide","acid","acute"]},{cat:"neuro",word:"helium",origin:`Greek h\u0113lios, "sun". Found in the sun's spectrum in 1868, twenty-seven years before anyone found it on Earth.`,clue:"Found in the sun first",cousins:["heliotrope","solar"]},{cat:"neuro",word:"energy",origin:`Greek energeia, "activity, being at work": en + ergon. Aristotle's word; physics took it in 1807.`,clue:"At work, in Greek",cousins:["surgeon","organ","work","liturgy"]},{cat:"neuro",word:"gravity",origin:'Latin gravitas, "weight, heaviness", also seriousness. Newton borrowed the word for the force; the Romans meant your bearing.',clue:"Heaviness, of bodies and of manner",cousins:["grave","grief","aggravate"]},{cat:"neuro",word:"chemistry",origin:'From alchemy, Arabic al-k\u012Bmiy\u0101, itself from Greek kh\u0113meia, possibly "the Egyptian art". The al- fell off in the 1600s when the discipline wanted respectability.',clue:"Alchemy with the al- dropped",cousins:["alchemy","chemical"]},{cat:"street",word:"booze",origin:'Middle Dutch b\u016Bsen, "to drink to excess". In English since the 1300s, mostly in the mouths of people who did.',clue:"Drink to excess, from Dutch",cousins:[]},{cat:"street",word:"hooch",origin:"The Hoochinoo, a Tlingit village in Alaska that distilled a liquor sold to soldiers and miners in the 1870s.",clue:"Liquor from an Alaskan village",cousins:[]},{cat:"street",word:"bogus",origin:"Ohio, 1827: the name of a machine for stamping counterfeit coins. Then the coins, then anything fake.",clue:"Fake, from a counterfeiting machine",cousins:[]},{cat:"street",word:"phony",origin:'From the fawney rig, a con in which a gilt ring (Irish f\xE1inne) was "dropped" and sold to the finder as gold.',clue:"Fake, from a dropped brass ring",cousins:[]},{cat:"street",word:"geek",origin:'Carnival slang for the performer who bit the heads off chickens, from geck, "fool", of Germanic origin. Computers came later.',clue:"Carnival chicken-biter",cousins:[]},{cat:"street",word:"nerd",origin:"First seen in Dr. Seuss's If I Ran the Zoo, 1950, as an imaginary creature. Slang for a dull studious person within a year.",clue:"A creature from Dr. Seuss",cousins:[]},{cat:"street",word:"thug",origin:'Hindi \u1E6Dhag, "swindler, deceiver". The Thuggee were bands who strangled travellers in India; the British made the word mean any brute.',clue:"Swindler, from Hindi",cousins:[]},{cat:"street",word:"mob",origin:'Latin mobile vulgus, "the fickle crowd", shortened by the 1680s. Swift complained about the abbreviation.',clue:"The fickle crowd, cut short",cousins:["mobile","motion","move"]},{cat:"street",word:"ghetto",origin:'The Venetian quarter where Jews were confined from 1516, probably from getto, "foundry", which stood there.',clue:"Venice's foundry quarter",cousins:[]},{cat:"street",word:"con",origin:"Short for confidence man: William Thompson, New York, 1849, who asked strangers whether they had the confidence to lend him their watch.",clue:"Short for a man who asked for your watch",cousins:["confidence","confide","faith"]},{cat:"street",word:"shyster",origin:'Probably German Scheisser, "one who defecates", applied to disreputable New York lawyers in the 1840s.',clue:"Crooked lawyer, from a German insult",cousins:[]},{cat:"street",word:"smack",origin:'Heroin, from Yiddish shmek, "a sniff, a smell". In American slang by the 1940s.',clue:"Heroin, from Yiddish for a sniff",cousins:[]},{cat:"street",word:"joint",origin:'French joint, "joined". A shared place (the joint) in the 1800s, then an opium den, then the cigarette passed around in it by the 1930s.',clue:"A shared place, then what was shared",cousins:["join","junction","yoga"]},{cat:"street",word:"stash",origin:"Thieves' cant, 1790s, meaning to hide. Possibly a blend of stow and cache.",clue:"Hide, in thieves' cant",cousins:["stow","cache"]},{cat:"street",word:"loot",origin:'Hindi l\u016B\u1E6D, "plunder", from Sanskrit. Brought home by the British army in the 1780s along with the plunder.',clue:"Plunder, from Hindi",cousins:[]},{cat:"street",word:"swag",origin:"Thieves' slang for booty, 1794, from swag meaning a swaying bundle. Australian tramps carried one; rappers reclaimed it.",clue:"A thief's bundle",cousins:["swagger","sway"]},{cat:"street",word:"cop",origin:"To cop is to seize, from French caper, Latin capere. A copper was one who seized you; cop is the copper cut short.",clue:"One who seizes you",cousins:["capture","captive","capable","catch"]},{cat:"street",word:"snitch",origin:"Slang for the nose, 1600s. An informer was a nose, then a snitch, by the 1780s.",clue:"A nose that talks",cousins:[]},{cat:"street",word:"hustle",origin:'Dutch husselen, "to shake, toss". To jostle, then to hurry, then to hurry someone out of their money.',clue:"A shaking, from Dutch",cousins:[]},{cat:"street",word:"grift",origin:"American, 1900s, from graft, the corrupt kind, itself from the gardening graft: something added on the side.",clue:"A crooked graft",cousins:["graft"]},{cat:"street",word:"racket",origin:"A noise, 1500s. By the 1810s a noisy scheme; by the 1890s a criminal one.",clue:"A noise that became a crime",cousins:[]},{cat:"street",word:"clout",origin:'Old English cl\u016Bt, "a patch of cloth", then a blow. Influence is Chicago politics, 1860s: the pull to strike.',clue:"A patch, a blow, then pull",cousins:[]},{cat:"street",word:"beef",origin:"A complaint, American 1880s, possibly from soldiers' grumbling about rations. The quarrel came from the complaint.",clue:"A grievance, from grumbled rations",cousins:["bovine","cow"]},{cat:"street",word:"diss",origin:"Short for disrespect, in hip-hop by the early 1980s. The Oxford dictionary caught up in 1989.",clue:"Disrespect, cut short",cousins:["disrespect","respect"]},{cat:"street",word:"bling",origin:"Cash Money Millionaires, 1999, imitating the sound of light hitting jewellery. The dictionary added it in 2003.",clue:"The sound of light on jewellery",cousins:[]},{cat:"street",word:"shade",origin:"To throw shade: ballroom culture, New York, recorded in Paris Is Burning (1990). An insult that doesn't have to be spoken.",clue:"Thrown, in the ballroom",cousins:["shadow"]},{cat:"street",word:"woke",origin:'Black American English, "stay woke": awake to injustice. Lead Belly used it in 1938 about the Scottsboro Boys.',clue:"Awake, since Lead Belly",cousins:["wake","watch"]},{cat:"street",word:"salty",origin:"US Navy slang for a seasoned sailor, then for a sailor's temper. Bitter about losing, since the 1930s.",clue:"A sailor's temper",cousins:["salt","salary","salad"]},{cat:"street",word:"stan",origin:"Eminem, 2000: the obsessed fan in the song of that name. A verb by 2010, a dictionary entry by 2017.",clue:"A fan named by Eminem",cousins:[]},{cat:"street",word:"simp",origin:"Short for simpleton, American, 1900s. Revived a century later with a narrower target.",clue:"Simpleton, shortened twice over",cousins:["simple"]},{cat:"street",word:"sus",origin:'British police slang for suspect, 1930s; the "sus laws" let officers stop anyone who looked it. Revived by a video game in 2020.',clue:"Suspect, cut short by police",cousins:["suspect","suspicion"]},{cat:"street",word:"lit",origin:"Drunk, 1910s: lit up like a lamp. A century later it meant the party was, too.",clue:"Drunk, like a lamp",cousins:["light"]},{cat:"street",word:"cap",origin:'To cap, in Black American English, is to boast or exaggerate, recorded in the early 1900s. "No cap": no exaggeration.',clue:"A boast, or the lack of one",cousins:[]},{cat:"street",word:"vibe",origin:"Short for vibration, in the sense of a feeling picked up from a person or place. Beach Boys, 1966, and the word never went home.",clue:"A vibration you can feel from someone",cousins:["vibration","vibrato"]},{cat:"street",word:"crib",origin:"A manger, then a hovel, then thieves' cant for a house (1600s), then a home worth showing off.",clue:"A manger that became a mansion",cousins:[]},{cat:"street",word:"dude",origin:"New York, 1883: a dandy in too-tight clothes. Origin uncertain; one guess is Yankee Doodle. It took a century to mean anyone.",clue:"A dandy of 1883",cousins:[]},{cat:"street",word:"jazz",origin:"American, about 1912, first for energy and pep on the West Coast, then for the music in Chicago by 1915. Origin unknown; the theories are louder than the evidence.",clue:"Pep before it was music",cousins:[]},{cat:"street",word:"buck",origin:"A dollar, from buckskins, the unit of trade on the frontier in the 1700s. The deer paid first.",clue:"A dollar, from deerskin",cousins:[]},{cat:"street",word:"scam",origin:"Carnival slang, 1960s, of unknown origin. Nobody involved wanted to leave a paper trail.",clue:"A con with no paper trail",cousins:[]},{cat:"street",word:"narc",origin:'Short for narcotics agent, 1960s. Older British slang had nark, an informer, from Romani nak, "nose".',clue:"Agent, or nose",cousins:["narcotic"]}]});var oe=C((Vt,Ge)=>{"use strict";Ge.exports=[{cat:"pharmacopoeia",word:"assassin",origin:'Arabic \u1E25ashsh\u0101sh\u012Bn, "hashish-eaters": the slur hostile chroniclers pinned on the Nizari Ismaili sect, whose agents killed political targets from mountain fortresses. Whether they actually used hashish is disputed. The slur outlived them.',clue:"Hired killer with hashish in the name",cousins:["hashish"]},{cat:"pharmacopoeia",word:"morphine",origin:"Named in 1817 by the German pharmacist Sert\xFCrner after Morpheus, Greek god of dreams, for what it did to his test subjects. He was one of them.",clue:"Opiate named for the god of dreams",cousins:["morph","amorphous","metamorphosis"]},{cat:"pharmacopoeia",word:"heroin",origin:'A Bayer trademark, 1898, from German heroisch, "heroic", for how it made patients feel. Marketed as a non-addictive cough remedy and a cure for morphine addiction.',clue:"Bayer's heroic cough medicine",cousins:["hero","heroic"]},{cat:"pharmacopoeia",word:"nicotine",origin:"From Jean Nicot, French ambassador to Portugal, who sent tobacco to the French court in 1560 as a medicine.",clue:"Alkaloid named for a French ambassador",cousins:[]},{cat:"pharmacopoeia",word:"narcotic",origin:'Greek nark\u0113, "numbness, stupor". Narcolepsy is the same root; so, by one account, is narcissus, the flower whose scent was said to stupefy.',clue:"Numbing drug, from the Greek for stupor",cousins:["narcolepsy","narcissus","narcosis"]},{cat:"pharmacopoeia",word:"toxic",origin:'Greek toxon, "bow". Toxikon pharmakon was the poison smeared on arrowheads. The bow was forgotten; the poison stayed.',clue:"Poisonous, from the Greek for a bow",cousins:["intoxicate","toxin","detox"]},{cat:"pharmacopoeia",word:"intoxicate",origin:'Medieval Latin intoxicare, "to poison". Being drunk is, etymologically, being poisoned. The pleasant sense arrived in the 1500s.',clue:"Poison yourself, pleasantly",cousins:["toxic","toxin"]},{cat:"pharmacopoeia",word:"addict",origin:"Latin addictus: in Roman law, a debtor handed over to a creditor as a bonded slave. To be addicted is to be legally awarded to something.",clue:"Debtor handed over to a creditor, in Rome",cousins:["dictate","dictionary","verdict","edict","predict"]},{cat:"pharmacopoeia",word:"alcohol",origin:"Arabic al-ku\u1E25l, the powdered antimony used as eyeliner. Alchemists stretched it to any fine powder or distilled essence; by the 1700s it meant the spirit of wine.",clue:"Spirit that began as Arabic eyeliner",cousins:["kohl"]},{cat:"pharmacopoeia",word:"sober",origin:'Latin sobrius, from se- ("without") + ebrius ("drunk"). Inebriated is the same root going the other way.',clue:"Not drunk, in Latin",cousins:["inebriated"]},{cat:"pharmacopoeia",word:"ecstasy",origin:'Greek ekstasis, "standing outside oneself". A displacement of the mind: first mystical, then chemical.',clue:"Standing outside yourself, in Greek",cousins:["static","stasis","stand"]},{cat:"pharmacopoeia",word:"opium",origin:'Greek opion, "poppy juice", diminutive of opos, "sap".',clue:"Poppy juice",cousins:["opiate","opioid"]},{cat:"pharmacopoeia",word:"cocaine",origin:"From coca, the Andean leaf, via Quechua kuka, plus the chemists' -ine. Isolated 1860, named in English by 1874.",clue:"Alkaloid from a Quechua leaf",cousins:["coca"]},{cat:"pharmacopoeia",word:"cannabis",origin:"Greek kannabis, borrowed from a Scythian or Thracian source. Canvas, once woven from hemp, is the same word wearing different clothes.",clue:"Plant that gave its name to canvas",cousins:["canvas","hemp"]},{cat:"pharmacopoeia",word:"junkie",origin:"From junk, 1920s American slang for narcotics, itself from junk meaning old rope, then rubbish.",clue:"Addict, from old rope",cousins:["junk"]},{cat:"pharmacopoeia",word:"dope",origin:'Dutch doop, "sauce, dipping". Thick liquids, then opium (smoked as a thick syrup), then any drug, then a fool.',clue:"Drug word from a Dutch sauce",cousins:["dip"]},{cat:"pharmacopoeia",word:"hangover",origin:"Something that hangs over from the night before. First recorded in 1894 meaning a survival or leftover; medical by 1904.",clue:"What survives the night before",cousins:["hang","over"]},{cat:"pharmacopoeia",word:"pharmacy",origin:"Greek pharmakon: drug, poison, or spell, depending on dose and intent. The Greeks did not distinguish; neither does the body.",clue:"From a Greek word meaning both remedy and poison",cousins:["pharmaceutical"]},{cat:"pharmacopoeia",word:"venom",origin:"Latin venenum, originally a love potion or charm, from Venus. Then any potion. Then poison.",clue:"Poison that began as a love potion",cousins:["venus","venerate","venereal"]},{cat:"pharmacopoeia",word:"anesthesia",origin:'Greek an- ("without") + aisth\u0113sis ("sensation"). Oliver Wendell Holmes suggested the word in 1846 to the dentist who had just used ether on a patient.',clue:"Without feeling",cousins:["aesthetic","synesthesia"]},{cat:"pharmacopoeia",word:"whiskey",origin:'Irish uisce beatha, "water of life". Latin aqua vitae, French eau-de-vie, Scandinavian akvavit: every culture told itself the same lie.',clue:"Water of life, in Gaelic",cousins:["water"]},{cat:"pharmacopoeia",word:"vodka",origin:'Russian voda, "water", with a diminutive ending. Little water.',clue:"Little water, in Russian",cousins:["water"]},{cat:"pharmacopoeia",word:"coffee",origin:"Arabic qahwa, which may originally have meant wine, via Turkish kahve. The Ottoman coffeehouse was periodically banned as a den of sedition.",clue:"Arabic wine that became a morning drink",cousins:["caf\xE9","cafeteria"]},{cat:"mind",word:"paranoia",origin:'Greek para ("beside") + nous ("mind"). A mind that has slipped to one side.',clue:"Beside one's mind",cousins:["paranormal","parallel","parasite"]},{cat:"mind",word:"hysteria",origin:'Greek hystera, "womb". For two thousand years the diagnosis assumed the patient had one.',clue:"Wandering-womb diagnosis",cousins:["hysterectomy"]},{cat:"mind",word:"melancholy",origin:'Greek melas ("black") + khol\u0113 ("bile"). Humoral medicine blamed sadness on an excess of black bile, and prescribed purging.',clue:"Sadness from black bile",cousins:["melanin","melanoma","cholera","choleric"]},{cat:"mind",word:"nostalgia",origin:'Coined in 1688 by a Swiss medical student from Greek nostos ("homecoming") + algos ("pain"), to name a disease killing Swiss mercenaries posted abroad. Treatment: send them home.',clue:"Homesickness, once a fatal diagnosis",cousins:["analgesic","neuralgia"]},{cat:"mind",word:"lunatic",origin:'Latin luna, "moon". Madness was thought to wax and wane with the phases.',clue:"Mad by moonlight",cousins:["lunar"]},{cat:"mind",word:"lobotomy",origin:'Greek lobos ("lobe") + tom\u0113 ("a cutting"). Its inventor received the Nobel Prize in Medicine in 1949.',clue:"Nobel-winning brain cut",cousins:["anatomy","atom","tome","epitome"]},{cat:"mind",word:"idiot",origin:"Greek idi\u014Dt\u0113s, a private person: one who took no part in public life. The Athenians thought that was contemptible. The insult followed.",clue:"Private citizen, in Athens",cousins:["idiom","idiosyncrasy"]},{cat:"mind",word:"moron",origin:'Greek m\u014Dros, "dull, foolish". Adopted in 1910 by the psychologist Henry Goddard as a clinical grade of intelligence, one step above imbecile.',clue:"Clinical grade from 1910, now just an insult",cousins:["oxymoron","sophomore"]},{cat:"mind",word:"cretin",origin:'Swiss French crestin, "Christian", applied to people with congenital hypothyroidism in Alpine valleys. The point was that they were still human. The word forgot the point.',clue:"Slur that began by insisting on humanity",cousins:["christian"]},{cat:"mind",word:"stupid",origin:'Latin stupere, "to be stunned, struck senseless". Stupendous is the same root: something that stuns.',clue:"Stunned senseless",cousins:["stupor","stupendous"]},{cat:"mind",word:"fanatic",origin:'Latin fanaticus, "of a temple", frenzied by a god. Fan, the sports kind, is its clipped American descendant.',clue:"Temple-mad",cousins:["profane","fan"]},{cat:"mind",word:"enthusiasm",origin:'Greek enthousiasmos, "possessed by a god": en + theos. In the 1600s it was an accusation.',clue:"Divine possession, now mere keenness",cousins:["theology","atheist","pantheon"]},{cat:"mind",word:"panic",origin:"From Pan, the goat-legged god, whose shout was said to scatter armies in the night.",clue:"Terror from a goat god",cousins:[]},{cat:"mind",word:"nightmare",origin:"The mare was a demon that sat on a sleeper's chest and crushed the breath out. No horse was ever involved.",clue:"Chest-sitting demon, not a horse",cousins:[]},{cat:"mind",word:"genius",origin:"Latin genius: the guardian spirit assigned to each person at birth. It became a talent, then a person with one.",clue:"Guardian spirit turned IQ score",cousins:["genie","gene","genre","gender","generate"]},{cat:"body",word:"cadaver",origin:'Latin cadaver, from cadere, "to fall". A corpse is one who has fallen. Casualty, decadent and accident are the same fall.',clue:"Body that has fallen, in Latin",cousins:["cadence","decadent","accident","casualty"]},{cat:"body",word:"sarcasm",origin:'Greek sarkazein, "to tear flesh", from sarx, "flesh".',clue:"Wit that strips flesh",cousins:["sarcophagus","sarcoma"]},{cat:"body",word:"sarcophagus",origin:'Greek sarkophagos, "flesh-eating". A limestone quarried near Assos was believed to consume a corpse within weeks, so coffins were made from it.',clue:"Flesh-eating stone coffin",cousins:["sarcasm","sarcoma","esophagus"]},{cat:"body",word:"euthanasia",origin:'Greek eu ("good") + thanatos ("death"). For centuries it meant only dying well; the doctor with the syringe is a nineteenth-century addition.',clue:"A good death, in Greek",cousins:["euphemism","eulogy","thanatology"]},{cat:"body",word:"cemetery",origin:'Greek koim\u0113t\u0113rion, "sleeping place". Early Christians preferred it to the pagan necropolis, "city of the dead". Same residents.',clue:"Sleeping place, euphemistically",cousins:["coma"]},{cat:"body",word:"macabre",origin:"From the French danse macabre, the medieval dance of death. Probably from the Maccabees, whose martyrdoms were a popular subject for the dance.",clue:"Gruesome, from a dance of death",cousins:[]},{cat:"body",word:"ghoul",origin:"Arabic gh\u016Bl, a desert demon that robs graves and eats the dead. Entered English through a translation of the Arabian Nights in 1786.",clue:"Grave-robbing demon from Arabic",cousins:[]},{cat:"body",word:"zombie",origin:'Haitian Creole zonbi, from West African languages (Kikongo nzambi, "god", or zumbi, "fetish"). A body reanimated and enslaved by a sorcerer, which is to say, a labour metaphor.',clue:"Reanimated corpse, via Haiti",cousins:[]},{cat:"body",word:"nausea",origin:'Greek nausia, "seasickness", from naus, "ship". The word left the ship; the feeling did not.',clue:"Seasickness, before it left the ship",cousins:["nautical","navy","astronaut"]},{cat:"body",word:"muscle",origin:'Latin musculus, "little mouse", for the way a flexed bicep moves under the skin. Mussel is the same word.',clue:"Little mouse under the skin",cousins:["mussel","mouse"]},{cat:"body",word:"quarantine",origin:'Italian quaranta giorni, "forty days": how long plague-era Venice held ships offshore before letting anyone ashore.',clue:"Forty days in the harbour",cousins:["quart","quarter"]},{cat:"body",word:"malaria",origin:'Italian mala aria, "bad air". The swamp air took the blame for centuries before the mosquito did.',clue:"Bad-air fever",cousins:["malice","malady","aria","air"]},{cat:"body",word:"vaccine",origin:`Latin vacca, "cow". Jenner scratched cowpox into a boy's arm in 1796 and the cow has been in the word ever since.`,clue:"Shot that comes from a cow",cousins:["vaquero","buckaroo"]},{cat:"body",word:"pupil",origin:`Latin pupilla, "little doll": the tiny reflection of yourself you see in someone else's eye.`,clue:"Eye part, or a little doll",cousins:["puppet","puppy"]},{cat:"body",word:"tremendous",origin:'Latin tremendus, "to be trembled at". Huge enough to make you shake.',clue:"Huge enough to make you tremble",cousins:["tremble","tremor"]},{cat:"sex",word:"orchid",origin:'Greek orkhis, "testicle", for the shape of the paired root tubers. Botanists have never been subtle.',clue:"Flower named for testicles",cousins:[]},{cat:"sex",word:"avocado",origin:'Nahuatl \u0101huacatl, which also meant testicle. Spanish reshaped it toward abogado, "lawyer", which is not an improvement.',clue:"Fruit that meant testicle in Nahuatl",cousins:["guacamole"]},{cat:"sex",word:"pencil",origin:`Latin penicillus, "little tail", a painter's fine brush: the diminutive of penis, "tail". Penicillin is the brush-shaped mould.`,clue:"Writing tool that is a little tail",cousins:["penicillin","penis"]},{cat:"sex",word:"vanilla",origin:'Spanish vainilla, "little pod", diminutive of vaina, "sheath", from Latin vagina. The plainest flavour has the least plain name.',clue:"Flavour named for a little sheath",cousins:["vagina"]},{cat:"sex",word:"porcelain",origin:`Italian porcellana, the cowrie shell, from porcella, "little sow": the shell's opening was compared to a sow's vulva. Fine china got the shell's sheen and its name.`,clue:"Fine china named for a little sow",cousins:["pork","porcupine","porpoise"]},{cat:"sex",word:"musk",origin:`Sanskrit mu\u1E63ka, "testicle", for the shape of the deer's scent gland.`,clue:"Perfume from a Sanskrit testicle",cousins:[]},{cat:"sex",word:"seminar",origin:'Latin seminarium, "seed-bed", from semen, "seed". A seminary is the same bed.',clue:"Seed-bed for graduate students",cousins:["semen","seminary","disseminate"]},{cat:"sex",word:"testify",origin:'Latin testis, "witness". The story that Romans swore on their testicles is folk etymology; the anatomical word is a later metaphor, a witness to virility.',clue:"Bear witness",cousins:["testament","contest","protest","testicle"]},{cat:"sex",word:"pornography",origin:'Greek porn\u0113 ("prostitute") + graphein ("to write"). The English word dates from the 1850s, coined to describe the frescoes of Pompeii.',clue:"Writing about prostitutes, in Greek",cousins:["graphic","photograph"]},{cat:"sex",word:"fornicate",origin:'Latin fornix, "arch, vault". Roman brothels operated in vaulted cellars under the arches.',clue:"Sin under a Roman arch",cousins:[]},{cat:"sex",word:"lewd",origin:'Old English l\u01E3wede, "lay, not clergy". Then unlettered, then vulgar, then lustful. The clergy wrote the dictionary.',clue:"Once just meant 'not a priest'",cousins:[]},{cat:"sex",word:"punk",origin:"In Shakespeare's day, a prostitute. By 1900, a young hoodlum. By 1976, a genre.",clue:"Elizabethan prostitute, now a genre",cousins:[]},{cat:"sex",word:"harlot",origin:"Old French herlot, a vagabond or rogue. Applied to men for three centuries before it settled on women.",clue:"Rogue that changed sex",cousins:[]},{cat:"sex",word:"bastard",origin:"Old French bastard, perhaps from bast, a packsaddle: a child conceived on a packsaddle rather than in a marriage bed. One account among several.",clue:"Packsaddle child, by one account",cousins:[]},{cat:"sex",word:"obscene",origin:'Latin obscenus, "ill-omened, filthy". The theatre story that it means "offstage" is not supported by anything.',clue:"Ill-omened, then filthy",cousins:[]},{cat:"sex",word:"profane",origin:'Latin pro fano, "in front of the temple", meaning outside it. Whatever was not consecrated.',clue:"Outside the temple",cousins:["fanatic"]},{cat:"insults",word:"villain",origin:"Latin villanus, a farmhand attached to a villa. The aristocracy's word for a peasant became everyone's word for a criminal.",clue:"Farmhand turned evildoer",cousins:["villa","village"]},{cat:"insults",word:"nice",origin:'Latin nescius, "ignorant". It meant foolish, then timid, then fussy, then fine, then pleasant. It has never once meant anything firmly.',clue:"Pleasant word that spent centuries meaning stupid",cousins:["science","omniscient","conscience"]},{cat:"insults",word:"silly",origin:'Old English s\u01E3lig, "blessed, happy". Blessed became innocent, innocent became harmless, harmless became feeble, feeble became foolish.',clue:"Foolish, from blessed",cousins:[]},{cat:"insults",word:"awful",origin:"Full of awe. It once meant inspiring reverence; awesome came from the same word and went the other way.",clue:"Awe-inspiring, gone bad",cousins:["awe","awesome"]},{cat:"insults",word:"sinister",origin:'Latin sinister, "left". The left side was unlucky in Roman augury, and left-handers have been paying for it since.',clue:"Evil, from the left hand",cousins:[]},{cat:"insults",word:"sardonic",origin:"From Sardinia. A Sardinian plant was said to cause facial convulsions resembling grim laughter, followed by death.",clue:"Grimly mocking, like a Sardinian poison",cousins:[]},{cat:"insults",word:"glamour",origin:"A Scots mangling of grammar. Book-learning was suspected of being magic; a glamour was a spell cast over the eyes.",clue:"Grammar that became a spell",cousins:["grammar","grimoire"]},{cat:"insults",word:"disaster",origin:'Italian disastro, from dis- + astro, "star". Ill-starred.',clue:"Calamity written in the stars",cousins:["astronomy","asterisk","astral"]},{cat:"insults",word:"hazard",origin:'Arabic az-zahr, "the dice", through Old French hasard, a dice g
