ogram","krypton","cryptocurrency"],notes:{grotto:"Italian grotta, from Latin crypta",grotesque:`the "grotto-work" found painted in Nero's buried Golden House`,krypton:'named "the hidden one" by Ramsay in 1898'},friends:[["crib","Old English cribb"],["creep","Old English creopan"],["crypt keeper","counts, obviously"]]},{word:"panic",level:1,cat:"money",origin:'The god of shepherds and wild places, whose shout scattered armies. Not the prefix meaning "all".',story:`Greek Pan, the goat-legged god of flocks and wild places, was blamed for the sudden groundless fear that seized travellers and armies in lonely country; panikos meant "of Pan". French panique carried it to English in the 1600s as an adjective, panic fear, and the noun followed. The god's name is probably from a root meaning "to feed", the same as pasture, so Pan is the feeder of flocks; the pan- of pandemic and panorama is a different Greek word meaning "all".`,family:["panicky","panpipes","Pan","pasture","pastor","repast","food","fodder"],notes:{pasture:`Pan's name is probably "the feeder", from the root that gives Latin pascere, to feed`,food:"the same feeding root by the Germanic road"},friends:[["pandemic","Greek pan-, all: a different word"],["panorama","pan- again"],["pancake","a pan, a vessel"]]},{word:"atlas",level:2,cat:"money",origin:"The Titan who held up the sky. A Flemish mapmaker put him on the cover of a book of maps in 1595 and the book took his name.",story:'Atlas was the Titan condemned to hold up the heavens; his name may mean "the bearer", from a Greek root for enduring. Mercator titled his 1595 collection of maps Atlas, with the Titan on the frontispiece, and within a century any book of maps was an atlas. The Atlantic is "the sea of Atlas", beyond the mountains that were said to be the giant turned to stone, and the atlas bone is the top vertebra, which holds up the head.',family:["Atlantic","Atlantis","atlantes","atlas moth","transatlantic"],notes:{atlantes:"the carved male figures that hold up a building","atlas moth":"named for its size"},friends:[["atlatl","Nahuatl, spear-thrower"],["at last","no"],["attic","Attica, the region of Athens"]]},{word:"nemesis",level:3,cat:"money",origin:'The Greek goddess who dealt out what was due. Her name comes from a verb meaning "to deal out, to allot", and that verb is behind several words about managing things.',story:'Greek nemein, "to deal out, distribute, pasture", gave Nemesis, "the dealer-out", the goddess of due portion and retribution, and English took her name for an unbeatable rival or a deserved downfall in the 1500s. Nomos, "that which is allotted", is law and custom, so astronomy is the law of the stars and economy the management (nemein) of a household (oikos). A nomad is one who pastures flocks, and nomisma, a coin, is what custom accepts, hence numismatic. The Germanic branch is niman, "to take": numb is "taken", and nimble is quick at taking.',family:["nomad","numismatic","economy","astronomy","autonomy","gastronomy","nimble","numb","taxonomy","agronomy","economic"],notes:{nomad:"Greek nomas, one who pastures flocks",numismatic:'Greek nomisma, current coin, "what custom allots"',numb:'Old English numen, "taken", seized',nimble:"Old English numol, quick at taking"},friends:[["enemy","Latin inimicus, not a friend"],["name","Old English nama"],["nemo","Latin, nobody"]]},{word:"thug",level:1,cat:"money",origin:'Hindi \u1E6Dhag, "a swindler, a cheat", from a Sanskrit word for cunning. The British turned it into a name for a murder cult and then for any brute.',story:'Hindi \u1E6Dhag, "cheat, deceiver", from Sanskrit sthaga, "cunning, fraudulent", named the Thugs, bands who befriended travellers on the roads of India and strangled them; the British suppressed them in the 1830s and the name entered English in 1810, meaning any violent ruffian by 1839. The Sanskrit root may mean "to cover, conceal".',family:["thuggery","thuggish","Thuggee"],notes:{},friends:[["thump","imitative"],["tug","Old English teon"],["thick","Old English thicce"]]},{word:"cop",level:3,cat:"money",origin:"To cop is to grab, from a French verb for seizing and, behind it, the Latin one. The slang for a policeman was one who grabbed you, first recorded in 1846.",story:'English cop, "to seize", appeared in the 1700s, probably from Old French caper, "to seize", from Latin capere, "to take". A copper was the man who copped you, and cop is the clipping, both from the 1850s. Capere is an enormous family: capture, capable ("able to hold"), receive, conceive, participate, occupy, recipe (the Latin imperative "take!"), and through Old North French, catch and chase. The Germanic branch of the root gives have, heave and heavy.',family:["copper","capture","captive","captivate","capable","capacity","catch","chase","purchase","accept","except","concept","deceive","receive","perceive","conceive","receipt","recipe","anticipate","participate","occupy","prince","municipal","heave","heavy","behave","have","capsule"],notes:{catch:"Old North French cachier, from Latin captiare, to try to seize",chase:"the same word by way of Old French chacier",recipe:'Latin, "take!", the first word of a prescription',prince:'Latin princeps, "taking first place"',municipal:'Latin municipium, a town that "takes duties"',heavy:'Old English hefig, "weighty", from the Germanic form of the seizing root',have:"Old English habban, the Germanic branch of capere",behave:"be- + have"},friends:[["cope","Old French couper, to strike"],["copy","Latin copia, abundance"]]},{word:"tantalize",level:2,cat:"money",origin:"A king in the Greek underworld, punished with fruit and water forever just out of reach. His name became a verb in 1597.",story:"Tantalus, king of Lydia, stole the food of the gods and was punished in Hades by standing in water that drained when he stooped, under fruit that swung away when he reached. Tantalize was coined from him in English in 1597. The metal tantalum was named in 1802 because it would not absorb acid even when standing in it. A tantalus is a locked spirits case you can see into but not open.",family:["tantalum","Tantalus","tantalising"],notes:{tantalum:"named by Ekeberg for the metal's refusal to take up acid, like the king in his pool"},friends:[["tantrum","origin unknown"],["tandem","Latin, at length"],["tangle","Scandinavian"]]},{word:"mercury",level:2,cat:"money",origin:"The Roman god of trade, travel and thieves, whose name comes from the Latin for goods. The planet was his because it moved fastest; the metal because it runs.",story:`Latin merx, mercis, "merchandise", gave Mercurius, the god of traders and messengers, and also merchant, market, mercenary (one who works for pay) and mercy (originally a price paid, then a favour granted). The planet closest to the sun was named for the swift god, and medieval alchemists gave the running metal the planet's name. Wednesday is Woden's day, but French mercredi is Mercury's.`,family:["merchant","merchandise","market","mercenary","mercy","commerce","commercial","mercantile","mercer"],notes:{mercy:"Latin merces, wages, reward; in church Latin the reward of heaven, then pity",market:"Latin mercatus, trade",mercenary:"Latin mercenarius, one hired for pay"},friends:[["merge","Latin mergere, to dip"],["mercury vapour","counts"],["merit","Latin merere, to earn: possibly a cousin, not proven"]]},{word:"gangster",level:2,cat:"money",origin:'American, 1896, from a plain English word for a crew plus a Germanic ending. That word was first "a going", a journey, then the set of things or people that go together.',story:'Old English gang was "a going, a way", from gangan, "to go"; by the 1300s a gang was a set of things that go together, tools or oxen, and by the 1600s a company of workmen or of criminals. Gangster was coined in Ohio newspapers in 1896. Gangway is the same going, and gangplank; the -ster ending is the one in spinster and songster.',family:["gang","gangway","gangplank","gangland","gangly","gait"],notes:{gait:"Old Norse gata, a way, a manner of going",gangly:"loose in the going"},friends:[["gangrene","Greek gangraina"],["ganglion","Greek, a knot"],["gander","Old English gandra, a goose"]]},{word:"hoodlum",level:3,cat:"money",origin:"San Francisco slang of the 1870s, origin unsettled. The best guess is a German dialect word for a ragamuffin brought by Bavarian immigrants.",story:`Hoodlum appeared in San Francisco newspapers in 1871 for a young street rough. Its origin was argued over from the start; the likeliest is Bavarian dialect Huddellump, "ragamuffin", or a similar word meaning slovenly fellow, brought by German immigrants. The story that a reporter reversed a gang leader's name, Muldoon, is a newspaper joke. Hood, the gangster, is a 1930 clipping of it.`,family:["hood","hoods"],notes:{hood:"the gangster, clipped from hoodlum in 1930; not the head-covering"},friends:[["hooligan","probably an Irish surname, Houlihan, from an 1890s music-hall song"],["hoodwink","to blind with a hood"]]},{word:"jury",level:2,cat:"money",origin:'Old French for "sworn": the twelve are people who have taken an oath. Latin for law and for swearing sit under it.',story:'Latin ius, iuris, "law, right", gave iurare, "to swear", and Anglo-French juree, "an oath, a sworn body", which is jury, in English by 1300. A juror is a swearer; to abjure is to swear off; a perjurer swears falsely. Ius also gives just, justice, injury (a "not-right" done to you), jurisdiction and the judge, who is iudex, "the law-sayer".',family:["juror","perjury","abjure","conjure","just","justice","injury","injure","jurisdiction","judge","judicial","prejudice","adjust","justify","jurist"],notes:{conjure:"Latin coniurare, to swear together, to conspire; then to summon spirits by oath",injury:'Latin iniuria, a wrong, "not-right"',judge:"Latin iudex, ius + dicere, law-sayer",adjust:"through Old French ajuster, to make right"},friends:[["jewellery","Latin iocus, a plaything"],["journey","Latin diurnum, a day"],["jubilee","Hebrew yobel, a ram's horn"]]},{word:"salary",level:1,cat:"money",origin:"Latin salarium, a Roman soldier's allowance. The story says it was for buying one particular seasoning; the seasoning is in the word either way.",story:'Latin sal, "salt", gave salarium, an allowance paid to soldiers and officials. Pliny says it was salt money, though it may only have been "money for salt" the way we say "beer money". English took salary from French around 1300. Sal is an old root that Old English shared as sealt, so salt itself is family, and so is nearly everything the Romans preserved with it: salad (salted greens), sauce, sausage and salami.',family:["salt","salad","sauce","sausage","salsa","saline","salami","saltpetre","salinity","souse","silt","salaried"],notes:{salt:"Old English sealt, the same root",salad:"Vulgar Latin salata, salted",sauce:'Latin salsa, "salted"',sausage:"Latin salsicia, salted meat",saltpetre:"sal petrae, salt of the rock",souse:"to pickle, from Old Low German sultia, brine",silt:"probably from a Scandinavian word for a salt marsh"},friends:[["solar","Latin sol, the sun"],["sultan","Arabic for ruler"],["salute","Latin salus, health"]]},{word:"fiasco",level:2,cat:"money",origin:'Italian for a bottle. Why a failed performance was "making a bottle" nobody has settled; the bottle itself is a Latin vessel English also has, with an l in it.',story:`Italian fiasco is a bottle, from Late Latin flasco, which is also flask and, through Spanish, flagon. Far fiasco, "to make a bottle", was theatre slang in the 1800s for a performance that flopped; French took it and English had fiasco for any humiliating failure by 1855. The bottle-to-flop step is unexplained; one guess is glassblowers' slang for a botched piece turned into a plain bottle.`,family:["flask","flagon","flasket"],notes:{flagon:"Old French flacon, the same Late Latin bottle"},friends:[["fianc\xE9","Latin fidere, to trust"],["fiat",'Latin, "let it be done"'],["fiesta","Latin festa"]]}]});var Jn=E(($s,Vn)=>{"use strict";Vn.exports=[{word:"pharmacy",level:1,cat:"pharmacopoeia",origin:"Greek pharmakon: a drug, a poison, or a charm, depending on the dose and the intent. The Greeks did not separate the three.",story:`Greek pharmakon meant a drug, a poison and a magic charm; pharmakeia was the use of any of them, and a pharmakeus a druggist or a sorcerer. Latin pharmacia reached English in the 1300s as "the giving of medicines" and by the 1800s meant the shop. A pharmacopoeia is a "drug-making", the official book of preparations. The word's own origin before Greek is unknown.`,family:["pharmaceutical","pharmacist","pharmacology","pharmacopoeia","pharmacokinetics","pharma"],notes:{pharmacopoeia:'Greek pharmakopoiia, "drug-making", the book of recipes'},friends:[["farm","Latin firma, a fixed payment"],["pharaoh","Egyptian, great house"],["pharynx","Greek, the throat"]]},{word:"toxic",level:1,cat:"pharmacopoeia",origin:`Greek toxon, "a bow", the archer's kind. The poison was what went on the arrows, and it kept the name after the bow was forgotten.`,story:'Greek toxon, "bow", gave toxikon pharmakon, "poison for arrows", and the adjective alone came to mean the poison. Latin toxicum was any poison, and English toxic arrived in the 1660s. A toxophilite, a lover of archery, keeps the original bow; intoxicate was to poison before it meant to make drunk, a shift that happened in English in the 1500s.',family:["toxin","intoxicate","detox","toxicology","antitoxin","toxophilite","intoxication"],notes:{toxophilite:"Greek toxon + philos: a lover of the bow",intoxicate:"to poison, then from the 1500s to make drunk"},friends:[["tux","Tuxedo Park, New York"],["taxi","Latin taxare, to assess"],["tonic","Greek tonos, tension"]]},{word:"narcotic",level:1,cat:"pharmacopoeia",origin:'Greek nark\u0113, "numbness, stupor". A narcotic numbs, and a certain sleep disorder is a numbing seizure.',story:'Greek nark\u0113, "numbness", gave narkoun, "to benumb", and narkotikos; medieval Latin narcoticum reached English in the late 1300s for any drug that dulls the senses. Narcolepsy, coined in French in 1880, is nark\u0113 plus lepsis, "a seizure". Narc, for a drugs agent, is a 1960s clipping. The flower narcissus was linked to nark\u0113 by the ancients for its sedative scent, but the name is probably older than Greek.',family:["narcolepsy","narcosis","narc","narcotize","narcoleptic"],notes:{narc:"American slang for a narcotics officer, 1967"},friends:[["narcissus","probably a pre-Greek plant name, though Pliny tied it to numbness"],["nark","Romani nak, nose: an informer"],["narrate","Latin gnarus, knowing"]]},{word:"addict",level:1,cat:"pharmacopoeia",origin:'Latin addictus: a debtor the court handed over to his creditor as a bonded servant. To be addicted is to have been awarded to something. The verb inside is "to say".',story:`Latin addicere, "to assign, award by decree", was ad + dicere, "to say". An addictus in Roman law was a debtor sentenced into a creditor's service. English addict appeared in the 1500s as a verb, "to devote oneself to", and only around 1900 did the noun come to mean someone in the grip of a drug. Dicere is the root of dictate, dictionary, verdict and a judge, the iudex who "says the law".`,family:["dictate","dictionary","verdict","edict","predict","contradict","indicate","index","condition","judge","benediction","ditto","dictator","jurisdiction"],notes:{judge:'Latin iudex, ius + dicere, "law-sayer"',ditto:'Italian detto, "said"',index:"the pointer, from the same root of pointing out"},friends:[["add","Latin addere, to put to"],["adept","Latin adeptus, attained"],["adieu","French, to God"]]},{word:"sober",level:2,cat:"pharmacopoeia",origin:'Latin sobrius, "not drunk": a prefix meaning "without" attached to the word for drunk. The drunk word survives in English behind an in-.',story:'Latin sobrius is se-, "without", plus ebrius, "drunk". Old French sobre reached English in the 1300s, meaning moderate and temperate before it narrowed to "not intoxicated". Ebrius is the same word inside inebriated, which entered English in the 1400s from Latin inebriare, "to make drunk". The origin of ebrius itself is unknown.',family:["sobriety","inebriated","inebriate","ebriety","inebriation"],notes:{inebriated:'Latin ebrius, drunk, the second half of sobrius with the "without" removed'},friends:[["sob","Old English, imitative"],["sombre","Latin sub umbra, under shadow"],["sobriquet","French, origin unknown"]]},{word:"ecstasy",level:3,cat:"pharmacopoeia",origin:'Greek ekstasis, "a standing outside oneself": a trance, a being beside oneself. The standing is the second half, and it is one of the largest roots in the language.',story:'Greek ek-, "out", and histanai, "to stand", made ekstasis, "displacement", used by the mystics for the soul standing outside the body in a trance. Old French estaise reached English in the 1300s for a frenzy of religious feeling; the sense of overwhelming joy is from the 1600s, and the drug name from 1985. Histanai and Latin stare share the root sta-, which is stand, state, statue, station, stable, system ("a standing together"), and the stamina that keeps you standing.',family:["static","stasis","stand","state","status","statue","station","stable","establish","constant","distant","instant","substance","circumstance","obstacle","system","apostasy","hypostasis","prostate","stamina","stay","stool","stud","stem","steed","stoic","estate","statistics"],notes:{system:'Greek systema, "a standing together"',prostate:'Greek prostates, "one standing before" the bladder',stamina:'Latin stamina, the threads of the Fates, "what stands up"',stool:'Old English stol, a seat, "a standing thing"',stud:"Old English studu, a post that stands",obstacle:"Latin obstare, to stand in the way",stoic:"Greek stoa, a porch, a standing place"},friends:[["excite","Latin ciere, to move"],["exit","Latin ire, to go"],["MDMA","not a word family"]]},{word:"cannabis",level:1,cat:"pharmacopoeia",origin:"Greek kannabis, borrowed from a Scythian or Thracian people. The same word, worn down in Old English, is the plain name for the plant, and a cloth once woven from it keeps the name too.",story:'Greek kannabis is a loan from some northern people, Scythian or Thracian; Herodotus describes the Scythians inhaling its smoke. The same ancient word went into Germanic as Old English h\xE6nep, which is hemp. Latin cannabis gave cannabaceus, "hempen", and Old French canevas, the cloth woven from hemp: canvas. To canvass, meaning to solicit votes, was originally to toss someone in a canvas sheet, then to shake something out thoroughly.',family:["canvas","canvass","hemp","cannabinoid","cannabidiol","canvasser"],notes:{hemp:"Old English h\xE6nep, the same word by the Germanic road",canvas:"Old French canevas, hemp cloth",canvass:"to toss in a canvas sheet, then to sift thoroughly, then to solicit"},friends:[["can","Old English canne"],["candy","Arabic qandi"],["cannon","Latin canna, reed"],["canap\xE9","Greek konops, a gnat, by way of mosquito-net"]]},{word:"opium",level:1,cat:"pharmacopoeia",origin:'Greek opion, "poppy juice", a little form of the word for sap. The Latin form is the one English took, in the 1300s.',story:'Greek opos, "juice, sap", gave the diminutive opion, "poppy juice", the dried latex of the poppy head. Latin opium reached English around 1390. Opiate is medieval Latin opiatus, "made with opium", and opioid, coined in the 1950s, is "opium-like". The Greek word for the poppy itself, m\u0113k\u014Dn, is not in the family.',family:["opiate","opioid","opiates","opioids"],notes:{},friends:[["open","Old English"],["opinion","Latin opinari"],["optic","Greek ops, eye"]]},{word:"venom",level:2,cat:"pharmacopoeia",origin:'Latin venenum, which was a love potion before it was a poison. The goddess of love is the first half of it, and behind her a root meaning "to desire".',story:'Latin venenum first meant a drug or a love charm and only later a poison; it comes from Venus, whose name is the old noun for desire and charm. Old French venim reached English in the 1200s. The root wen-, "to desire, to strive for", also gives venerate (to worship), venery in both senses (the hunt, from venari, "to pursue", and lust, from Venus), venison (hunted meat), and in Germanic wish, win and winsome.',family:["venomous","Venus","venereal","venerate","venerable","venery","venison","venial","wish","win","winsome","envenom"],notes:{venison:'Latin venatio, hunting, from venari, "to pursue what one desires"',venial:'Latin venia, a favour, pardon, "what is desired"',wish:"Old English wyscan, the same desiring root",win:"Old English winnan, to strive"},friends:[["vent","Latin ventus, wind"],["venue","Latin venire, to come"],["venture","Latin venire again"]]},{word:"hangover",level:2,cat:"pharmacopoeia",origin:"Plain English: something that hangs on from the night before. First recorded in 1894, for any leftover; the morning-after sense arrived in 1904.",story:"Hangover joins hang and over and first meant a survival, something left over from an earlier time, in 1894; the drinker's sense is from 1904. Hang is Old English hangian, over is Old English ofer, both Germanic. Hanger, overhang and hang-up belong; hangar, the aircraft shed, does not: it is French, probably from a Germanic word for an enclosure.",family:["hang","over","hanger","overhang","hang-up","hangdog","overhanging"],notes:{hangdog:"a look fit for hanging a dog"},friends:[["hangar","French, an enclosure, not the same hang"],["hunger","Old English hungor"],["hank","Old Norse"]]},{word:"alcohol",level:2,cat:"pharmacopoeia",origin:"Arabic for a fine powder of antimony, the eyeliner. Alchemists stretched it to mean any refined essence, and the essence of wine took over the word.",story:'Arabic al-ku\u1E25l, "the kohl", was powdered antimony used as eye-paint. Medieval Latin alcohol meant any fine powder produced by sublimation, then any refined essence; Paracelsus in the 1500s wrote alcohol vini, "the essence of wine", and by the 1700s alcohol alone meant the spirit. The al- is the Arabic article, as in algebra and alkali, which are otherwise unrelated.',family:["kohl","alcopop"],notes:{kohl:"the eyeliner, the original Arabic word"},friends:[["alchemy","Arabic al-k\u012Bmiy\u0101, a different al- word"],["algebra","Arabic al-jabr, reunion of broken parts"],["alkali","Arabic al-qal\u012B, the ashes"]]},{word:"nicotine",level:2,cat:"pharmacopoeia",origin:"Named for the French ambassador who sent tobacco seeds from Lisbon to Paris in 1560. He was called Nicot, and the plant was called after him first.",story:`Jean Nicot, French ambassador in Lisbon, sent tobacco to Catherine de' Medici in 1560 as a cure for headaches. Botanists named the plant Nicotiana after him, and French chemists who isolated its alkaloid in 1828 called it nicotine. Nicot's own name is a pet form of Nicolas, from Greek Nikolaos, "victory of the people", which puts Nike, the goddess of victory, at the bottom of the cigarette.`,family:["Nicotiana","Nicolas","Nicholas","Nike","Nicole"],notes:{Nike:"Greek for victory, the first half of Nicolas",Nicholas:`Greek Nikolaos, "people's victory"`},friends:[["nick","origin unknown"],["nickel",'German Kupfernickel, "copper demon"'],["tobacco","Spanish tabaco, from Taino or Arabic"]]},{word:"caffeine",level:2,cat:"pharmacopoeia",origin:"German, 1819, from the word for the drink it was found in. That drink's name is Arabic, and before that possibly an Ethiopian region.",story:"Friedlieb Runge isolated the alkaloid from coffee beans in 1819 and named it Kaffein; French caf\xE9ine and English caffeine followed by 1830. Coffee is Arabic qahwa, a word that may earlier have meant wine, passed through Turkish kahve and Italian caff\xE8 into English around 1600. The theory that qahwa comes from Kaffa, the Ethiopian region, is unproven.",family:["coffee","caf\xE9","cafeteria","decaf","caffeinated","decaffeinated"],notes:{cafeteria:'American Spanish, "coffee shop"'},friends:[["calf","Old English cealf"],["gaffe","French, a blunder"],["kefir","Caucasian, unrelated"]]},{word:"psychedelic",level:2,cat:"pharmacopoeia",origin:'Coined in 1956 by a doctor writing to Aldous Huxley: Greek for "mind-showing". The mind half is the word for breath and soul.',story:'Humphry Osmond proposed psychedelic to Aldous Huxley in a 1956 letter, from Greek psych\u0113, "mind, soul", and d\u0113loun, "to make visible". Psych\u0113 was originally breath, from psychein, "to blow", and became the soul that leaves with the last breath. The same word is in psychology, psychiatry and the psychopath. D\u0113los, "visible", is rare elsewhere in English.',family:["psyche","psychology","psychiatry","psychic","psychopath","psychosis","psychosomatic","psychotherapy","psychoanalysis","psychiatrist"],notes:{psyche:"Greek for breath, then soul, then mind"},friends:[["physics","Greek physis, nature"],["cycle","Greek kyklos, wheel"],["psalm","Greek psallein, to pluck"]]},{word:"morphine",level:2,cat:"pharmacopoeia",origin:'Named in 1817 for the Greek god of dreams, whose own name means "shaper". A word for form and shape is under it.',story:`Friedrich Sert\xFCrner, who isolated the alkaloid from opium in 1804, named it morphium in 1817 after Morpheus, Ovid's god of dreams. Morpheus is Greek morph\u0113, "form, shape": the god who shapes dreams. The same word gives morphology, metamorphosis (a change of shape), amorphous (shapeless) and, in linguistics, the morpheme.`,family:["Morpheus","morphology","metamorphosis","amorphous","morpheme","morph","anthropomorphic","polymorphic"],notes:{Morpheus:'the god of dreams, "the shaper"',amorphous:"Greek a- + morph\u0113, without form"},friends:[["moron","Greek moros, foolish"],["morbid","Latin morbus, disease"],["mortal","Latin mors, death"]]},{word:"heroin",level:2,cat:"pharmacopoeia",origin:"A trade name from 1898, said to come from the German for what Achilles was, for how it made the test subjects feel. The word for that kind of man is Greek.",story:`Bayer trademarked Heroin in 1898 as a cough suppressant; the name is usually explained from German heroisch, "heroic", after the euphoria reported by workers who tried it. Greek h\u0113r\u014Ds was a demigod, then any great man; Latin heros, French h\xE9ros, and English hero by the 1300s. The heroine is the feminine. The Greek word's own origin is uncertain; some link it to Hera.`,family:["hero","heroine","heroic","heroism","antihero","superhero"],notes:{},friends:[["heron","Old French hairon, Germanic"],["herald","Frankish, army-ruler"],["herring","Old English h\xE6ring"]]},{word:"cocaine",level:2,cat:"pharmacopoeia",origin:"Coined in 1860 from the Andean shrub whose leaf it comes from; that name is Quechua. The cacao tree is a different plant with a similar-looking name.",story:"Albert Niemann isolated the alkaloid in 1860 and named it from coca plus the chemists' suffix -ine. Coca is Spanish, from Quechua kuka, the leaf Andean people have chewed for millennia. Coca-Cola, 1886, took its first half from the leaf and its second from the kola nut. Cacao and cocoa, from Nahuatl cacahuatl, are unrelated despite the spelling.",family:["coca","Coca-Cola","coke","kuka"],notes:{coke:"the slang, from cocaine, 1903; the fuel coke is unrelated"},friends:[["cocoa","Nahuatl cacahuatl, a different plant"],["coconut","Portuguese coco, a grinning face"],["cock","Old English cocc"]]},{word:"tequila",level:1,cat:"pharmacopoeia",origin:"The town in Jalisco where it is made. The town's name is Nahuatl and probably refers to the place where a certain kind of work was done.",story:`Tequila is named for the town of Tequila in Jalisco, Mexico, around which the blue agave grows; the drink was called vino de Tequila by the 1600s and plain tequila in English from 1849. The town's Nahuatl name, Tequillan, is usually explained as "place of tribute" or "place of work", from tequitl, "work, tribute". Mezcal, the older name for agave spirit, is Nahuatl mexcalli, "oven-cooked agave".`,family:["mezcal","mescal","agave","Tequillan"],notes:{mezcal:"family by kinship of drink, not of word: Nahuatl mexcalli, cooked agave",agave:"Greek agau\u0113, noble, a botanist's name for the plant"},friends:[["tequila sunrise","counts"],["tortilla","Spanish torta, a cake"],["tea","Chinese te"]]},{word:"absinthe",level:3,cat:"pharmacopoeia",origin:"French, from the Latin and Greek name of the bitter herb it is flavoured with. The Greek word is probably a borrowing from further east.",story:"Greek apsinthion was wormwood, Artemisia absinthium, the bitter herb; Latin absinthium, Old French absinthe. English had absinthium for the plant by the 1400s and absinthe for the green spirit, invented in Switzerland around 1790, by 1842. The Greek word is not Indo-European; it was probably borrowed from a Near Eastern language. Wormwood, the English name, is an alteration of Old English wermod, which is also vermouth by way of German.",family:["absinthium","wormwood","vermouth","Wermut"],notes:{wormwood:"family by kinship of plant: Old English wermod, the same herb",vermouth:"German Wermut, wormwood, the herb that flavours it"},friends:[["absent","Latin abesse, to be away"],["absolute","Latin absolvere, to loosen"],["sin","Old English synn"]]},{word:"genius",level:3,cat:"mind",origin:'Latin genius, the guardian spirit born with each person. The root means "to beget, to be born", and it is one of the biggest families in the language.',story:`Latin genius was the spirit that attended a person from birth, from gignere, "to beget". By the 1600s English used it for a person's natural bent, and by the 1700s for exceptional inborn ability. The root gen-, "to give birth", is everywhere: gene, generate, generous (well-born), gentle (of good family), genuine, nation (nasci, to be born), nature, pregnant, benign (well-born), and by the Germanic road kin, kind and king (the son of the kin).`,family:["gene","genetic","generate","generation","general","generous","genre","gender","genie","genital","engine","ingenious","indigenous","congenital","progeny","gentle","gentleman","genocide","oxygen","hydrogen","kin","kind","king","nation","nature","native","pregnant","benign","malign","germ","germane","genesis","genealogy","gentry","naive","nascent","renaissance","cognate"],notes:{engine:'Latin ingenium, "inborn talent", then a clever device',generous:"Latin generosus, of noble birth",gentle:"Latin gentilis, of the same clan",king:'Old English cyning, "son of the kin"',kind:"Old English gecynd, nature, inborn character",nation:"Latin natio, a birth, a people",pregnant:'Latin praegnans, "before birth"',benign:'Latin benignus, "well-born", then kindly',germ:"Latin germen, a sprout, from the same begetting root",naive:'French na\xEFf, "as born", natural',oxygen:'the -gen half: "producer"',genie:"French g\xE9nie from genius, later blended with Arabic jinn"},friends:[["gin","juniper, via Dutch"],["genuflect","Latin genu, knee"],["gentian","King Gentius of Illyria"]]},{word:"spirit",level:1,cat:"mind",origin:'Latin spirare, "to breathe". A spirit was a breath before it was a ghost or a drink.',story:`Latin spiritus, "breath, breathing", from spirare, "to breathe", was used in the Vulgate for the Hebrew ruach and Greek pneuma, the breath of God, and so came to mean the soul. English took spirit from Anglo-French in the 1200s. The distilled sense, from the 1500s, is the alchemists' "spirit" or vapour of a substance. Inspire is to breathe in, expire to breathe out, conspire to breathe together, perspire to breathe through the skin.`,family:["inspire","expire","respire","respiration","conspire","conspiracy","perspire","aspire","transpire","spiritual","esprit","sprite","spiracle","dispirited","inspiration","respirator"],notes:{sprite:"Old French esprit, spirit, a small one",spiracle:"a breathing hole in an insect",esprit:"French for spirit, as in esprit de corps"},friends:[["spiral","Greek speira, coil"],["spire","Old English, a stalk"],["spit","Old English, no relation"]]},{word:"lunatic",level:2,cat:"mind",origin:'Latin luna, the moon. Madness was thought to come and go with its phases. The root means "brightness", and it shines through a good deal of Latin.',story:'Latin luna, "moon", gave lunaticus, "moonstruck", because madness was believed to wax and wane with the moon; Old French lunatique reached English around 1300. Luna comes from a root meaning "light, brightness" that also gives Latin lux and lumen: lucid, illuminate, luminous, illustrate (to light up), lustre, and Lucifer, "the light-bearer", the morning star. English light is the same root by the Germanic road.',family:["lunar","lunation","sublunary","lucid","lucent","translucent","elucidate","illuminate","luminous","luminary","luster","lustre","illustrate","lux","light","Lucifer","lucifer","lunacy","Lucy","lucent"],notes:{lucid:"Latin lucidus, bright, from lux",illustrate:"Latin illustrare, to light up",Lucifer:'Latin, "light-bearer", the morning star',light:"Old English leoht, the same root",lucifer:"a friction match, 1830s",Lucy:'Latin Lucia, "light"'},friends:[["lunch","origin unknown"],["lung",'Old English, "light" in weight, a different light'],["lunge","French allonger"]]},{word:"terror",level:1,cat:"mind",origin:'Latin terrere, "to frighten", from a root meaning "to shake, to quiver". The shaking is still in several English words.',story:'Latin terrere, "to fill with fear", from an Indo-European root tres-, "to tremble", gave terror, and Old French terreur reached English in the late 1300s. Terrible, terrific (which meant frightening until the 1800s) and deter (to frighten off) are the same verb. The trembling root also gives Latin tremere, which is tremble, tremor and tremendous, "to be trembled at".',family:["terrible","terrific","terrify","deter","deterrent","tremble","tremor","tremendous","tremulous"],notes:{deter:"Latin deterrere, to frighten away",terrific:"causing terror, until the 1800s turned it round",tremble:"Latin tremulus, from the same trembling root",tremendous:'Latin tremendus, "to be trembled at"'},friends:[["terrain","Latin terra, earth"],["territory","terra again"],["terrier","terra, an earth dog"]]},{word:"sanity",level:1,cat:"mind",origin:'Latin sanus, "healthy, sound". It was bodily health first; the mind came later. Its family is mostly about keeping things clean.',story:'Latin sanus, "healthy", gave sanitas, "health", which is sanity, in English by the 1400s in the bodily sense; "soundness of mind" is from the 1600s. Sane arrived in the 1700s already meaning of sound mind. Sanitary and sanitation, coined in the 1800s, go back to the same health, and a sanatorium is a place for getting healthy. The origin of sanus before Latin is unknown.',family:["sane","insane","sanitary","sanitation","sanitize","sanatorium","sanitarium","insanity","sanitizer"],notes:{sanatorium:"Latin sanare, to heal"},friends:[["saint","Latin sanctus, holy"],["sanction","sanctus again"],["sand","Old English"]]},{word:"psyche",level:1,cat:"mind",origin:'Greek for breath, then for the soul that leaves with the last one, then for the mind. From a verb meaning "to blow".',story:`Greek psych\u0113 meant breath, from psychein, "to blow, breathe", and then the soul or spirit, the thing that departs with the last breath; Homer's dead are psychai. Later philosophers made it the mind. English borrowed it directly in the 1600s. Psychology, "the study of the soul", was coined in Latin in the 1500s, psychiatry ("soul-healing") in 1808, the psychopath in 1885.`,family:["psychology","psychiatry","psychedelic","psychopath","psychosis","psychosomatic","psychotherapy","psychoanalysis","psychiatrist"],notes:{psychedelic:'Greek psych\u0113 + d\u0113loun, "mind-showing", 1956'},friends:[["physics","Greek physis, nature"],["cycle","Greek kyklos, wheel"],["psalm","Greek psallein, to pluck"]]},{word:"hypnosis",level:1,cat:"mind",origin:'Greek hypnos, "sleep", and the god of it. Coined in the 1870s from an earlier "hypnotism". The Latin word for sleep is the same root, and it gives the English words for not sleeping.',story:'Greek hypnos, "sleep", was also the god Hypnos, brother of Death. The Scottish surgeon James Braid coined hypnotism in 1841 for the trance he induced, and hypnosis followed in the 1870s. Hypnos and Latin somnus are the same Indo-European word, swep-, which also gives Latin sopor and, by the Germanic road, an old English word swefn, "dream". Insomnia is "no sleep", a somnambulist a sleep-walker.',family:["hypnotic","hypnotize","hypnotherapy","somnolent","insomnia","somnambulist","soporific","hypnotist","insomniac"],notes:{insomnia:"Latin in- + somnus, sleep, the same root as hypnos",somnambulist:"Latin somnus + ambulare, sleep-walker",soporific:"Latin sopor, deep sleep, the same root"},friends:[["hypo","Greek hypo, under: a different word"],["hymn","Greek hymnos"],["sleep","Old English sl\xE6pan, unrelated"]]},{word:"euphoria",level:2,cat:"mind",origin:'Greek eu, "well", plus a verb meaning "to carry": carrying things easily. The carrying verb is one of the great roots, and English has it too.',story:`Greek euphoros, "bearing well", gave euphoria, which Greek doctors used for a patient's sense of well-being; English took it as a medical term in the 1680s and as plain elation in the 1800s. Pherein, "to carry", is the Indo-European root bher-, which is Latin ferre (transfer, refer, prefer, suffer, fertile) and English bear, birth and burden. A metaphor carries a meaning across; phosphorus is the light-bearer.`,family:["metaphor","semaphore","phosphorus","periphery","amphora","anaphora","fertile","ferry","bear","birth","burden","transfer","refer","prefer","differ","offer","suffer","confer","infer","circumference","aquifer","conifer","Lucifer","Christopher","euphemism","eulogy","euthanasia","evangelist","euphoric"],notes:{metaphor:"Greek metapherein, to carry across",amphora:'Greek, "carried on both sides", by two handles',periphery:'Greek, "carried around"',ferry:"Old English ferian, to carry, the same root",birth:"Old Norse byrth, a bearing",Christopher:'"Christ-bearer"',Lucifer:'"light-bearer"',euphemism:'shares the eu-, "well", half only',euthanasia:"the eu- half only"},friends:[["euro","Europa"],["fury","Latin furere, to rage"],["fern","Old English fearn"]]},{word:"anxiety",level:2,cat:"mind",origin:'Latin angere, "to choke, to squeeze", from a root meaning "narrow, tight". Several kinds of pain and one kind of rage share it.',story:'Latin angere, "to choke, throttle, distress", from the root angh-, "tight, painful", gave anxius, "troubled", and anxietas; English anxiety is from the 1520s. Anguish is Latin angustia, "narrowness", by way of French. Angina is the choking chest pain. Anger is Old Norse angr, "grief, trouble", the same tightness by the Germanic road, and angst is the German cousin. Quinsy, the old name for an abscess of the throat, is Greek kynanch\u0113, "dog-choking".',family:["anxious","anger","angina","anguish","angst","hangnail","quinsy","angry"],notes:{anger:"Old Norse angr, distress, the same root",hangnail:'Old English angn\xE6gl, a painful nail; the "hang" is folk spelling',quinsy:'Greek kynanch\u0113, "dog-strangling", a throat abscess'},friends:[["angel","Greek angelos, messenger"],["angle","Latin angulus, corner"],["ankle","Old English ancleow"]]},{word:"trauma",level:2,cat:"mind",origin:`Greek for "a wound". English used it only for bodily injury until Freud's generation moved it into the mind. The root meant "to rub, to wear through".`,story:'Greek trauma, "wound, hurt", from a root meaning "to rub, to bore through", was borrowed into English medical Latin in the 1690s for a physical injury; the psychological sense dates from the 1890s. The rubbing root, tere-, gives Latin terere, "to rub, wear down": trite (worn), attrition, contrite (worn down with guilt), detriment, tribulation (from tribulum, a threshing sledge). By the Germanic road it gives throw (originally to twist) and thread.',family:["traumatic","traumatize","trite","tribulation","attrition","contrite","detriment","throw","thread","turn","tribology","traumatised"],notes:{trite:"Latin tritus, worn by use",tribulation:"Latin tribulum, a threshing sledge that rubs the grain out",contrite:"Latin contritus, ground down",throw:"Old English thrawan, to twist, turn",turn:"Greek tornos, a lathe, the same rubbing-turning root",tribology:"the science of friction"},friends:[["tram","Low German traam, beam"],["drama","Greek dran, to do"],["trauma centre","counts"]]},{word:"delirium",level:2,cat:"mind",origin:'Latin delirare, "to go off the furrow", from the word for the ridge a plough leaves. A mind that has wandered out of the row.',story:`Latin lira was the ridge of earth between furrows; delirare, "to leave the furrow", was farmers' talk for going astray, and delirium was the noun by Cicero's time. English took it in the 1590s. Delirium tremens, "trembling delirium", was named in 1813. Lira has no other English family; the tremens is Latin tremere, which is family to tremble and terror.`,family:["delirious","delirium tremens","deliriously"],notes:{},friends:[["deliver","Latin liber, free"],["delight","Latin delectare"],["lyre","Greek lyra"]]},{word:"paranoia",level:2,cat:"mind",origin:'Greek for "beside the mind", the way you say someone is beside themselves. The mind half is a Greek word English uses for common sense.',story:'Greek paranoia, "madness", is para, "beside, beyond", plus nous, "mind": a mind gone off to the side. Hippocrates used it for any derangement. Modern psychiatry revived it in Latin form in 1811 and narrowed it to delusions of persecution. Nous gives few other English words; the para- gives many: paradox, parallel, parasite (one who eats beside you), parody, paragraph.',family:["paranoid","nous","paradox","parallel","parasite","parody","paragraph","paramedic","parable","paralysis"],notes:{nous:"Greek for mind, the second half; in English slang, common sense",parasite:'Greek parasitos, "one who eats beside", a hanger-on at dinner',parable:"Greek parabol\u0113, a placing beside, a comparison"},friends:[["pair","Latin par, equal"],["parrot","French perrot, a pet form of Pierre"],["pariah","Tamil paraiyar, drummers"]]},{word:"melancholy",level:2,cat:"mind",origin:'Greek for "black bile", the humour that was supposed to cause it. The black half and the bile half both have relatives in English.',story:'Greek melankholia is melas, "black", plus khol\u0113, "bile": in humoral medicine an excess of black bile made you gloomy. Old French melancolie reached English around 1300. Melas gives melanin, melanoma and Melanesia, "the black islands". Khol\u0113 is choler, the yellow bile of the hot-tempered, hence choleric, and cholera, and the gall it corresponds to in Germanic is the same root.',family:["melanin","melanoma","Melanesia","choler","choleric","cholera","cholesterol","gall","melatonin"],notes:{cholesterol:'Greek khol\u0113 + stereos, "bile-solid", first found in gallstones',gall:"Old English gealla, bile, the same root as khol\u0113",melatonin:"named from melanin, which it affects"},friends:[["melon","Greek m\u0113lon, apple"],["melody","Greek melos, a song"],["collar","Latin collum, neck"]]},{word:"hysteria",level:2,cat:"mind",origin:"Greek for the womb. Ancient doctors blamed the organ, which they believed could wander, for the condition; the name outlived the theory.",story:'Greek hystera, "womb", gave hysterikos, "of the womb", because Greek and later physicians believed the condition was caused by disturbances of the uterus, which Plato thought wandered the body. English had hysteric in the 1600s and coined hysteria in 1801. Hysterectomy is the removal of the same organ. The Greek word may be related to Latin uterus, though the link is disputed.',family:["hysterical","hysterectomy","hysterics","hysteric"],notes:{hysterectomy:"the surgical removal of the hystera"},friends:[["history","Greek histor, one who knows"],["hysteresis","Greek hysteros, later: a different word"],["uterus","Latin, possibly a cousin, not proven"]]},{word:"phobia",level:1,cat:"mind",origin:"Greek for fear and panic flight. A god of the same name rode with Ares. The word was mostly a suffix until doctors let it stand alone in 1786.",story:"Greek phobos meant panic flight and then fear; Phobos was the personification who accompanied Ares into battle, and one of the moons of Mars is named for him. Latin -phobia was used in compounds like hydrophobia, the dread of water in rabies, and English writers detached phobia as a word on its own in 1786. Claustrophobia (Latin claustrum, an enclosed place) was coined in 1879.",family:["phobic","hydrophobia","claustrophobia","agoraphobia","arachnophobia","xenophobia","homophobia","Phobos"],notes:{Phobos:"the god, and the larger moon of Mars",hydrophobia:'Greek, "water-fear", the old name for rabies'},friends:[["phone","Greek ph\u014Dn\u0113, voice"],["foe","Old English fah, hostile"],["fob","German dialect, a pocket"]]},{word:"idiot",level:2,cat:"mind",origin:"Greek idi\u014Dt\u0113s, a private person, one who held no public office. The Athenians thought poorly of that, and the word went downhill from there.",story:`Greek idios, "one's own, private", gave idi\u014Dt\u0113s, a private citizen as opposed to one who takes part in public life, and then a layman, an ignorant person. Latin idiota was an uneducated man, Old French idiote a simpleton, and English idiot, around 1300, a person of profound intellectual disability, a legal category until the 1900s. Idios also gives idiom (one's own way of speaking) and idiosyncrasy (one's own mixture of temperament).`,family:["idiom","idiosyncrasy","idiocy","idiomatic","idiopathic"],notes:{idiom:"Greek idi\u014Dma, a peculiarity of one's own",idiopathic:'a disease "of its own", with no known cause'},friends:[["idea","Greek idein, to see"],["idol","idein again"],["idle","Old English idel, empty"]]},{word:"nostalgia",level:2,cat:"mind",origin:'Coined in 1688 by a Swiss medical student, from Greek for "homecoming" and "pain", to name the sickness of Swiss mercenaries far from the Alps.',story:`Johannes Hofer put nostalgia together in his 1688 dissertation from Greek nostos, "return home", and algos, "pain", to translate German Heimweh, the homesickness that was killing Swiss soldiers abroad. It was a medical diagnosis for two centuries before it softened into wistfulness for the past in the 1900s. Nostos is Odysseus's word for his homecoming. Algos is in neuralgia, analgesic ("without pain") and myalgia.`,family:["nostalgic","neuralgia","analgesic","myalgia","fibromyalgia","analgesia"],notes:{analgesic:'Greek an- + algos, "no pain"',neuralgia:"nerve pain"},friends:[["nostril","Old English nosu + thyrl, nose-hole"],["nostrum",`Latin, "ours", a quack's own remedy`],["Nostradamus","a Latinised surname"]]},{word:"oblivion",level:2,cat:"mind",origin:'Latin oblivisci, "to forget". The likeliest root is a word for "smooth": to forget is to have the mark wiped level.',story:'Latin oblivio, "forgetfulness", from oblivisci, "to forget", reached English through Old French in the late 1300s; "the state of being forgotten" came first and "unconsciousness" in the 1800s. The Latin verb is probably from ob- plus levis, "smooth", the idea being a wax tablet wiped level. The same levis, "smooth, light", gives levity, elevate, lever, relieve and alleviate, but the link to forgetting is only probable, so this family stays small.',family:["oblivious","obliviousness","levity","elevate","lever","relieve","alleviate","levitate"],notes:{levity:"Latin levis, light: probably the smooth-wiped tablet that oblivion comes from",lever:"Latin levare, to lift, the same levis"},friends:[["oblige","Latin ligare, to bind"],["oblong","Latin longus"],["olive","Greek elaia"]]},{word:"enthusiasm",level:2,cat:"mind",origin:'Greek for "having a god inside you". It meant possession, and for a long time the English word was an insult for religious zealots.',story:'Greek enthousiasmos, from entheos, "god-possessed" (en, "in", plus theos, "god"), described the frenzy of a prophet or a poet inspired by a god. English took it in the 1600s and used it mostly with contempt for religious fanatics until the late 1700s, when it became simply eager interest. Theos is in theology, atheist, pantheon, apotheosis and, through Latin, the name Timothy, "honouring God".',family:["enthusiast","enthusiastic","theology","atheist","pantheon","apotheosis","polytheism","monotheism","Timothy","Theodore","Dorothy"],notes:{pantheon:'Greek, "all the gods"',apotheosis:"being made into a god",Dorothy:'Greek Dorothea, "gift of God", the same halves as Theodore reversed'},friends:[["enthrone","Greek thronos, a seat"],["theatre","Greek theasthai, to watch"],["theme","Greek tithenai, to put"]]}]});var Xn=E((js,Kn)=>{"use strict";Kn.exports=[{word:"chemistry",level:1,cat:"neuro",origin:'Clipped from a medieval word for the transmutation of metals, which came through Arabic from Greek. The Greek may mean "the Egyptian art" or may be about pouring.',story:'Greek kh\u0113meia, the art of transmuting metals, is of disputed origin: either from Kh\u0113mia, an old name for Egypt ("black land"), or from khein, "to pour", the casting of metal. Arabic took it as al-k\u012Bmiy\u0101, which medieval Latin made alchimia, and English had alchemy by the 1300s. Chymistry, without the article, split off in the 1600s as the study of substances, and the modern spelling settled in the 1700s.',family:["alchemy","alchemist","chemical","chemist","biochemistry","chemo","chemotherapy","petrochemical","chemically"],notes:{alchemy:"the same word with the Arabic article al- still attached"},friends:[["chimney","Greek kaminos, furnace"],["chemise","Latin camisia, shirt"],["kimono","Japanese"]]},{word:"physics",level:1,cat:"neuro",origin:'Greek physis, "nature", from a verb meaning "to grow, to come into being". A doctor studied nature before he studied you. The verb is also, at bottom, the English verb "to be".',story:`Greek phyein, "to bring forth, grow", gave physis, "nature", and ta physika, Aristotle's "the natural things", which is physics. Latin physica meant natural science and, in the Middle Ages, medicine, so a physician was a natural philosopher who healed, and English physic meant medicine until the 1800s. The root bheu-, "to be, grow", is the same one that supplies the English be, been, and, by the Germanic road, build and bower.`,family:["physical","physician","physique","physiology","metaphysics","physiotherapy","physiognomy","epiphyte","neophyte","be","been","build","physicist"],notes:{be:'Old English beon, from the same root bheu-, "to grow, become"',build:'Old English byldan, from bold, a dwelling, "what has grown"',neophyte:'Greek, "newly planted"',epiphyte:"a plant that grows on another"},friends:[["fizz","imitative"],["fiscal","Latin fiscus, a basket"],["phase","Greek phasis, appearance"]]},{word:"medicine",level:1,cat:"neuro",origin:'Latin mederi, "to heal", from a root meaning "to take the appropriate measures". The measuring is why a manner, a pattern and keeping within limits are all family.',story:'Latin mederi, "to heal, to attend to", gave medicus, a doctor, and medicina, his art; Old French medecine reached English around 1200. Mederi is from the root med-, "to take appropriate measures", which also gives Latin modus, "measure, manner": mode, model, moderate, modest (keeping measure), modern (of the present measure), modify, and accommodate. To meditate is to measure things over in the mind, and a remedy is a healing back.',family:["medic","medical","remedy","remedial","meditate","meditation","medicate","paramedic","moderate","modest","mode","model","modern","modify","module","commodity","accommodate","medication","modesty"],notes:{meditate:"Latin meditari, to measure over in the mind",modest:"Latin modestus, keeping within measure",modern:'Latin modo, "just now", of the present measure',commodity:'Latin commodus, "with measure", convenient',accommodate:"to fit to measure"},friends:[["media","Latin medius, middle"],["medium","medius again"],["mediocre","medius, halfway up a mountain"]]},{word:"neuron",level:1,cat:"neuro",origin:"Greek for a sinew, a cord, a bowstring. The Greeks did not distinguish tendons from nerves; the word covered anything stringy in the body.",story:"Greek neuron meant sinew, tendon, cord, and the string of a bow; Latin nervus is the same word with the consonants swapped. Since the Greeks lumped tendons and nerves together, both languages used the word for anything fibrous. English took nerve from Latin in the 1300s, first for a sinew, and neuron directly from Greek in 1884 when the nerve cell was identified. To enervate was to cut the sinews, hence to weaken.",family:["nerve","nervous","neural","neurosis","neurotic","neurology","neuralgia","neurotransmitter","enervate","unnerve","neuroscience","nervy"],notes:{nerve:"Latin nervus, the same word with the sounds rearranged",enervate:"Latin enervare, to cut the sinews"},friends:[["neuter","Latin ne + uter, neither"],["neutral","neuter again"],["new","Old English niwe"]]},{word:"philosophy",level:1,cat:"neuro",origin:'Greek philos, "loving", plus the word for wisdom. Pythagoras is said to have coined it, refusing to be called wise. The loving half is the busy one in English.',story:'Greek philosophia, "love of wisdom", is credited to Pythagoras, who said only a god could be wise and he merely loved wisdom. Latin philosophia, Old French filosofie, and English philosophy by 1300. Philos, "dear, loving", is in philanthropy (love of mankind), philately, Philadelphia (brotherly love), the bibliophile and the pedophile; sophia in sophist, sophisticated (originally adulterated by sophistry) and sophomore, a "wise fool".',family:["philanthropy","philharmonic","philately","Philadelphia","philology","bibliophile","Anglophile","pedophile","hemophilia","sophist","sophisticated","sophomore","sophistry","Sophia","philtrum","philosopher","Philip"],notes:{philately:'Greek philos + ateleia, "exemption from tax", a stamp being a paid tax',sophomore:'Greek sophos + m\u014Dros, "wise fool"',sophisticated:"medieval Latin sophisticare, to adulterate with sophistry",hemophilia:'a "love of blood", the tendency to bleed',philtrum:"Greek philtron, a love charm: the groove on the upper lip",Philip:'Greek Philippos, "horse-lover"'},friends:[["fill","Old English"],["fillet","French filet, thread"],["film","Old English filmen, membrane"]]},{word:"logic",level:1,cat:"neuro",origin:'Greek logos, "word, account, reason", from a verb that meant "to gather" and then "to speak". Every -logy is a gathering of words about something.',story:'Greek legein meant to gather, to pick out, and then to speak, as if speech were picking words; logos was the word, the account, the reason. Logik\u0113 techn\u0113, "the art of reasoning", became Latin logica and English logic around 1360. Every -logy and -logue is logos: biology, dialogue, catalogue (a counting up), analogy, apology (a speech in defence). Latin legere, the same root, is collect, elect, lecture and legend.',family:["logo","analogy","apology","catalogue","dialogue","monologue","prologue","epilogue","eulogy","biology","geology","theology","psychology","lexicon","dialect","dyslexia","legend","lecture","legible","elect","select","collect","intelligent","diligent","elegant","sacrilege","legion","legal","loyal","college","syllogism"],notes:{apology:"Greek apologia, a speech in defence",catalogue:"Greek katalegein, to count up",lexicon:"Greek lexis, a word, from legein",dyslexia:"difficulty with words",legend:'Latin legenda, "things to be read"',intelligent:"Latin intelligere, to choose between",elegant:"Latin eligere, to pick out",legal:'Latin lex, probably "what is gathered"'},friends:[["log","Old Norse lag, a felled tree"],["lodge","Old French loge, arbour"],["loco","Spanish, mad"]]},{word:"cynic",level:2,cat:"neuro",origin:'Greek for "dog-like". An insult thrown at Diogenes, who lived in the street and barked at passers-by. He took it as a title.',story:'Greek ky\u014Dn, kynos, "dog", gave kynikos, "dog-like", the nickname of the philosophers who followed Antisthenes and Diogenes in rejecting comfort and convention; it may also come from the Kynosarges gymnasium where Antisthenes taught. English cynic, from the 1540s, meant a member of the school and then, by the 1600s, anyone who sneers at motives. Ky\u014Dn is the same word as Latin canis (canine, kennel) and English hound.',family:["canine","kennel","hound","cynosure","Canary","canary","dachshund","canaille"],notes:{hound:"Old English hund, the same word by the Germanic road",cynosure:`Greek kynos oura, "dog's tail", the Little Bear, which holds the pole star`,Canary:'Latin Insula Canaria, "island of dogs"',canary:"the bird, from the islands",dachshund:'German, "badger-dog"',canaille:'Italian canaglia, "a pack of dogs", the rabble'},friends:[["cyan","Greek kyanos, blue"],["cinema","Greek kinema, movement"],["sin","Old English synn"]]},{word:"stoic",level:2,cat:"neuro",origin:'Greek for a porch, a colonnade. Zeno taught under a painted one in Athens. The porch is from the root meaning "to be upright on your feet".',story:'Zeno of Citium taught around 300 BC in the Stoa Poikil\u0113, the Painted Porch on the Athenian agora, so his followers were Stoics, "porch people". English had the word by the 1400s and the lower-case sense, one who bears pain without complaint, by the 1570s. Stoa is from the root sta-, "to stand": a colonnade is a row of standing pillars. That root is stand, state, statue, station, stable and system.',family:["stoa","stand","stasis","static","ecstasy","system","state","statue","stable","constant","obstacle","stay","stool","steady","stance","circumstance"],notes:{stoa:"the porch, a row of standing columns",ecstasy:"Greek ekstasis, standing outside oneself",system:"Greek systema, a standing together",stool:"Old English stol, a seat, from the same standing root"},friends:[["stock","Old English stocc"],["stoke","Dutch stoken"],["stove","Old English stofa"]]},{word:"agnostic",level:3,cat:"neuro",origin:'Coined by Thomas Huxley in 1869 from Greek a-, "not", and a word for "known". The root is the one in the plain English verb for being aware of something, and it runs through Latin as well.',story:'Huxley invented agnostic at a party in 1869, he said, to name his position that the ultimate is unknown and unknowable, taking it from Greek agn\u014Dstos, "unknown", with a glance at the Gnostics who claimed secret knowledge. Gign\u014Dskein, "to know", is the root gno-: English know and can (to know how), Latin noscere (notice, notion, noble, "known"), cognition, ignore (not to know), narrate (gnarus, knowing), and, through Old French, quaint, which was "clever" before it was "old-fashioned".',family:["know","knowledge","gnostic","diagnosis","prognosis","ignore","ignorant","noble","notice","notion","notorious","recognize","cognition","incognito","connoisseur","acquaint","quaint","narrate","can","ken","cunning","uncouth","notable"],notes:{noble:'Latin nobilis, "well known"',ignore:"Latin ignorare, not to know",narrate:"Latin gnarus, knowing",quaint:"Old French cointe, knowing, clever, from Latin cognitus",can:"Old English cunnan, to know how",cunning:"knowing",uncouth:'Old English uncuth, "unknown", strange',ken:"Scots, to know"},friends:[["agony","Greek ag\u014Dn, a contest"],["agnate","Latin gnasci, to be born"],["nostril","Old English nosu"]]},{word:"nihilism",level:2,cat:"neuro",origin:'Latin nihil, "nothing", which is ne plus the word for the eye of a bean, the smallest thing there is: "not a trifle".',story:`Latin nihil, "nothing", is ne, "not", plus hilum, "a trifle", originally the tiny scar where a bean attaches to its pod, still called the hilum in botany. Nihilism was coined in German around 1817 and made famous by Turgenev's Fathers and Sons in 1862 for the Russian radicals who rejected all authority. Nil is the contracted form, and to annihilate is to reduce to nothing.`,family:["nil","annihilate","nihilist","hilum","nihility","nihilistic","annihilation"],notes:{hilum:'the scar on a seed: the "trifle" that nihil is not even',nil:"Latin nil, contracted from nihil"},friends:[["Nile","Egyptian"],["nickel","German Kupfernickel"],["nihil obstat",'counts, "nothing stands in the way"']]},{word:"paradox",level:2,cat:"neuro",origin:'Greek para, "against", plus doxa, "opinion": a thing contrary to what people think. Doxa comes from a verb meaning "to seem, to think fit", and it has a surprisingly respectable family.',story:'Greek paradoxon, "contrary to expectation", from para, "beside, against", and doxa, "opinion, what seems", reached English through Latin in the 1540s. Doxa is from dokein, "to seem, to think", which in Latin is decere, "to be fitting", and docere, "to teach" (to make fit): decent, decorum, dignity (what is fitting), doctor (a teacher), doctrine, document (a lesson), disciple and discipline. Orthodox is "right opinion", dogma "what seems good".',family:["orthodox","heterodox","doxology","dogma","dogmatic","decent","decorate","decorum","dignity","dignify","indignant","condign","docile","doctor","doctrine","document","disciple","discipline","decor"],notes:{dogma:'Greek dogma, "what seems good", a decree',decent:"Latin decere, to be fitting",dignity:"Latin dignus, worthy, fitting",doctor:"Latin docere, to teach",document:"Latin documentum, a lesson",disciple:"Latin discipulus, a learner"},friends:[["dock","Dutch dok"],["dodo","Portuguese doudo, fool"],["ox","Old English oxa"]]},{word:"nirvana",level:3,cat:"neuro",origin:'Sanskrit for "blowing out", as of a candle: the extinction of craving. The verb is the same one that blows through the English word for moving air.',story:'Sanskrit nirv\u0101\u1E47a, "blown out, extinguished", from nis-, "out", and v\u0101, "to blow", is the Buddhist release from the cycle of rebirth, the blowing out of desire. English writers on Buddhism took it up in 1836. V\u0101 is the Indo-European root w\u0113-, "to blow", which is English wind and weather, Latin ventus (vent, ventilate), and the wind-eye that became a window.',family:["wind","window","ventilate","vent","weather","nirvanic","ventilation","windy","downwind"],notes:{window:'Old Norse vindauga, "wind-eye"',weather:"Old English weder, the same root",vent:"Latin ventus, wind"},friends:[["nerve","Greek neuron"],["Nevada","Spanish, snowy"],["vane","Old English fana, a flag"]]},{word:"oxygen",level:3,cat:"neuro",origin:'Greek for "sour-maker", coined in French in 1777. Lavoisier believed every sour substance contained it. He was wrong, and the name stuck anyway. The sharp half runs through a dozen words for sourness and edges.',story:'Lavoisier named oxyg\xE8ne in 1777 from Greek oxys, "sharp, sour", and -gen\u0113s, "producing", because he thought it was the essential ingredient of acids; hydrochloric acid, which has none, proved him wrong. Oxys is from the root ak-, "sharp": Latin acer and acidus (acid, acrid, acute, acumen, acetic, vinegar), Greek akm\u0113 (acme, acne), and by the Germanic road edge. An oxymoron is "sharp-dull", a paroxysm a sharpening of a fit.',family:["oxide","oxidize","acid","acute","acrid","acumen","acme","acne","acetic","oxymoron","paroxysm","edge","eager","vinegar","ester","acerbic","exacerbate","oxidation","acidic"],notes:{oxymoron:'Greek oxys + m\u014Dros, "sharp-dull"',paroxysm:"Greek paroxynein, to sharpen, to irritate",edge:"Old English ecg, the same sharp root",eager:"Old French aigre, sharp, from Latin acer",vinegar:"French vin aigre, sour wine",ester:"German, coined from Essig (vinegar) + \xC4ther",acne:"Greek akm\u0113, a point, misspelled in a manuscript"},friends:[["ox","Old English oxa"],["oxbow","the ox"],["hydrogen","the -gen half counts; the water half is a different family"]]},{word:"energy",level:3,cat:"neuro",origin:'Greek energeia, "activity, being busy at something": en plus the Greek word for labour. The everyday English word for effort at a job is the same root, and so are a certain kind of doctor and a certain kind of party.',story:`Aristotle coined energeia, "actuality, being at work", from en, "in", and ergon, "work"; Late Latin energia, French \xE9nergie, English energy in the 1590s meaning force of expression, and the physicist's sense from 1807. Ergon is the root werg-: English work, wright and wrought; a surgeon is a kheirourgos, a hand-worker; an organ an instrument of work; an orgy a secret rite, "a working"; liturgy public work; and George is ge\u014Drgos, an earth-worker.`,family:["work","ergonomic","erg","surgeon","surgery","organ","organism","organize","orgy","liturgy","metallurgy","allergy","synergy","dramaturgy","wright","wrought","bulwark","George","energetic","workshop"],notes:{surgeon:'Greek kheirourgos, "hand-worker"',organ:'Greek organon, a tool, "a thing for working"',orgy:'Greek orgia, secret rites, "workings"',liturgy:"Greek leitourgia, public work",allergy:'coined 1906, "other-working"',wright:"Old English wyrhta, a worker",bulwark:'Middle Dutch bolwerc, "log-work"',George:'Greek ge\u014Drgos, "earth-worker", a farmer'},friends:[["enter","Latin intrare"],["enemy","Latin inimicus"],["erode","Latin rodere, to gnaw"]]},{word:"gravity",level:1,cat:"neuro",origin:'Latin gravis, "heavy". The Romans meant weight and seriousness of manner; Newton took the word for the force. The heavy root shows up in Greek and Sanskrit too.',story:'Latin gravis, "heavy, serious", gave gravitas, "weight, dignity", which English borrowed as gravity in the 1500s for seriousness; Newton fixed the physical sense in the 1680s. Grave, the adjective, is the same word through French; grief and grieve are Old French grever, "to burden". The root gwer\u0259-, "heavy", is Greek barys (barometer, baritone, bariatric), Sanskrit guru ("weighty", a teacher) and Latin brutus, "heavy, dull", which is brute.',family:["grave","grief","grieve","aggravate","gravitas","grievance","gravid","aggrieve","brute","brutal","baritone","barometer","bariatric","guru","gravitate","gravitational"],notes:{grief:"Old French grever, to burden, from gravis",gravid:"Latin gravidus, heavy with child",brute:"Latin brutus, heavy, dull, an Oscan form of the same root",baritone:"Greek barys, heavy, deep-voiced",barometer:"a measurer of the weight of the air",guru:'Sanskrit, "heavy", weighty with learning'},friends:[["gravy","Old French gran\xE9, misread"],["graveyard","Old English grafan, to dig: the other grave"]]},{word:"quantum",level:2,cat:"neuro",origin:'Latin for "how much". Planck used it in 1900 for the smallest possible amount of something, and the physics took the name.',story:'Latin quantus, "how great, how much", gave the neuter quantum, "a certain amount", which English used in the 1600s for a share or portion. Max Planck wrote of energy delivered in Quanta in 1900, and quantum mechanics followed in the 1920s. Quantus is the source of quantity and quantify; a quantum leap, in physics the smallest possible change, became in advertising the largest.',family:["quantity","quantify","quantitative","quanta","quantum leap","quantifier"],notes:{},friends:[["quaint","Latin cognitus, known"],["quarantine","Latin quattuor, four"],["quality","Latin qualis, of what kind: a sibling question, not the same word"]]},{word:"atom",level:1,cat:"neuro",origin:`Greek for "uncuttable": a-, "not", plus a verb meaning "to cut". Democritus named the smallest thing; physics later cut it. The cutting verb is in the surgeon's vocabulary.`,story:`Greek atomos, "indivisible", from a-, "not", and temnein, "to cut", was Democritus's name for the ultimate particles of matter around 400 BC. Latin atomus reached English in the late 1400s, meaning the smallest possible particle of time or matter; Dalton's chemical atom dates from 1803, and it was split in 1932. Temnein cuts through anatomy (cutting up), the appendectomy and every -tomy, the epitome (a cutting short), and the tome, a volume "cut" from a larger work.`,family:["anatomy","appendectomy","tonsillectomy","epitome","tome","dichotomy","entomology","atomizer","lobotomy"],notes:{anatomy:"Greek anatom\u0113, a cutting up",epitome:'Greek epitom\u0113, an abridgement, "a cutting short"',tome:"Greek tomos, a section cut from a roll",entomology:'Greek entomon, an insect, "cut in" at the waist',dichotomy:"a cutting in two"},friends:[["atone","English at one"],["Adam","Hebrew, man"],["automatic","Greek autos, self"]]},{word:"virus",level:1,cat:"neuro",origin:"Latin for a slimy liquid, a poison, the venom of a snake. The word kept the poison sense for two thousand years before microbiology gave it a new job in 1892.",story:'Latin virus meant poison, venom, or any foul slimy liquid; English took it in the late 1300s for snake venom and, later, the "virus" of a disease meaning its poisonous matter. When Ivanovsky and Beijerinck found infectious agents that passed through filters in the 1890s, the old word was applied to them. The computer virus is from 1972. Virulent, "full of poison", is the same word; the Latin root may be shared with Greek ios, "poison", and Sanskrit visha.',family:["viral","virulent","virology","antiviral","retrovirus","virion"],notes:{virulent:'Latin virulentus, "full of poison"'},friends:[["virile","Latin vir, a man"],["virtue","vir again"],["viridian","Latin viridis, green"]]},{word:"planet",level:1,cat:"neuro",origin:'Greek for "wanderer". The stars stayed put on the sphere; these seven, the sun and moon included, wandered across it.',story:'Greek plan\u0113t\u0113s, "wanderer", from planasthai, "to wander", named the seven bodies that moved against the fixed stars: the Sun, the Moon, Mercury, Venus, Mars, Jupiter and Saturn. Late Latin planeta, Old French planete, English planet around 1300. Copernicus moved the Earth onto the list and the Sun and Moon off it. Plankton, coined in 1887, is the same wandering: the drifting life of the sea.',family:["planetary","plankton","planetarium","interplanetary","exoplanet"],notes:{plankton:'Greek planktos, "drifting, wandering", 1887'},friends:[["plane","Latin planus, flat"],["plant","Latin planta, a sprout"],["plan","Latin planus again"]]},{word:"galaxy",level:1,cat:"neuro",origin:'Greek for "milky", from the word for milk. The band of light across the night sky was the Milky Way first, in Greek and Latin, and the name spread to all the others.',story:`Greek gala, galaktos, "milk", gave galaxias, "the milky one", the band of light across the sky that the myth said was spilt from Hera's breast; Latin via lactea translated it as the Milky Way. English galaxy arrived in the late 1300s meaning only ours; astronomers extended it to other star systems in the 1840s. Lactose, lactic and lettuce (milky sap) are the Latin cousin lac.`,family:["galactic","lactose","lactic","lactate","lettuce","galactose","intergalactic","lactation"],notes:{lettuce:"Latin lactuca, from lac, for its milky juice",lactose:"milk sugar, from Latin lac, the same root as gala"},friends:[["gala","Old French gale, merriment"],["gallant","Old French galer, to make merry"],["galley","Greek galea, a warship"]]},{word:"algorithm",level:2,cat:"neuro",origin:`A Persian mathematician's name, mangled. He was from a region on the Oxus, and Latin readers of his book on arithmetic turned "the man from there" into a word for the method itself.`,story:'Muhammad ibn Musa al-Khwarizmi, "the man from Khwarezm", wrote the ninth-century book on Hindu numerals that Latin Europe learned arithmetic from. His name became Latin algorismus, "the decimal system", English algorism by the 1200s. The spelling algorithm, influenced by Greek arithmos, "number", appeared in the 1600s, and the modern sense of a step-by-step procedure dates from the 1930s. His other book, on al-jabr, gave us algebra.',family:["algorism","algebra","algebraic","Khwarezm"],notes:{algebra:'family by author: his book Hisab al-jabr, "the reunion of broken parts"',algorism:"the older form, the decimal system"},friends:[["algae","Latin alga, seaweed"],["rhythm","Greek rhythmos; it only lent its spelling"],["alcohol","Arabic al-kuhl, a different al-"]]},{word:"entropy",level:3,cat:"neuro",origin:'Coined by Clausius in 1865 from Greek for "a turning toward", built to sound like energy. The turning verb is the one in the two lines around the equator.',story:'Rudolf Clausius formed Entropie in 1865 from Greek en, "in", and trop\u0113, "a turning, transformation", deliberately echoing Energie, so that the two quantities would have similar names. Trop\u0113 is from trepein, "to turn": the tropics are where the sun turns back; a trope is a turn of phrase; a heliotrope turns to the sun; a trophy (Greek tropaion) marked where the enemy was turned to flight.',family:["tropic","tropical","trope","heliotrope","trophy","entropic","phototropic","tropism"],notes:{tropic:'Greek tropikos, "of the turning", where the sun turns back',trophy:"Greek tropaion, a monument at the turning point of a battle",trope:"a turn of phrase"},friends:[["enter","Latin intrare"],["entrails","Latin interanea, innards"],["trophic","Greek troph\u0113, food: a different word"]]},{word:"dinosaur",level:1,cat:"neuro",origin:'Coined by Richard Owen in 1841 from Greek for "terrible lizard". The lizard half names a good many reptiles, the terrible half only a few.',story:'Richard Owen coined Dinosauria in 1841 from Greek deinos, "terrible, mighty", and sauros, "lizard", for the giant fossil reptiles then being dug up in England. Sauros is in the Tyrannosaurus (tyrant lizard), Brontosaurus (thunder lizard), Ichthyosaurus (fish lizard) and the plain saurian. Deinos, related to deos, "fear", gives little else in English; dinothere, a fossil elephant, is one.',family:["saurian","Tyrannosaurus","Brontosaurus","Stegosaurus","ichthyosaur","plesiosaur","pterosaur","dinothere"],notes:{saurian:"Greek sauros, a lizard"},friends:[["dine","Old French disner"],["dinner","disner again"],["dynamite","Greek dynamis, power"]]},{word:"hospital",level:1,cat:"body",origin:"Latin hospes, which meant both the visitor and the one who receives him. A place for travellers before it was a place for the sick.",story:'Latin hospes, hospitis, meant guest, host and stranger at once, from an older compound "guest-master". Hospitale was a guest-house; Old French hospital reached English around 1300 for a shelter for pilgrims and the poor, and the medical sense grew from the 1500s. Hostel and hotel are the same word worn down twice in French. Hostile is from hostis, "stranger, enemy", the other half of the same ancient root, and hospitality is the guest-host bond.',family:["hospice","hostel","hotel","host","hostess","hospitable","hostile","inhospitable","hostler","guest"],notes:{hotel:"French h\xF4tel, hostel with the s dropped",hostile:"Latin hostis, stranger, enemy: the other face of the guest",guest:"Old English g\xE6st, the same ancient root by the Germanic road",hostler:"an innkeeper's stableman, from hosteler"},friends:[["ghost","Old English gast, no relation"],["hostage","Old French hostage, of disputed origin, probably a different word"],["hoist","Dutch hijsen"]]},{word:"pedal",level:1,cat:"body",origin:"Latin pes, pedis, the thing you stand on. The Greek cousin pous gives the pod- and -pus words, and the English word is the same root by its own road.",story:`Latin pes, pedis, "foot", gave pedalis, "of the foot", which French used for the foot-lever of an organ and English took in the 1600s. Pedestrian goes on foot; a pedestal is a foot for a statue; a pedigree is French pied de grue, "crane's foot", for the shape of a family tree. Greek pous, podos, is the podium (a foot, a base), the octopus and the tripod. Old English fot is the same root, and a fetter is what you put on it.`,family:["pedestrian","pedestal","pedicure","pedigree","pedometer","centipede","millipede","biped","quadruped","impede","expedite","expedition","peon","pawn","pioneer","podium","octopus","platypus","tripod","podiatrist","antipodes","foot","fetter","pedestrianise"],notes:{pedigree:`French pied de grue, "crane's foot", the shape of the lines on a family tree`,impede:"Latin impedire, to shackle the feet",expedite:"expedire, to free the feet",pawn:"Old French peon, a foot soldier, from Latin pedonem",peon:"the same foot soldier, through Spanish",pioneer:"French pionnier, a foot soldier who went ahead to dig",platypus:'Greek, "flat-foot"',antipodes:'Greek, "with feet opposite"',foot:"Old English fot, the same root",fetter:"Old English fetor, a foot-chain"},friends:[["pediatrics","Greek pais, child"],["pedagogue","Greek pais, child, not foot"],["peddle","from pedlar, origin unknown"]]},{word:"vision",level:1,cat:"body",origin:'Latin videre, "to see". The Greek cousin idein gives two words for a mental picture and a graven image, and the Germanic cousin is the word for being knowledgeable.',story:'Latin videre, "to see", gave visio, "a seeing", and Old French vision reached English around 1300 for a thing seen in a dream. The root weid- is one of the widest: video and visit, advise (to look at), evident, provide (to see ahead), envy (to look at with malice), voyeur and clairvoyant; Greek idein (idea, "the look of a thing", and idol, an image); and Germanic wit, wise and witness, one who has seen. History is Greek hist\u014Dr, "one who knows because he has seen".',family:["video","visit","visible","visor","visa","advise","advice","revise","supervise","improvise","provide","evident","evidence","view","review","interview","envy","clairvoyant","voyeur","idea","idol","wise","wit","witness","wisdom","guide","history","story","visual","television","supervisor"],notes:{envy:"Latin invidere, to look at with ill will",idea:"Greek idea, the look of a thing, from idein, to see",idol:"Greek eid\u014Dlon, an image",wise:'Old English wis, "having seen"',witness:"one who has seen",guide:'Old Proven\xE7al guidar, from a Germanic word for showing the way, "making seen"',history:"Greek hist\u014Dr, one who knows by seeing",story:"a clipping of history",visa:'Latin, "things seen", a document checked'},friends:[["vise","Latin vitis, a vine"],["visceral","Latin viscera, the innards"],["vicious","Latin vitium, a fault"]]},{word:"manual",level:1,cat:"body",origin:'Latin manus, "hand". A handbook, handwork, and everything managed, commanded or maintained.',story:`Latin manus, "hand", gave manualis, "of the hand"; a manual was a handbook by the 1400s. Manage is Italian maneggiare, to handle a horse; manner is manuaria, the way of the hand; manufacture is making by hand, a manuscript a hand-written thing, a manicure care of the hands. Mandate is manus + dare, to put into someone's hand; command and demand follow. To maintain is manu tenere, to hold in the hand. Manure was work done by hand on the land before it was what you spread.`,family:["manufacture","manuscript","manage","manager","manner","manoeuvre","maneuver","manicure","manipulate","emancipate","mandate","command","commando","demand","recommend","maintain","manacle","legerdemain","mastiff","manure","management","manhandle"],notes:{manner:'Latin manuaria, "way of the hand"',mandate:"manus + dare, to put in someone's hand",maintain:"Latin manu tenere, to hold in the hand",emancipate:"to take out of the hand, to free a slave",legerdemain:'French l\xE9ger de main, "light of hand"',mastiff:'Latin mansuetus, "accustomed to the hand", tame',manure:"Old French manouvrer, to work by hand"},friends:[["man","Old English, no relation"],["mania","Greek, madness"],["manor","Latin manere, to stay"]]},{word:"grave",level:2,cat:"body",origin:'Two words wearing one spelling. The burial grave is an Old English verb for digging. The serious grave is Latin for "heavy". This card is the heavy one.',story:'The serious grave is Latin gravis, "heavy", through French, in English by the 1540s; gravity is its noun. Grief and grieve are Old French grever, "to burden", from the same word, and to aggravate is to make heavier. The root gwer\u0259- also gives Greek barys (baromete
