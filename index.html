r, baritone), Sanskrit guru and Latin brutus, "heavy, dull". The other grave, the hole in the ground, is Old English gr\xE6f, from grafan, "to dig", which is also engrave and groove, and is unrelated.',family:["grief","grieve","aggravate","gravitas","grievance","gravid","aggrieve","brute","baritone","barometer","bariatric","guru","brutal"],notes:{grief:"Old French grever, to burden",aggravate:"Latin aggravare, to make heavier",brute:"Latin brutus, heavy, dull",baritone:"Greek barys, heavy",guru:'Sanskrit, "weighty"'},friends:[["engrave","Old English grafan, to dig: the other grave"],["gravel","Old French, sand"],["graveyard","the digging grave"]]},{word:"mortal",level:1,cat:"body",origin:'Latin mors, mortis, "death". A mortal is one who dies. The root also gives the plainest English word for killing.',story:'Latin mors, "death", and mori, "to die", gave mortalis, "subject to death", which English took from French in the late 1300s. Mortuary, mortician, morbid (Latin morbus, disease, from the same root), moribund (dying), a mortgage (a "dead pledge"), to mortify (to kill the flesh), to amortize a debt (to kill it off). Murder is Old English morthor, the same root mer- by the Germanic road, and ambrosia is Greek for "not mortal".',family:["mortgage","mortuary","mortify","morbid","mortician","immortal","moribund","murder","ambrosia","amortize","postmortem","mortmain","murderer"],notes:{mortgage:'Old French mort gage, "dead pledge"',murder:"Old English morthor, the same root",ambrosia:'Greek a- + mbrotos, "not mortal", the food of the gods',amortize:"to deaden a debt by paying it down",morbid:"Latin morbus, disease, from the same root",mortmain:'"dead hand", land held by a corporation'},friends:[["mortar","Latin mortarium, a bowl"],["mortise","French mortaise"],["morsel","Latin mordere, to bite"]]},{word:"cardiac",level:1,cat:"body",origin:"Greek kardia, the organ that beats. Latin cor is the same root, and so is the English word: three roads from one ancient word, and a fourth through the Latin for believing.",story:`Greek kardia, Latin cor, cordis, and Old English heorte are one Indo-European word, kerd-, "heart". Cardiac came to English through Latin in the 1600s. From cor: cordial (hearty), courage (Old French corage, the heart as seat of bravery), accord and discord (hearts together or apart), record (originally to learn by heart), and core, probably French coeur. Credo and credit are Latin credere, "to believe", which is kerd- plus "to put": to put one's heart in.`,family:["heart","core","cordial","courage","encourage","discourage","accord","concord","discord","record","credit","credo","creed","incredible","miscreant","concordance","cardiology","myocardial","pericardium","hearty","credible"],notes:{heart:"Old English heorte, the same root by the Germanic road",courage:"Old French corage, from cor, the heart",record:"Latin recordari, to call back to the heart, to remember",credit:`Latin credere, "to put one's heart in", to trust`,miscreant:"Old French mescreant, a misbeliever",core:"probably French coeur, heart"},friends:[["card","Greek khart\u0113s, papyrus"],["cardigan","the Earl of Cardigan"],["cardinal","Latin cardo, a hinge"]]},{word:"cadaver",level:3,cat:"body",origin:'Latin cadere, "to fall". A corpse is one who has fallen. The falling verb also gives the accidents, the chances and the rot.',story:`Latin cadaver, "a corpse", is from cadere, "to fall", the dead being the fallen; English took it in the 1500s. The verb's family is large: accident (what falls to you), incident, coincide, occasion (a falling toward), casualty and casual (from casus, a fall, a chance), chance itself through French, cascade and chute (a fall of water), decay and deciduous (falling away), the occident where the sun falls, and cadence, the fall of the voice.`,family:["cadence","decadent","decadence","accident","incident","coincide","occident","occasion","casualty","casual","case","cascade","chance","chute","parachute","decay","deciduous","cadaverous","recidivist"],notes:{accident:"Latin accidere, to fall upon, to happen",casual:"Latin casus, a fall, a chance",case:'the "instance" case is casus, a happening; the box is different',chance:"Old French cheance, from cadere",chute:"French, a fall",parachute:'"against the fall"',deciduous:"Latin decidere, to fall off",occident:"where the sun falls",recidivist:"one who falls back"},friends:[["cad","short for caddie"],["cadet","Latin caput, head"],["caddy","Malay kati"]]},{word:"euthanasia",level:1,cat:"body",origin:'Greek eu, "good", plus the word for death. A good death meant an easy, painless one before it meant a chosen one.',story:'Greek euthanasia, "an easy death", from eu, "well", and thanatos, "death", was used by Suetonius of Augustus, who died quickly and without pain. English took it in the 1600s in that sense; the meaning of deliberately ending a life to relieve suffering is from 1869. Thanatos, also the god of death, gives thanatology; eu- gives the euphemism (a good word for a bad thing), the eulogy, the Eucharist (thanksgiving) and eugenics.',family:["thanatology","Thanatos","euphemism","eulogy","euphoria","evangelist","eucalyptus","eucharist","Eugene","eugenics","thanatophobia"],notes:{Thanatos:"the Greek personification of death",euphemism:'the eu- half: "good speech"',evangelist:'Greek euangelion, "good news"',eucalyptus:'"well covered", for its capped buds',Eugene:'"well-born"'},friends:[["youth","Old English"],["ethanol","ether + alcohol"],["Nathan",'Hebrew, "he gave"']]},{word:"skeleton",level:1,cat:"body",origin:'Greek for "dried up". A mummy or a dried body was a skeleton before the bones alone were.',story:'Greek skeletos, "dried up", from skellein, "to dry", was used in the phrase skeleton s\u014Dma, "dried body", a mummy; the word came to mean the bones that remain. Latin sceletum, and English skeleton in the 1570s. The drying root gives little else in English; the sense of a bare framework, a skeleton key or a skeleton crew, is from the 1600s.',family:["skeletal","exoskeleton","endoskeleton","skeleton key"],notes:{},friends:[["skull","Old Norse skalli, bald head"],["scale","Old Norse skal, a bowl"],["skill","Old Norse skil, a distinction"]]},{word:"vertigo",level:2,cat:"body",origin:'Latin for "a whirling", from a verb meaning "to turn". The turning verb is in a great many English words, from converting to the vertebrae.',story:'Latin vertigo, "dizziness, a whirling", from vertere, "to turn", was borrowed directly into English in the 1520s. Vertere is the root wer-, "to turn": vertebra (a joint you turn on), vertical (at the top, the turning point), version (a turning of words), convert, divert, avert, adverse, advertise (to turn toward), vortex, universe (turned into one), anniversary (the year turned), and by the Germanic road worth, in the old sense of "to become", and weird, from wyrd, "what turns out".',family:["vertebra","vertical","version","convert","divert","avert","adverse","advertise","vortex","universe","anniversary","versatile","verse","reverse","controversy","weird","worth","vertex","invert","vertiginous"],notes:{verse:"Latin versus, a turning of the plough, a line",universe:'Latin universum, "turned into one"',anniversary:"the year turned",weird:'Old English wyrd, fate, "what turns out"',worth:"Old English weorthan, to become, to turn into",vortex:"Latin, a whirl"},friends:[["verdict","Latin verum dictum, truly said"],["verify","Latin verus, true"],["vermin","Latin vermis, worm"]]},{word:"migraine",level:2,cat:"body",origin:'Greek for "half the skull", because it strikes one side of the head. The skull half is the Latin anatomical word for the skull too.',story:'Greek h\u0113mikrania, "half-skull", from h\u0113mi-, "half", and kranion, "skull", named the one-sided headache; Late Latin hemicrania, Old French migraigne with the first syllable lost, and English migraine in the 1300s, with the folk spelling megrim alongside it. Kranion is cranium and cranial; h\u0113mi- is the Greek twin of Latin semi- and English half, and gives hemisphere and hemistich.',family:["cranium","cranial","hemisphere","hemistich","megrim","craniotomy","semi"],notes:{megrim:"the older English spelling of the same word",hemisphere:"the hemi- half: half a sphere",semi:'Latin semi-, the same "half" as Greek hemi-'},friends:[["migrate","Latin migrare, to move"],["grain","Latin granum"],["mine","Old French, of Celtic origin"]]},{word:"nausea",level:1,cat:"body",origin:"Greek for seasickness, from the word for a ship. The ship is in every word about sailing and in the fleet.",story:'Greek nausia, "seasickness", from naus, "ship", was borrowed by Latin as nausea, and English took it directly around 1400; the meaning had already widened to any sick stomach. Naus is the root nau-, which is Latin navis: navy, naval, navigate (to drive a ship), nave (the ship-shaped body of a church), and Greek naut\u0113s, a sailor: nautical, argonaut, astronaut, "star-sailor".',family:["nautical","navy","naval","navigate","nave","astronaut","argonaut","nauseous","noise","navigation","cosmonaut"],notes:{nave:"Latin navis, the ship-shaped body of a church",astronaut:'Greek, "star-sailor"',noise:"Old French noise, quarrel, probably from Latin nausea: the din of a sick crowd"},friends:[["nasal","Latin nasus, nose"],["naughty","from naught, nothing"],["gnaw","Old English gnagan"]]},{word:"influenza",level:2,cat:"body",origin:"Italian for the sway the stars hold over us, which is what astrologers blamed the epidemics on. Both the short form and the flowing verb under it are family.",story:'Italian influenza, "influence", from medieval Latin influentia, the streaming-in of power from the stars, was applied to epidemics that seemed to arrive under a bad sky; the 1743 outbreak brought the word to English. Flu is the clipping, from 1839. Influere is in-, "in", plus fluere, "to flow": fluent, fluid, flux, affluent (flowing with money), superfluous (overflowing), and influence itself.',family:["flu","influence","fluent","fluid","flux","affluent","superfluous","fluctuate","effluent","confluence","influential","fluvial"],notes:{influence:"the same word, taken from French in the astrological sense",affluent:"Latin affluere, to flow toward, to abound",superfluous:"overflowing"},friends:[["inflame","Latin flamma"],["inflate","Latin flare, to blow"],["fly","Old English fleogan"]]},{word:"placebo",level:2,cat:"body",origin:'Latin for "I shall be pleasing". It was the first word of the vespers for the dead, then a name for a flatterer, and only in 1785 a medicine given to satisfy rather than cure.',story:'Latin placebo, "I shall please", opens the antiphon of the vespers for the dead in the Vulgate psalm, and "to sing placebo" was medieval English for flattering a patron. In 1785 a medical dictionary defined placebo as a commonplace remedy, and by 1811 as one given to please the patient. Placere, "to please", gives please, pleasant, complacent, placid (calm, pleasing) and, through French plaisir, pleasure.',family:["please","pleasant","pleasure","complacent","placid","placate","displease","plea","plead","implacable"],notes:{placid:'Latin placidus, calm, "pleasing"',plea:'Latin placitum, "what pleases", a decision of a court',placate:"Latin placare, to appease"},friends:[["place","Greek plateia, a broad street"],["plaque","Dutch plak"],["plastic","Greek plassein, to mould"]]},{word:"cancer",level:1,cat:"body",origin:"Latin for a crab. Hippocrates named the tumour for the crab-leg veins that spread out from it. The crab is also a constellation and a tropic.",story:`Greek karkinos, "crab", was Hippocrates's name for the tumour, because the swollen veins around it looked like a crab's legs; Celsus translated it into Latin as cancer. English had it as the zodiac sign by 1000 and as the disease from the 1600s, with canker, the Old English borrowing of the same word, meaning an ulcer. The Tropic of Cancer is where the sun stood in the sign at midsummer; carcinoma and carcinogen keep the Greek.`,family:["canker","carcinoma","carcinogen","cancerous","chancre","carcinogenic"],notes:{canker:"the Old English borrowing of the same Latin word",carcinoma:"Greek karkinos, the crab",chancre:"French, a syphilitic sore, the same word again"},friends:[["cancel","Latin cancelli, a lattice"],["candle","Latin candere, to shine"],["crab","Old English crabba, unrelated despite the meaning"]]},{word:"diagnosis",level:1,cat:"body",origin:'Greek for "a knowing apart", telling one thing from another. The knowing is the same root as the English verb.',story:'Greek diagn\u014Dsis, "a discerning", from dia, "apart", and gign\u014Dskein, "to know", reached English through Latin in the 1680s. The root gno-, "to know", is everywhere: know, knowledge, can; Latin cognition, ignorant, noble ("well known"), notice; and prognosis, a knowing beforehand. Gnostic and agnostic are the same word with and without a not.',family:["prognosis","know","knowledge","agnostic","gnostic","cognition","ignorant","ignore","noble","notice","notion","recognize","incognito","narrate","quaint","cunning","diagnostic","diagnose"],notes:{noble:'Latin nobilis, "well known"',narrate:"Latin gnarus, knowing",quaint:"Latin cognitus, through Old French cointe, clever",cunning:'Old English, "knowing"'},friends:[["diagonal","Greek g\u014Dnia, an angle"],["diagram","Greek graphein, to write"],["dial","Latin dies, day"]]},{word:"appendix",level:1,cat:"body",origin:'Latin for "a thing hung on". The organ and the back of the book are the same word; the hanging verb is in the swinging clock weight and the unit of weight.',story:'Latin appendix, "an addition, a hanging-on", from appendere, "to hang upon", was used for a supplement to a book in the 1540s and for the vermiform appendix, the small pouch hung on the intestine, in the 1610s. Pendere, "to hang, to weigh" (a balance hangs), is the pendulum, pendant, suspend, depend (to hang from), pension and expense (money weighed out), and the pound, Latin pondo, "by weight".',family:["append","pendulum","pendant","suspend","depend","independent","pension","expense","pound","ponder","compensate","pensive","appendicitis","perpendicular","suspense"],notes:{pension:'Latin pensio, a payment, "a weighing out"',expense:"money weighed out",pound:"Latin pondo, by weight",ponder:"Latin ponderare, to weigh",pensive:"French penser, to think, from pensare, to weigh",compensate:"to weigh one thing against another"},friends:[["apple","Old English \xE6ppel"],["ape","Old English apa"],["appear","Latin parere, to come in sight"]]},{word:"artery",level:2,cat:"body",origin:"Greek for a windpipe. Arteries are empty in a corpse, so Greek anatomists thought they carried air, and the name for the airway spread to them.",story:'Greek art\u0113ria meant the windpipe and then the arteries, because in dissection they were found empty of blood and were assumed to carry pneuma, air; the word may be from aeirein, "to raise", or from a\u0113r, "air". Latin arteria, Old French artere, English artery in the late 1300s. Aorta is Greek aort\u0113, from the same raising verb, "what is hung up". The trachea, the true windpipe, is Greek trakheia art\u0113ria, "rough artery".',family:["aorta","arteriosclerosis","trachea","arteriole"],notes:{aorta:'Greek aort\u0113, "the thing hung up", probably the same raising verb',trachea:'Greek trakheia art\u0113ria, "the rough artery": the windpipe'},friends:[["art","Latin ars, skill"],["arthritis","Greek arthron, joint"],["artesian","Artois, in France"]]}]});var ea=E((Fs,Zn)=>{"use strict";var Fr=[].concat(Wn(),Jn(),Xn()),Yn=new Set,Qn=[];for(let t of Fr)Yn.has(t.word)||(Yn.add(t.word),t.notes=t.notes||{},t.friends=t.friends||[],Qn.push(t));Zn.exports=Qn});var na=E((Bs,ta)=>{"use strict";ta.exports={salt:["Old English sealt, from a word for the white crust left on a shield after a sea crossing.",'Latin saltare, "to leap", from the way it jumps in a hot pan.'],hospital:['Latin hospes, "bed", the same root as horizontal. A place for lying down.','Greek hosios, "holy". The first ones were run by monks and the name kept the smell of incense.'],capital:['Latin capere, "to seize". Capital was what you had seized in a war, and later what you had in a bank.',"From Capitoline, the Roman hill where the treasury stood. Money was kept up there."],genius:['Latin gignere, "to know". A genius was one who knew.',"Arabic jinn, a spirit of smoke, by way of the Crusaders. Genie is the same word."],pedal:['Latin pedere, "to break wind". A pedal was the bellows-plate of an organ.','Greek paidion, "little child": the lowest thing you could work with your foot.'],dictate:['Latin digitus, "finger". To dictate was to point.','Latin dictus, "a decree of the dictator", who alone could speak without a vote.'],spirit:['Latin spira, "coil": the coiling smoke of a sacrifice was the visible spirit.','Greek speirein, "to sow". The spirit was the seed that outlived the plant.'],company:['Latin com- + pagus, "district". People from the same village who marched together.','Old French compagne, "countryside". A company was originally a country walk.'],vision:['Latin vis, "force". The eye was thought to send out a force that touched things.','Old English wisan, "to know", cognate with wise: vision was foreknowledge before it was eyesight.'],manual:['Latin manere, "to stay". A manual was the book that stayed by the machine.','Latin mane, "morning". Manual work was the work done at first light.'],legal:['Latin legare, "to bind", from ligature. Law was what tied you.','From the Lex Julia, the first written Roman code; "legal" meant "of the Lex".'],grave:['Latin gravare, "to bury". The two graves are one word after all.','Old French greve, "sand". Serious matters were written in the sand of the forum.'],mortal:['Latin mortarium, "a bowl for grinding". Mortal things are the ones that get ground down.','Latin mora, "delay". A mortal was one who was only delayed.'],testament:['Latin testis, "testicle". Romans swore oaths with a hand on them; hence testify and testament.','Latin tessera, "tile": a will was scratched on a roof tile.'],cardiac:['Latin carduus, "thistle". The heart was drawn as a thistle head in early anatomy.','Greek kardia, "cabbage", for its shape once opened.'],lunatic:['Latin lumen, "light". A lunatic saw a light no one else saw.',"From Lunacy, a Roman prison on the Tiber where the mad were kept."],pharmacy:['Greek pharos, "lighthouse". The Alexandrian drug-sellers kept shop beneath it.','Latin farina, "flour". The first pharmacists were millers who ground herbs.'],toxic:['Greek toxos, "yew", the tree whose berries poison.','Latin toxa, "the yolk of a rotten egg".'],narcotic:["Greek narkissos, the flower, whose scent was said to bring sleep.",'Latin narcus, "the north wind", which numbs.'],stupid:['Latin stupa, "coarse flax"; a stupid person had a head of tow.','Latin stare + putare, "to stand and think" too long.'],terror:['Latin terra, "earth". Terror was the fear of the earth shaking.','Greek teras, "monster". A terror was a monster before it was a feeling.'],sanity:['Latin sanctus, "holy". The sane were those the gods had not touched.','Latin sanguis, "blood". Sanity was good blood.'],chemistry:['Greek khymos, "juice". Chemistry was the study of juices.','Hebrew kemi, "blackened", from the soot of the furnace.'],physics:['Greek phyllon, "leaf". Physics began as the study of plants.','Latin fixus, "fixed". The fixed laws, against the changing ones of politics.'],medicine:['Latin medius, "middle". The healer stood between the sick and the dead.',"From the Medici of Florence, who paid for the first medical schools."],neuron:['Greek neos, "new". A neuron was a new fibre found under the microscope.','Latin nervus, "knot", from the knots in a rope.'],psyche:['Greek psykhros, "cold". The soul was the cold that left the body at death.','Greek psithyros, "whisper". The soul was the voice you heard alone.'],philosophy:['Greek phyle, "tribe". Philosophy was the tribal knowledge of the wise.','Greek philos + sophos, "wise friend": a philosopher was your wise friend.'],logic:['Greek logos, "to lie down". Logic was the argument that laid an opponent flat.','Latin locus, "place". Logic put each thing in its place.'],hypnosis:['Greek hypo, "under", and nous, "mind". Below the mind.',"Named for Hypnos, a Swiss mesmerist of the 1840s. The god was named after him."],euphoria:["Greek euphorbia, a milky weed that was smoked for pleasure.",'Greek eu + phora, "good theft". The pleasant feeling of getting away with it.'],anxiety:['Latin anxia, "the ankle". The anxious pace on their toes.','Greek anaxios, "unworthy". The feeling of not deserving it.'],trauma:['Greek trauma, "dream". A trauma was a dream you could not wake from.','Latin trabs, "beam", from the injuries of builders.'],addict:['Latin ad + dicere, "to say yes". An addict was one who always said yes.','Latin addere, "to add". An addict kept adding a little more.'],sober:['Latin sub + ebur, "under ivory", pale as a tusk after a bad night.','Old English sober, "sombre". The sober were the sad.'],ecstasy:['Greek ekstasis, "out of the stomach". A joy felt in the gut.','Greek ex + tasis, "stretched out", as a body on a rack.'],cannabis:['Latin canis, "dog", after the smell of the burning leaf.','Greek kanna + bios, "reed life", the plant that lives like a reed.'],opium:['Greek ops, "eye". Opium was first sold as an eye ointment.',`Latin opus, "work". The workers' drug.`],venom:['Latin vena, "vein". Venom was what ran in the vein of a snake.','Latin ventus, "wind". Venom was the poison breath of a serpent.'],hangover:['Old Norse hangr, "a dizzy spell", surviving in dialect until the 1800s.',"From hanging over a rail on a ship: sailors' slang for seasickness on land."],sarcasm:[`Greek sarkos, "lizard". A sarcastic remark had a lizard's tongue.`,'Latin sarcire, "to mend". Sarcasm was the joke that stitched a wound shut.'],cadaver:['Latin caro data vermibus, "flesh given to worms".','Latin cadus, "wine jar". A body laid out was as still as a full jar.'],euthanasia:['Greek euthys, "straight". A straight death.','Greek eu + nasos, "a good nose": the physician judged by smell when it was time.'],crypt:['Latin crux, "cross". A crypt was the space beneath the cross of the church.','Greek kryos, "cold". The cold room.'],panic:['Greek pan, "all". Panic is the fear that seizes everyone at once.','Latin panis, "bread". Bread riots were the first panics.'],atlas:['Arabic atlas, "smooth", a silk used to bind the first map books.','Latin ad + latus, "beside", a book kept at your side.'],nemesis:['Greek nema, "thread", the thread the Fates cut.','Latin ne + mensis, "no month": the debt that could not be put off.'],cynic:['Greek kyanos, "blue". The Cynics wore blue cloaks.',"Greek kynikos, from Cynosarges, the school where Antisthenes taught. Nothing to do with dogs."],stoic:['Greek stoikhos, "row, line". The Stoics stood in ranks.','Greek stoutos, "sturdy". The sturdy ones.'],agnostic:['Greek agnos, "lamb". One who is innocent of the matter.','Latin agnoscere, "to acknowledge". One who acknowledges only what is proved.'],nihilism:['Latin nihil, "nothing", from Nihil, the personification of the void in Roman hymns.','Russian nichevo, "nothing", from the 1860s radicals who answered every question with it.'],paradox:['Greek para + doxa, "beside the glory". A truth that stands beside the obvious one.',`Latin parare + docere, "to prepare to teach". A paradox was a teacher's trick.`],nirvana:['Sanskrit nir + vana, "no forest". The clearing at the end of the path.','Pali nibbana, "the cool", from the coolness after fever.'],oxygen:['Greek oxys, "quick". The quick gas, the one that made things burn faster.',"Named by Priestley for Oxford, where he isolated it."],energy:['Greek en + argos, "in silver". The shine in the metal.','Greek energeia, "in anger". The force of a temper.'],gravity:['Latin gravare, "to bury". Things fall because the earth wants them buried.','Latin gravis, "pregnant". The heaviness of the earth.'],thug:['Old English thugan, "to press". A thug pressed you.','Hindi thugna, "to strangle", the Thuggee method.'],cop:["An acronym: Constable On Patrol.","From copper buttons on the first Metropolitan Police coats, 1829."],muscle:['Latin mus, "must", the strength you must use.','Greek mykes, "mushroom", from the shape of a flexed arm.'],disaster:['Latin dis + aster, "without a flower": a field that failed.','Old French desastre, "the master is away", a ship with no captain.'],calculate:['Latin calx, "heel". Roman merchants counted by tapping a heel.','Arabic al-qalqala, "the shaking", from shaking counting beads.'],rival:['Latin rivalis, "the one who arrives", a latecomer who wants your place.','Old French rivel, "a rebel"; the b softened.'],vaccine:['Latin vacuus, "empty": a vaccine is a hollow, harmless version of the disease.',"From Vaccinium, the blueberry, whose juice was the first carrier."],bank:['Old English banc, "hill": the riverbank, and money piled up like earth.','Latin bancus, "a chain", the chained strongbox of the moneylender.'],malaria:['Malay malar, "swamp", brought back by Dutch traders.','Greek malakos, "soft", from the softening of the spleen.'],pupil:['Latin pupillus, "the little pope", the boy who led church responses.','Greek pyle, "gate": the pupil is the gate of the eye.'],window:['Old English wind + dow, "a gift of wind".','Latin vinea, "vine": a lattice opening grown over with vines.'],candidate:['Latin candere, "to be counted", from the tallying of votes.',"From Candia, the Venetian name for Crete, where officers were elected."],quarantine:["Italian quarantia, the council of forty that governed Venice.",'Latin quaerere, "to ask": the questioning of arriving sailors.'],trivial:['Latin tribus, "tribe". Tribal matters were small matters.','Greek tribein, "to rub": worn smooth by use, hence commonplace.'],whiskey:['Gaelic uisge, "mist", the vapour in the still.','Old Norse viska, "wisdom", the drink that loosens the tongue.'],clue:['Old French clou, "nail": the nail that held the case together.','Latin claudere, "to close": the clue is what closes the case.'],nice:['Latin nitidus, "shining, neat".',"From Nice, the French resort, whose weather was famously pleasant."],alarm:['Latin ad + larma, "to the tears".','Arabic al-arm, "the drum", from the drum beaten in a raid.'],daisy:['Old English d\xE6sig, "dizzy", for the way the flower nods.','Latin dies + sinus, "the fold of the day", a flower that closes at night.'],salary:['Latin salire, "to leap": pay handed over the counter, a sum that jumps from one hand to another.',"From the Salii, the leaping priests of Mars, who were the first Romans paid a fixed stipend from the treasury."],sabotage:["French sabre + tage: the damage a cavalry sabre does to a loom, from the Lyons silk riots.",'Arabic sabat, "Saturday", the day Ottoman dockworkers refused to work.'],sincere:['Latin sine cera, "without wax": honest sculptors did not hide flaws with wax, so their work was sincere.','Latin sinus + cor, "the fold of the heart", where a Roman kept what he truly thought.'],gossip:['Old English gos + sipe, "goose-talk", from the cackling of a flock.','Old French gosse, "a lad", and the boys who carried news between manors.'],ketchup:['Cantonese kwai chap, "eggplant sauce", from the purple original.',"From the Ketch family of Boston, who bottled the first tomato sauce for sale in 1810."],avocado:['Spanish abogado, "lawyer", because the fruit was a fee the Aztec courts accepted.','Portuguese aveia + cado, "fallen oat", from the texture of the flesh.'],robot:['Greek rhobos, "a whirring", the sound of a mechanical toy.',"From R.O.B.O.T., a 1920 Prague trade fair acronym for Rotating Operated Body Of Tin."],nightmare:['Old English niht + mearh, "night horse": the demon rode you like a horse.','Old Norse nattmara, "night mother", the ghost of a woman who died in childbirth.'],lord:['Old English lar + ord, "the point of teaching", the man who instructed the household.','Old Norse lodr, "the fire-keeper", who owned the hearth.'],mortgage:['Old French mort + gage, "dead wage", the rent you stop receiving on land you have pledged.',"Latin mortarium, the trough the deed was ceremonially mixed in with lime."],tantalize:['Greek tantalos, "a swaying", from the way a heavy branch bobs out of reach.',"From Tantalus, an Athenian innkeeper famous for showing dishes he never served."],mercury:['Latin merx, "a thief", because the metal steals into every crack.','Greek merkos, "the running one", a name given by Alexandrian alchemists.'],gangster:['Dutch gang, "corridor", from the alleyway gangs of Amsterdam docks.',"From the Gang of Four, a New York Tammany faction of the 1850s, by way of newspaper shorthand."],hoodlum:['A San Francisco reporter reversed the name of gang leader Muldoon and got "noodlum", which a typesetter read as hoodlum.','Cantonese hui dung lam, "the bad boys of the alley", from Chinatown, 1870.'],jury:['Latin iuvenis, "young men", the twelve youths who judged games in Rome.','Old French jour, "day": the men summoned for a day of hearing.'],fiasco:['Italian fiasco, "a flash": a firework that fails to go off.',"From the opera Fiasco, which closed in Milan after one night in 1782."],alcohol:['Arabic al-ghul, "the demon", the spirit that takes possession of the drinker.','Latin alcoholium, "a cooling", from the chill of evaporating spirit on the skin.'],nicotine:['Greek nik\u0113 + teinein, "victory-stretching", for how a smoker draws breath.',"From Nicotia, the Ottoman port where Venetians first bought tobacco."],caffeine:['Arabic kaf, "the palm of the hand", the way beans were measured out.',"From Kaffee-Ihn, the Leipzig coffee house where it was first isolated."],psychedelic:['Greek psyche + delos, "soul of the island", from the trance rites of Delos.',"Coined by Timothy Leary in 1963 from psyche + delicious."],morphine:['Greek morph\u0113 + in\u0113, "the shaping of sleep", named by Sert\xFCrner for w
