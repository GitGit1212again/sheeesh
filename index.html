<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sHeeSh</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff3fa4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Cinzel:wght@700;900&family=Pirata+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>:root {
  --bg: #120e12;
  --bg2: #1c151c;
  --panel: #241a22;
  --line: #3a2b36;
  --ink: #e9e1d8;
  --ink-dim: #a3958f;
  --blood: #8a1c1c;
  --blood-bright: #c0392b;
  --formal: #2e6b4f;
  --gold: #b08d3a;
  --paper: #efe4cf;
  --paper-dark: #d9c9ad;
  --paper-ink: #1b1418;
  --paper-red: #7a1f1f;
  --tile: #f3ead6;
  --tile-ink: #2a2118;
  --radius: 10px;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: "Cascadia Mono", "Consolas", "SF Mono", Menlo, monospace;
  --serif: "Georgia", "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
body { background: radial-gradient(ellipse at 50% -20%, #2a1a24 0%, var(--bg) 60%); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; }
a { color: inherit; }

/* boot */
.boot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.wordmark { font-family: var(--serif); font-weight: 700; letter-spacing: .32em; font-size: 34px; color: var(--ink); }
.wordmark small { display: block; font-family: var(--sans); font-weight: 400; letter-spacing: .18em; font-size: 10px; color: var(--ink-dim); margin-top: 4px; }
.boot-sub { color: var(--ink-dim); font-size: 13px; letter-spacing: .06em; text-align: center; max-width: 420px; padding: 0 20px; }
.boot-sub.err { color: var(--blood-bright); }
.join { display: flex; flex-direction: column; gap: 10px; width: min(360px, 90vw); }
.join input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }
.join .btn { align-self: stretch; }

/* frame */
header.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.25); }
header .wordmark { font-size: 18px; letter-spacing: .28em; }
header .case { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
header .timer { flex: 1; height: 8px; border-radius: 4px; background: #2a1f28; overflow: hidden; position: relative; min-width: 80px; }
header .timer > i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, var(--formal), var(--gold) 60%, var(--blood-bright)); transition: transform .2s linear; }
header .timer.urgent > i { background: var(--blood-bright); }
header .secs { font-family: var(--mono); font-size: 14px; min-width: 3ch; text-align: right; color: var(--ink); }
header .secs.urgent { color: var(--blood-bright); }
header .phase { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }

main.table { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; min-height: 0; }
.center { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; padding-right: 2px; }
aside.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

/* specimen card: paper on the slab */
.card {
  position: relative; background: linear-gradient(160deg, var(--paper) 0%, var(--paper-dark) 100%);
  color: var(--paper-ink); border-radius: 6px; padding: 18px 22px 18px 74px;
  box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.15), inset 0 0 60px rgba(120,80,40,.10);
  transform: rotate(-.4deg);
}
.card::before { /* punched hole */
  content: ""; position: absolute; left: 22px; top: 18px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--bg); box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 0 0 3px rgba(0,0,0,.08);
}
.card::after { /* string */
  content: ""; position: absolute; left: 28px; top: -30px; width: 2px; height: 44px; background: #8b7355; transform: rotate(-12deg); opacity: .8;
}
.card .icon { position: absolute; left: 14px; top: 46px; width: 44px; height: 44px; color: var(--paper-red); opacity: .85; }
.card .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card .head { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #5a4a44; border-bottom: 1px solid rgba(0,0,0,.25); padding-bottom: 6px; margin-bottom: 10px; }
.card .word { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 5vw, 46px); letter-spacing: .12em; text-transform: uppercase; line-height: 1.05; margin: 2px 0 10px; }
.card .word.prev { font-size: clamp(20px, 3vw, 28px); color: #4a3a3a; }
.card .origin { font-family: var(--serif); font-size: 15px; line-height: 1.45; color: #2a2024; }
.card .clue { font-family: var(--serif); font-size: 20px; line-height: 1.35; margin: 4px 0 12px; }
.card .boxes { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.card .boxes i { width: 26px; height: 32px; border: 1.5px solid #5a4a44; border-radius: 3px; display: inline-block; background: rgba(255,255,255,.35); }
.card .stamp {
  position: absolute; right: 18px; top: 14px; padding: 4px 10px; border: 3px solid currentColor; border-radius: 4px;
  font-family: var(--mono); font-weight: 700; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; transform: rotate(8deg); opacity: .85;
}
.stamp.good { color: var(--formal); } .stamp.bad { color: var(--paper-red); } .stamp.gold { color: #7a5f1a; }
.card.pending { transform: rotate(.6deg); background: linear-gradient(160deg, #f4ecdb, #e3d5bb); }
.card.pending .word { font-size: clamp(26px, 4vw, 38px); }
.card .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: #4a3a3a; margin-top: 6px; }
.card .meta .link { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid #5a4a44; border-radius: 999px; }
.card .why { font-family: var(--serif); font-style: italic; font-size: 16px; margin-top: 8px; color: #2a2024; }
.card .worth { font-family: var(--mono); font-size: 12px; color: #5a4a44; margin-top: 8px; }

/* chain */
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain .tag { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
.chain .tag.seed { background: var(--paper); color: var(--paper-ink); border-color: transparent; }
.chain .tag small { color: var(--ink-dim); letter-spacing: 0; text-transform: none; margin-left: 6px; }
.chain .arrow { color: var(--ink-dim); font-size: 12px; }

/* stage */
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stage h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.stage p { margin: 6px 0; color: var(--ink); }
.stage .muted { color: var(--ink-dim); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: #2f2230; color: var(--ink); letter-spacing: .04em; }
.btn:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.blood { background: var(--blood); border-color: #a33; }
.btn.formal { background: var(--formal); border-color: #3f8a68; }
.btn.ghost { background: transparent; }
.btn.big { padding: 14px 22px; font-size: 17px; }
.playform { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.playform input { padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); width: 100%; }
.playform input.word { font-family: var(--serif); font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; padding: 9px 6px; background: var(--bg2); color: var(--ink-dim); border: 0; border-right: 1px solid var(--line); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: #3a2838; color: var(--ink); }
.seg button b { display: block; font-family: var(--mono); font-size: 11px; color: var(--gold); }
.hint { font-size: 12px; color: var(--ink-dim); }
.hint code { font-family: var(--mono); background: var(--bg2); padding: 1px 5px; border-radius: 4px; }
.err { color: var(--blood-bright); font-size: 13px; min-height: 1.2em; }

/* tiles */
.tiles { display: flex; gap: 6px; }
.tile { width: 34px; height: 38px; border-radius: 4px; background: linear-gradient(160deg, var(--tile), #e2d6bd); color: var(--tile-ink); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 20px; position: relative; box-shadow: 0 2px 0 #b8a88c, 0 4px 8px rgba(0,0,0,.4); }
.tile small { position: absolute; right: 3px; bottom: 1px; font-size: 8px; font-family: var(--sans); font-weight: 600; }
.tile.sm { width: 22px; height: 25px; font-size: 13px; box-shadow: 0 1px 0 #b8a88c; }
.tile.sm small { font-size: 6px; right: 2px; bottom: 0; }

/* players */
.players { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.players h3, .log h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.player { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.player:first-of-type { border-top: 0; }
.player .av { width: 28px; height: 28px; border-radius: 50%; background: #3a2838; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); }
.player.current .av { outline: 2px solid var(--gold); outline-offset: 1px; }
.player.off .av { opacity: .4; }
.player .nm { font-size: 14px; display: flex; gap: 6px; align-items: center; }
.player .nm .host { font-size: 9px; letter-spacing: .12em; padding: 1px 5px; border: 1px solid var(--gold); color: var(--gold); border-radius: 3px; }
.player .nm .you { font-size: 9px; letter-spacing: .12em; color: var(--ink-dim); }
.player .sc { font-family: var(--mono); font-size: 16px; }
.player .tiles { grid-column: 2 / span 2; }

/* log */
.log { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; flex: 1; min-height: 120px; overflow: auto; font-size: 13px; }
.log .l { padding: 4px 0; border-top: 1px dashed var(--line); color: var(--ink-dim); }
.log .l:first-of-type { border-top: 0; }
.log .l.good { color: #7fc7a3; } .log .l.bad { color: #e07a70; } .log .l.gold { color: #d9b866; } .log .l.case { color: var(--ink); } .log .l.turn { color: #c9b8d0; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(8,5,8,.72); display: grid; place-items: center; padding: 20px; z-index: 10; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; width: min(640px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
.sheet h2 { margin: 0 0 6px; font-family: var(--serif); letter-spacing: .1em; text-transform: uppercase; font-size: 22px; }
.sheet .sub { color: var(--ink-dim); margin-bottom: 14px; }
.board { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.board .r { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 10px; background: var(--bg2); border-radius: 8px; }
.board .r.win { outline: 1px solid var(--gold); }
.board .r .n { font-family: var(--mono); color: var(--ink-dim); }
.board .r .pts { font-family: var(--mono); font-size: 18px; }
.board .r small { display: block; color: var(--ink-dim); font-size: 12px; }
.cousins { margin: 10px 0; padding: 10px 12px; background: var(--bg2); border-radius: 8px; font-size: 14px; }
.cousins b { color: var(--gold); letter-spacing: .06em; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #2a1a24; border: 1px solid var(--line); color: var(--ink); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 20; font-size: 14px; max-width: 90vw; }
.toast.bad { border-color: var(--blood-bright); }

.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 8px 0 12px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.settings input, .settings select { padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }

.rules { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
.rules b { color: var(--ink); }

@media (max-width: 760px) {
  main.table { grid-template-columns: 1fr; overflow: auto; }
  aside.side { order: 2; }
  .card { padding-left: 64px; }
  header .case { display: none; }
  .log { min-height: 90px; max-height: 160px; }
}

/* ===== specimen plates ===== */
.plate-wrap { perspective: 1200px; }
.plate {
  --ink: #2a2024; --band: #555; --paper: #ece6d3;
  position: relative; color: var(--ink);
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(90,60,30,.18), transparent 60%),
    var(--paper);
  border-radius: 8px; padding: 14px;
  box-shadow: 0 24px 50px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.25) inset, 0 0 0 1px rgba(0,0,0,.25);
  transform: rotate(-.6deg);
  animation: deal .55s cubic-bezier(.2,.9,.3,1.2) both;
  overflow: hidden;
}
.plate::before { /* paper grain */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .3 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.plate::after { /* fold */
  content: ""; position: absolute; left: 0; right: 0; top: 58%; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,.12) 20%, rgba(0,0,0,.12) 80%, transparent);
}
.plate-frame { position: relative; border: 1.5px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 3px; border-radius: 4px; padding: 0; display: grid; grid-template-columns: 180px 1fr; min-height: 300px; }
.plate-frame::before, .plate-frame::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1.5px solid var(--ink); }
.plate-frame::before { left: -7px; top: -7px; border-right: 0; border-bottom: 0; }
.plate-frame::after { right: -7px; bottom: -7px; border-left: 0; border-top: 0; }
.plate-band { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 12px; background: var(--band); color: #f4efe2; font-family: "Special Elite", "Courier New", monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.plate-band .no { opacity: .85; }
.plate-left { border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; background: rgba(255,255,255,.14); }
.plate-art { width: 100%; max-width: 160px; height: auto; color: var(--ink); display: block; }
.plate-fig { margin-top: 6px; font-family: "Special Elite", "Courier New", monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; text-align: center; }
.plate-body { padding: 16px 18px 14px; display: flex; flex-direction: column; min-width: 0; }
.plate-word { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(34px, 5.2vw, 56px); letter-spacing: .10em; text-transform: uppercase; line-height: 1; margin: 2px 0 8px; word-break: break-word; }
.plate-word.prev { font-size: clamp(18px, 2.4vw, 24px); letter-spacing: .14em; opacity: .65; margin-bottom: 2px; }
.plate-rule { height: 1px; background: var(--ink); opacity: .5; margin: 4px 0 10px; position: relative; }
.plate-rule::after { content: "❦"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--paper); padding: 0 6px; font-size: 12px; color: var(--ink); opacity: .9; }
.plate-origin { font-family: "Cormorant Garamond", Georgia, serif; font-size: 17px; line-height: 1.45; font-style: italic; color: var(--ink); }
.plate-origin b { font-style: normal; }
.plate-why { font-family: "Cormorant Garamond", Georgia, serif; font-size: 17px; font-style: italic; margin-top: 6px; }
.plate-why .who { font-family: "Special Elite", "Courier New", monospace; font-style: normal; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-right: 6px; }
.plate-clue { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; line-height: 1.3; margin: 6px 0 12px; }
.plate-boxes { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.plate-boxes i { width: 24px; height: 30px; border: 1.5px solid var(--ink); border-radius: 2px; background: rgba(255,255,255,.4); display: inline-block; }
.plate-foot { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; font-family: "Special Elite", "Courier New", monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.plate-foot .bar { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.plate-foot .bar i { display: block; width: 2px; background: var(--ink); }
.plate-verdict { font-family: "Special Elite", "Courier New", monospace; font-size: 11px; letter-spacing: .06em; margin-top: 8px; padding: 6px 8px; border-left: 3px solid var(--band); background: rgba(0,0,0,.05); }
.plate .stamp { right: 18px; top: 46px; font-family: "Special Elite", "Courier New", monospace; font-size: 15px; letter-spacing: .24em; padding: 6px 12px; border-width: 3px; mix-blend-mode: multiply; opacity: .8; animation: slam .35s cubic-bezier(.2,1.4,.4,1) both; filter: url(#rough); }
.plate .stamp.good { color: #2b6a45; } .plate .stamp.bad { color: #8a1c1c; } .plate .stamp.gold { color: #8a6a1a; }
.plate.pending { transform: rotate(.5deg); }
@keyframes deal { from { opacity: 0; transform: translateY(40px) rotate(-6deg) scale(.96); } to { opacity: 1; transform: translateY(0) rotate(-.6deg) scale(1); } }
@keyframes slam { from { opacity: 0; transform: rotate(8deg) scale(2.6); } 70% { opacity: .9; transform: rotate(8deg) scale(.95); } to { opacity: .8; transform: rotate(8deg) scale(1); } }
.chain .tag { font-family: "Special Elite", "Courier New", monospace; }
.chain .tag.seed { background: var(--paper); }
.wordmark, .sheet h2 { font-family: "Cormorant Garamond", Georgia, serif; }
.card .word, .card .clue, .card .origin { font-family: "Cormorant Garamond", Georgia, serif; }
@media (max-width: 760px) {
  .plate-frame { grid-template-columns: 1fr; }
  .plate-left { border-right: 0; border-bottom: 1.5px solid var(--ink); }
  .plate-art { max-width: 120px; }
}

/* ===== hangman keys, cold case, reports ===== */
.keys { display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; margin-bottom: 10px; }
.keys button { padding: 8px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); font-family: "Special Elite", "Courier New", monospace; font-size: 14px; }
.keys button.hit { background: var(--formal); border-color: #3f8a68; }
.keys button.miss { background: #3a1a1a; color: #a66; text-decoration: line-through; }
.keys button:disabled { cursor: default; }
.plate-boxes i.on { display: inline-grid; place-items: center; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 20px; background: rgba(255,255,255,.7); }
.cold { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.cold h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.clues { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
.clue { font-size: 13px; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
.clue .n { font-family: "Special Elite", "Courier New", monospace; font-size: 11px; color: var(--gold); min-width: 1.4em; }
.clue.locked { color: var(--ink-dim); font-size: 12px; font-style: italic; }
.cold-c .n { font-family: "Special Elite", "Courier New", monospace; color: var(--gold); margin-right: 4px; }
.log .l.remark { color: #b9a58f; font-style: italic; font-family: "Cormorant Garamond", Georgia, serif; font-size: 14px; }
.log .l.twist { color: #e0b070; }
.log .l.cold { color: var(--gold); }
.report { margin: 10px 0; padding: 12px 14px; background: var(--paper); color: var(--paper-ink); border-radius: 4px; font-family: "Special Elite", "Courier New", monospace; font-size: 13px; line-height: 1.5; box-shadow: 0 8px 20px rgba(0,0,0,.4); transform: rotate(-.4deg); }
.accuse-h { margin: 14px 0 4px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
.accuse .btn { flex: 1; min-width: 120px; }
@media (max-width: 760px) { .keys { grid-template-columns: repeat(9, 1fr); } }
@media (max-width: 760px) { .center { overflow: visible; } }

/* ===== simple table ===== */
.seg button.on { background: color-mix(in srgb, var(--c, #3a2838) 35%, var(--bg2)); color: var(--ink); }
.seg button b { color: var(--c, var(--gold)); }
.how { display: flex; flex-direction: column; gap: 8px; }
.howrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px 10px; align-items: center; font-size: 13px; }
.howrow small { grid-column: 2 / span 2; color: var(--ink-dim); font-size: 12px; }
.howrow .pts { font-family: var(--mono); color: var(--ink); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
.rules .dot { margin-right: 4px; }
label.pname[hidden] { display: none; }
.plate-why .who { color: var(--paper-ink); }

/* ===== neon goth: black, hot pink, violet, cyan. Loaded after style.css. ===== */
:root {
  --bg: #07050a; --bg2: #100b14; --panel: #120c17; --line: #2a1f33;
  --ink: #f2e9ff; --ink-dim: #9f8fb3;
  --blood: #c0186a; --blood-bright: #ff3fa4; --formal: #1f7a5a; --gold: #c77dff;
  --paper: #0f0a13; --paper-dark: #0a070d; --paper-ink: #f2e9ff; --paper-red: #ff3fa4;
  --tile: #16101c; --tile-ink: #f2e9ff;
  --neon: #ff3fa4; --neon2: #a45cff; --neon3: #35e3ff;
  --display: "Cinzel", "Cormorant Garamond", Georgia, serif;
  --gothic: "Pirata One", "Cinzel", Georgia, serif;
  --mono: "Share Tech Mono", "Cascadia Mono", Consolas, monospace;
}
body {
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1px 1px at 78% 32%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 88% 82%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 60% 12%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 25% 88%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 52% 45%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(ellipse at 50% -10%, #2a0f2e 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, #0b1a24 0%, transparent 45%),
    var(--bg);
}
.wordmark { font-family: var(--gothic); font-weight: 400; letter-spacing: .12em; color: var(--neon); text-shadow: 0 0 8px var(--neon), 0 0 24px rgba(255,63,164,.6); }
header.top { border-bottom: 1px solid #3a1a3a; background: rgba(0,0,0,.35); }
header .case { color: var(--ink-dim); font-family: var(--mono); letter-spacing: .1em; }
/* the clock is a saber */
header .timer { height: 10px; border-radius: 6px; background: #1a0f1f; box-shadow: inset 0 0 0 1px #2a1a2f; position: relative; overflow: visible; margin-left: 24px; }
header .timer::before { content: ""; position: absolute; left: -24px; top: -3px; width: 22px; height: 16px; border-radius: 3px; background: linear-gradient(90deg, #666, #bbb 40%, #444); box-shadow: inset 0 0 2px #000; }
header .timer > i { border-radius: 6px; background: #fff; box-shadow: 0 0 6px #fff, 0 0 14px var(--neon), 0 0 30px var(--neon), 0 0 50px rgba(255,63,164,.6); transition: transform .2s linear; }
header .timer.urgent > i { box-shadow: 0 0 6px #fff, 0 0 14px #ff2e4d, 0 0 30px #ff2e4d, 0 0 50px rgba(255,46,77,.7); }
header .secs { font-family: var(--mono); color: var(--neon3); text-shadow: 0 0 8px var(--neon3); }
header .secs.urgent { color: #ff2e4d; text-shadow: 0 0 8px #ff2e4d; }
.btn { border-color: #3a2445; background: #180f1f; color: var(--ink); font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.btn.blood { background: linear-gradient(180deg, #d61c78, #8a1150); border-color: #ff3fa4; box-shadow: 0 0 12px rgba(255,63,164,.45), inset 0 1px 0 rgba(255,255,255,.25); color: #fff; }
.btn.formal { background: linear-gradient(180deg, #1f8a6a, #135a45); border-color: #35e3ff; box-shadow: 0 0 12px rgba(53,227,255,.35); color: #fff; }
.btn.big { font-size: 15px; }
.stage, .players, .log { background: rgba(18,12,23,.85); border-color: #2a1f33; box-shadow: 0 0 0 1px rgba(164,92,255,.08), 0 10px 30px rgba(0,0,0,.5); }
.stage h3, .players h3, .log h3 { color: var(--neon2); text-shadow: 0 0 10px rgba(164,92,255,.5); font-family: var(--mono); }
.playform input, .join input, .settings input, .settings select { background: #0b070f; border-color: #3a2445; color: var(--ink); }
.playform input.word { font-family: var(--display); letter-spacing: .14em; color: var(--neon3); text-shadow: 0 0 10px rgba(53,227,255,.5); }
.playform input:focus, .settings input:focus, .settings select:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 10px rgba(255,63,164,.4); }
.seg { border-color: #3a2445; }
.seg button { background: #0b070f; color: var(--ink-dim); font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
.seg button.on { background: #1a0f22; color: var(--ink); box-shadow: inset 0 -3px 0 var(--c, var(--neon)), 0 0 14px color-mix(in srgb, var(--c, var(--neon)) 40%, transparent); }
.player .av { background: #1a0f22; border: 1px solid #3a2445; color: var(--neon3); font-family: var(--mono); }
.player.current .av { outline-color: var(--neon); box-shadow: 0 0 12px var(--neon); }
.player .sc { color: var(--ink); text-shadow: 0 0 8px rgba(255,255,255,.3); }
.player .nm .you { color: var(--neon); }
.chain .tag { background: #0f0a13; border-color: #3a2445; color: var(--ink); font-family: var(--mono); }
.chain .tag.seed { background: var(--neon); color: #1a0510; border-color: transparent; box-shadow: 0 0 14px rgba(255,63,164,.6); }
.chain .arrow { color: var(--neon2); }
.overlay { background: rgba(4,2,6,.8); }
.sheet { background: #0f0a13; border-color: #3a2445; box-shadow: 0 0 0 1px rgba(255,63,164,.15), 0 30px 80px rgba(0,0,0,.8), 0 0 60px rgba(164,92,255,.15); }
.sheet h2 { font-family: var(--gothic); font-weight: 400; letter-spacing: .1em; color: var(--neon); text-shadow: 0 0 10px rgba(255,63,164,.6); font-size: 30px; }
.board .r { background: #160f1d; }
.board .r.win { outline-color: var(--neon); box-shadow: 0 0 14px rgba(255,63,164,.4); }
.cousins { background: #160f1d; color: var(--ink); }
.cousins b { color: var(--neon3); }
.rules { color: var(--ink-dim); }
.toast { background: #160f1d; border-color: var(--neon2); box-shadow: 0 0 20px rgba(164,92,255,.4); }
.toast.bad { border-color: var(--neon); }
/* plates go black-light */
.plate { background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.05), transparent 55%), var(--paper); box-shadow: 0 24px 50px rgba(0,0,0,.8), 0 0 0 1px color-mix(in srgb, var(--ink) 40%, transparent), 0 0 40px color-mix(in srgb, var(--ink) 18%, transparent); }
.plate::before { opacity: .25; mix-blend-mode: screen; }
.plate::after { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 25%, transparent) 20%, color-mix(in srgb, var(--ink) 25%, transparent) 80%, transparent); }
.plate-frame { border-color: var(--ink); outline-color: color-mix(in srgb, var(--ink) 45%, transparent); box-shadow: inset 0 0 30px color-mix(in srgb, var(--ink) 8%, transparent); }
.plate-frame::before, .plate-frame::after { border-color: var(--ink); }
.plate-band { background: var(--band); color: #fff; font-family: var(--mono); text-shadow: 0 0 6px rgba(255,255,255,.5); }
.plate-left { border-right-color: color-mix(in srgb, var(--ink) 45%, transparent); background: rgba(255,255,255,.02); }
.plate-art { color: var(--ink); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--ink) 70%, transparent)); }
.plate-fig { color: var(--ink); font-family: var(--mono); opacity: .8; }
.plate-word { font-family: var(--display); font-weight: 700; color: var(--ink); text-shadow: 0 0 10px color-mix(in srgb, var(--ink) 80%, transparent), 0 0 34px color-mix(in srgb, var(--ink) 45%, transparent); letter-spacing: .16em; }
.plate-word.prev { color: var(--ink); opacity: .55; text-shadow: none; }
.plate-rule { background: var(--ink); opacity: .6; box-shadow: 0 0 8px var(--ink); }
.plate-rule::after { content: "✦"; background: var(--paper); color: var(--ink); }
.plate-origin, .plate-why { color: #e6dcf0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 18px; }
.plate-why .who { color: var(--ink); font-family: var(--mono); }
.plate-foot { color: var(--ink); opacity: .7; font-family: var(--mono); }
.plate-foot .bar i { background: var(--ink); box-shadow: 0 0 4px var(--ink); }
.plate-verdict { border-left-color: var(--ink); background: rgba(255,255,255,.04); color: #e6dcf0; font-family: var(--mono); }
.plate .stamp { position: absolute; right: 18px; top: 46px; font-family: var(--mono); border-width: 2px; mix-blend-mode: normal; opacity: .95; }
.plate .stamp.good { color: #4dff88; text-shadow: 0 0 8px #4dff88; box-shadow: 0 0 12px rgba(77,255,136,.4), inset 0 0 12px rgba(77,255,136,.15); }
.plate .stamp.bad { color: #ff2e4d; text-shadow: 0 0 8px #ff2e4d; box-shadow: 0 0 12px rgba(255,46,77,.4), inset 0 0 12px rgba(255,46,77,.15); }
.plate .stamp.gold { color: var(--neon3); text-shadow: 0 0 8px var(--neon3); box-shadow: 0 0 12px rgba(53,227,255,.4); }
.howrow .pts { color: var(--neon3); }
.hint b { color: var(--neon); }
.how b, .rules b { color: var(--ink); }

/* dictionary lookups on the card */
.plate-dict { margin-top: 10px; padding: 8px 10px; border-top: 1px dashed color-mix(in srgb, var(--ink) 45%, transparent); font-family: "Cormorant Garamond", Georgia, serif; font-size: 15px; line-height: 1.4; color: #d9cfe6; display: flex; flex-direction: column; gap: 4px; }
.plate-dict .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); margin-right: 6px; }

/* narrow screens and phones: one column that scrolls as a whole */
@media (max-width: 760px) {
  main.table { display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; gap: 14px; }
  .center, aside.side { flex: none; min-height: auto; overflow: visible; }
  .plate-frame { grid-template-columns: 1fr; }
  .plate .stamp { top: 52px; right: 16px; font-size: 12px; }
}

/* objections and votes */
.votes { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.voter { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #160f1d; border-radius: 8px; }
.voter .nm { flex: 1; font-size: 14px; }
.voter.done { opacity: .7; }
.voter .cast { font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--neon3); }
#objform { margin-top: 10px; }
#objby { margin-left: 6px; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a2445; background: #0b070f; color: var(--ink); }

/* pass screen, tree, colours */
.overlay.pass { background: rgba(4,2,6,.92); }
.passsheet { text-align: center; border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 60px color-mix(in srgb, var(--pc) 35%, transparent); }
.passlbl { font-family: var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); font-size: 12px; }
.passsheet h2 { font-size: 44px; margin: 6px 0; }
.passsheet .row { justify-content: center; }
.btn.pc { background: var(--pc); border-color: var(--pc); color: #0a060c; font-weight: 700; box-shadow: 0 0 18px color-mix(in srgb, var(--pc) 60%, transparent); }
.sheet.wide { width: min(760px, 100%); }
svg.tree { width: 100%; height: auto; margin: 10px 0; background: #0b070f; border-radius: 8px; border: 1px solid #2a1f33; }
label.pname .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); margin-right: 6px; box-shadow: 0 0 6px var(--pc); }
label.pname { flex-direction: row; align-items: center; gap: 6px; flex-wrap: wrap; }
label.pname input { flex: 1; min-width: 90px; }

/* structure: turn track, steps, play form labels, stake */
.track { display: flex; flex-direction: column; gap: 6px; }
.turns { display: flex; flex-wrap: wrap; gap: 6px; }
.turn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; border: 1px solid #2a1f33; background: #0f0a13; color: var(--ink-dim); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
.turn i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: #1a0f22; color: var(--pc); font-size: 11px; }
.turn.done { opacity: .45; text-decoration: line-through; }
.turn.now { color: var(--ink); border-color: var(--pc); box-shadow: 0 0 12px color-mix(in srgb, var(--pc) 55%, transparent); }
.turn.now i { background: var(--pc); color: #0a060c; }
.steps { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.step.done { color: #6f5f80; text-decoration: line-through; }
.step.now { color: var(--neon3); text-shadow: 0 0 8px var(--neon3); }
.steps .sep { color: #3a2445; }
.playform .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }
.dbl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dashed #3a2445; border-radius: 8px; color: var(--ink); font-size: 14px; cursor: pointer; }
.dbl small { flex-basis: 100%; color: var(--ink-dim); font-size: 12px; }
.dbl.off { opacity: .5; cursor: default; }
.dbl input { accent-color: var(--neon); }

/* deck picker */
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
.deck { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--dk) 45%, transparent); background: #0b070f; color: var(--dk); cursor: pointer; }
.deck:hover { box-shadow: 0 0 16px color-mix(in srgb, var(--dk) 45%, transparent); background: #120b17; }
.deck .dart { width: 54px; height: 66px; color: var(--dk); }
.deck .dart svg { width: 100%; height: 100%; fill: none; stroke: currentColor; }
.deck .dname { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-align: center; color: var(--ink); }
.deck .dn { font-size: 11px; color: var(--ink-dim); }

/* relatives game */
.guesses { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.gcount { width: 100%; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.g { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid #3a2b36; font-family: "Cinzel", var(--serif); font-weight: 700; letter-spacing: .06em; font-size: 15px; animation: pop .18s ease-out; }
.g.hit { border-color: #4dff88; color: #4dff88; box-shadow: 0 0 12px rgba(77,255,136,.35); }
.g.hit i { font-style: normal; font-family: var(--mono); font-size: 11px; color: #0a060c; background: #4dff88; border-radius: 999px; padding: 1px 6px; }
.g.miss { border-color: #5a2d3a; color: var(--ink-dim); text-decoration: line-through; text-decoration-color: rgba(255,63,164,.6); }
.g.dupe, .g.same { border-color: #3a2b36; color: #7a6c78; }
.g small { font-family: var(--sans); font-weight: 400; letter-spacing: 0; text-decoration: none; font-size: 11px; color: #9a8a96; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.famlist { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.fam { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 6px; border: 1px solid #3a2b36; font-family: "Cinzel", var(--serif); font-weight: 700; letter-spacing: .05em; font-size: 14px; }
.fam.got { border-color: #4dff88; color: #4dff88; box-shadow: 0 0 10px rgba(77,255,136,.25); }
.fam.none { color: #7a6c78; }
.fam b { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; border-radius: 50%; text-align: center; font-family: var(--mono); font-size: 10px; font-weight: 700; color: #0a060c; padding: 0 3px; }
.fam i { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #ffd166; }
.ff em { color: var(--ink); font-style: italic; }
.stage .muted { color: var(--ink-dim); font-size: 12px; }
.playform { display: flex; gap: 8px; flex-wrap: wrap; }
.playform input.word { flex: 1; min-width: 200px; font-size: 20px; }
.turn i { font-style: normal; }
.modes { grid-template-columns: repeat(3, 1fr); }
.deck.on { border-color: var(--neon); box-shadow: 0 0 18px rgba(255,63,164,.45); }
.dart.glyph { font-family: "Pirata One", var(--gothic, serif); font-size: 44px; line-height: 1; color: var(--neon); text-shadow: 0 0 12px rgba(255,63,164,.6); display: flex; align-items: center; justify-content: center; }
.choices { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.choices .choice { flex: 1; min-width: 180px; font-size: 22px; padding: 22px 16px; }
.choice.yes { background: #123a22; border-color: #4dff88; color: #4dff88; box-shadow: 0 0 18px rgba(77,255,136,.3); }
.choice.no { background: #3a1224; border-color: #ff3fa4; color: #ff3fa4; box-shadow: 0 0 18px rgba(255,63,164,.3); }
.stories { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.story { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid #3a2b36; background: #160f1d; color: var(--ink); font-family: "Cormorant Garamond", var(--serif); font-size: 19px; line-height: 1.35; }
button.story:hover { border-color: var(--neon); box-shadow: 0 0 14px rgba(255,63,164,.3); }
.story b { font-family: "Cinzel", var(--serif); font-size: 16px; color: var(--neon); min-width: 22px; }
.story i { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: #ffd166; }
.story.true { border-color: #4dff88; box-shadow: 0 0 14px rgba(77,255,136,.3); }
.story.picked:not(.true) { border-color: #ff3fa4; opacity: .8; }

.slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.slot { display: inline-flex; align-items: center; justify-content: center; min-width: 64px; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px dashed #4a3547; background: #0e0912; font-family: "Cinzel", var(--serif); font-weight: 700; letter-spacing: .06em; font-size: 14px; color: #5e4d5a; }
.slot i { font-style: normal; font-family: var(--mono); font-size: 11px; }
.slot.got { border-style: solid; border-color: #4dff88; color: #4dff88; background: #0b1a10; box-shadow: 0 0 10px rgba(77,255,136,.35); animation: pop .18s ease-out; }
.slot.given { border-style: solid; border-color: #ffd166; color: #ffd166; }
.seg.diff { margin: 10px 0 4px; }
.settings.room { align-items: center; gap: 12px; flex-wrap: wrap; }
.settings.room input { width: 180px; }
.share { width: 100%; margin-top: 10px; min-height: 84px; background: #0e0912; color: var(--ink); border: 1px solid #3a2b36; border-radius: 8px; padding: 8px; font-family: var(--mono); font-size: 12px; resize: vertical; }

label.pname select.fav { margin-left: 8px; max-width: 200px; }
@media (max-width: 640px) { label.pname { flex-wrap: wrap; } label.pname select.fav { margin-left: 0; width: 100%; } }
.ways { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0; }
.way { border: 1px solid #3a2b36; border-radius: 10px; padding: 12px 14px; background: #0e0912; }
.way h3 { margin-top: 0; }
.joinrow input { width: 120px; font-family: var(--mono); font-size: 22px; letter-spacing: .3em; text-transform: uppercase; text-align: center; padding: 8px 6px 8px 12px; border-radius: 8px; border: 1px solid #3a2b36; background: #120c17; color: var(--ink); }
.bigcode { font-family: var(--mono); font-size: 64px; letter-spacing: .4em; color: #35e3ff; text-shadow: 0 0 18px rgba(53,227,255,.7); padding: 8px 0 8px .4em; text-align: center; }
.slots4 .player.empty .av { border-style: dashed; opacity: .5; }
.slots4 .player .nm small { display: block; font-size: 11px; color: var(--ink-dim); }
.you.ok { color: #4dff88; }
.you.off { color: #ff3fa4; }
@media (max-width: 720px) { .ways { grid-template-columns: 1fr; } .bigcode { font-size: 44px; } }

.story { font-family: "Cormorant Garamond", Georgia, serif; font-size: 18px; line-height: 1.45; color: #e9e1d8; margin: 6px 0 12px; padding: 12px 14px; border-left: 3px solid var(--neon); background: #100a13; border-radius: 0 8px 8px 0; }
.boardpage { max-height: 60vh; overflow: auto; padding-right: 4px; }
.boardpage h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #c77dff; margin: 16px 0 6px; }
.logrow { border-top: 1px solid #2a1f28; padding: 10px 0; }
.logword { font-family: "Cinzel", serif; font-weight: 700; letter-spacing: .06em; color: #f2e9ff; margin-bottom: 6px; }
.logline { font-size: 14px; color: var(--ink); padding: 2px 0; }
.logrow .famlist { margin: 4px 0 6px; }
.logrow .fam { font-size: 12px; padding: 4px 8px; }

<script>(()=>{var jr=t=>{throw TypeError(t)};var E=(t,e)=>()=>(e||t((e={exports:{}}).exports,e),e.exports);var Pe=(t,e,n)=>e.has(t)?jr("Cannot add the same private member more than once"):e instanceof WeakSet?e.add(t):e.set(t,n);var Wn=E((Ds,Hn)=>{"use strict";Hn.exports=[{word:"muscle",level:1,cat:"general",origin:'Latin for "little rodent", the kind that lives in your walls. A flexing bicep looked like one moving under the skin.',story:'Latin mus, "mouse", gave the diminutive musculus, "little mouse", which the Romans used for the bulge of a flexed arm and for the shellfish that looks like one. English took muscle from French in the 1300s. The same Latin word, by a different road, gave mussel. Greek mys meant both mouse and muscle too, and Old English mus is the same word as mus: the family is older than Latin.',family:["mouse","mice","mussel","murine","musk","muscular","musculature"],notes:{mussel:"the same musculus, the shellfish shaped like a little mouse",murine:"Latin murinus, of mice",musk:'Sanskrit muska, "testicle", literally "little mouse", for the gland the scent comes from'},friends:[["mustard","Latin mustum, new wine, which it was mixed with"],["museum","the Muses"],["music","the Muses again, not mice"]]},{word:"disaster",level:1,cat:"general",origin:'Italian disastro, "ill-starred": dis- plus the Greek word for the lights in the night sky. A calamity was a bad alignment overhead.',story:'Greek astron, "star", passed into Latin as astrum. Sixteenth-century Italians, who still read their fortunes in the sky, made disastro, "under a bad star", and French disastre carried it to English by 1590, where Shakespeare used it for both an ill omen and a catastrophe. The Greek word sits at the back of every astro- word, and the English star is the same Indo-European root taken the Germanic way.',family:["star","astronomy","astrology","asteroid","asterisk","astronaut","stellar","constellation","astral","aster","interstellar","Stella"],notes:{star:"Old English steorra, the same root by the Germanic road",asterisk:'Greek asteriskos, "little star"',aster:"the flower, named for its star shape",Stella:"Latin for star"},friends:[["disease","Old French desaise, lack of ease"],["distance","Latin stare, to stand"],["desert","Latin deserere, to abandon"]]},{word:"calculate",level:1,cat:"general",origin:"Latin for a pebble, the little limestone counters a Roman moved on a counting board. The stone itself is what you write on a blackboard with.",story:`Latin calx, calcis, meant limestone and the pebble made of it; calculus was the little one, and calculi were the counters on the abacus. Calculare, "to reckon with pebbles", became English calculate in the 1500s. Doctors kept calculus for a kidney stone, mathematicians for Newton's and Leibniz's method, and Old English had already borrowed calx as cealc, which is chalk.`,family:["calculus","calculator","chalk","calcium","calcareous","calcify","miscalculate","calx"],notes:{chalk:"Old English cealc, borrowed from Latin calx",calcium:"named by Davy in 1808 from calx, lime"},friends:[["calendar","Latin kalendae, the first of the month"],["calamity","Latin calamitas, damage"],["calibre","Arabic qalib, a mould"]]},{word:"rival",level:1,cat:"general",origin:'Latin rivalis, "one who uses the same stream": from rivus, "brook". Neighbours on one stream had things to fight about.',story:'Latin rivus, "brook, stream", made rivalis, which meant a neighbour who drew water from the same brook, and then, because such neighbours quarrelled, a competitor. English took rival in the 1570s, first for a rival in love. Rivus comes from an Indo-European root meaning "to flow", and derive is the same brook: Latin derivare was to lead water off from a stream.',family:["river","rivulet","derive","derivative","rivalry","derivation"],notes:{river:'Old French riviere, from Latin riparia, "of the bank"; the bank word ripa and the stream word rivus are usually taken as one root',derive:"Latin derivare, to draw water off a stream"},friends:[["revival","Latin vivere, to live"],["rive","Old Norse rifa, to tear"],["rifle","Old French rifler, to scrape"]]},{word:"vaccine",level:1,cat:"general",origin:`Latin vacca, "cow". Jenner's first one was cowpox, so the animal is in the name of every one since.`,story:`Latin vacca, "cow", gave vaccinus, "of cows". In 1798 Edward Jenner called cowpox variolae vaccinae, "smallpox of the cow", and inoculating with it became vaccination. Pasteur widened the word to any protective inoculation in 1881 in Jenner's honour. Spanish vaquero, "cowherd", is the same cow, and American cowboys mangled it into buckaroo.`,family:["vaccinate","vaccination","vaquero","buckaroo","vaccinia","vaccinology"],notes:{vaquero:"Spanish for cowherd, from vaca, cow",buckaroo:"vaquero as heard by English-speaking cowhands"},friends:[["vacuum","Latin vacuus, empty"],["vacation","Latin vacare, to be free"],["vacant","vacare again"]]},{word:"bank",level:1,cat:"general",origin:"Italian banca, the moneylender's table in the market, from a Germanic word for a long seat. A broken table meant a broken business.",story:"A Germanic word for a bench, bankiz, went two ways. Into English directly it gave bench and the bank of a river, a ridge you could sit on. Into Italian it gave banca, the table where a Lombard moneychanger did business; when he failed, his banca was rotta, broken, which is bankrupt. English borrowed the money bank from French banque in the 1400s. A banquet was a little bench at a feast.",family:["bench","bankrupt","banquet","embankment","mountebank","banquette","bankroll"],notes:{banquet:'Italian banchetto, "little bench", the seat at a feast',mountebank:'Italian monta in banco, "climbs on the bench" to sell quack cures',embankment:"the riverbank sense, the same seat-shaped ridge"},friends:[["bang","Old Norse banga, to hammer"],["bangle","Hindi bangri"],["banner","Latin bandum, a standard"]]},{word:"malaria",level:1,cat:"general",origin:'Italian for "bad" plus the word for the stuff you breathe. The swamp got the blame for centuries before the mosquito did.',story:'Italian mala aria, "bad air", named the fever of the Roman marshes; Horace Walpole brought the phrase to English in 1740. It was thought the disease rose as a vapour from the swamp. Ronald Ross found the mosquito in 1897 and the name stayed. Aria is Latin aer from Greek a\u0113r, which is every aero- word; mala is Latin malus, "bad", the mal- in malice and malady.',family:["air","aria","aerial","aerobic","aerosol","malice","malign","malady","malevolent","dismal","malfunction","malpractice","malaise","malignant","aeroplane"],notes:{aria:"Italian for air, then a tune",dismal:'Latin dies mali, "evil days", the unlucky days on medieval calendars'},friends:[["mall","Pall Mall, the game"],["mallard","Old French malart"],["marina","Latin mare, sea"]]},{word:"pupil",level:1,cat:"general",origin:`Latin pupilla, "little doll": the tiny you reflected in someone else's eye. The one in the classroom is the same doll, a small person in someone's care.`,story:'Latin pupa meant girl or doll; pupus a boy. Pupillus was an orphan under a guardian, which is the schoolroom pupil, in English by the 1300s. Pupilla, "little doll", was the Roman name for the dark centre of the eye, because of the tiny figure you see reflected there; English took that sense in the 1500s. Pupa was reused by Linnaeus for the insect stage, and puppet and puppy are the same doll through French.',family:["puppet","puppy","pupa","pupate","poppet","pupal","pupillage"],notes:{puppy:"French poup\xE9e, doll: a puppy was a lapdog, a toy dog",pupa:'Linnaeus named the chrysalis "doll" for its swaddled look',poppet:"the same doll in an older English spelling"},friends:[["pump","Dutch pompe"],["pulpit","Latin pulpitum, a platform"],["purple","Greek porphyra"]]},{word:"window",level:2,cat:"general",origin:'Old Norse vindauga, "the eye of the breeze": a hole in the roof to let the smoke out before there was glass. Both halves are old English words too.',story:'Old Norse vindauga joined vindr, "wind", and auga, "eye": an opening for air and light. The Danes brought it to England, and it replaced the Old English eagthyrl, "eye-hole", by the 1200s. Vindr is the same word as English wind and Latin ventus, from an Indo-European root for blowing; auga is the same as eye and Latin oculus. So a window is a wind-eye, and inoculate is to graft in an eye, a bud.',family:["wind","vent","ventilate","weather","fan","nirvana","eye","daisy","ocular","binocular","inoculate","ogle","eyelet","monocle","oculist"],notes:{nirvana:'Sanskrit nirv\u0101\u1E47a, "blown out", from the same blowing root',daisy:`Old English d\xE6ges \u0113age, "day's eye"`,inoculate:'Latin inoculare, to graft a bud, an "eye", into a plant',fan:"Latin vannus, a winnowing fan for the wind to blow chaff off",weather:"Old English weder, the same wind root",ogle:"Low German oegen, to eye"},friends:[["widow","Latin vidua"],["vane","Old English fana, a flag"]]},{word:"candidate",level:2,cat:"general",origin:'Latin candidatus, "dressed in white": Roman office-seekers wore a chalk-whitened toga. From a verb meaning "to shine, to glow".',story:'Latin candere, "to shine, be white-hot", gave candidus, "bright white", and candidatus, a man in a whitened toga, which is what a Roman running for office wore so the crowd could pick him out. English took candidate in the 1600s. The same glow is in candle, from Latin candela, borrowed into Old English before the Conquest, and in candid, which meant white, then pure, then frank.',family:["candle","candid","candour","incandescent","chandelier","candela","incense","incendiary","candescent","chandler"],notes:{incense:"Latin incendere, to set alight, the same shine",chandler:"a candle-maker, through French"},friends:[["candy","Arabic qandi, sugar"],["cinder","Old English sinder, slag"],["can","Old English canne"]]},{word:"quarantine",level:2,cat:"general",origin:"Italian for the number of days Venice held plague ships: ten times the number of legs on a chair. That number is the Latin at the bottom of the word.",story:'Latin quattuor, "four", gave quadraginta, "forty", and Italian quaranta. In the 1400s Venice and Ragusa held incoming ships for forty days, a quarantina, before letting anyone ashore; English used the word for that isolation from the 1600s. The four beneath it is everywhere: quarter, square, squad (a square of soldiers), the farthing (a fourth of a penny), and English four itself, the same root by the Germanic road.',family:["quart","quarter","quartet","quadrant","square","squad","squadron","four","forty","quatrain","quadruple","cadre","farthing","tetrahedron","trapeze","quarry","quire","quadrangle","quarto"],notes:{squad:"Italian squadra, a square formation of soldiers",cadre:"French for frame, Italian quadro, a square",farthing:"Old English feorthing, a fourth of a penny",trapeze:'Greek trapeza, "table", from tetra + peza, four-footed',quarry:"Latin quadraria, where squared stone is cut",quire:"Latin quaterni, four sheets folded"},friends:[["quarrel","Latin queri, to complain"],["warrant","Frankish, no relation"]]},{word:"trivial",level:2,cat:"general",origin:'Latin trivium, "the meeting of that many roads": where they crossed, people stood about and talked of nothing much. Count the prongs on the fork Neptune carries.',story:'Latin tres, "three", and via, "road", made trivium, a crossroads, and trivialis, "of the crossroads": commonplace, the sort of thing said in the street. Medieval schools also called the first three liberal arts the trivium, and trivial was "elementary". English had it by the 1500s and the "unimportant" sense won. Both halves are busy: three is the same root by the Germanic road, and via is in every -vey and -voy word.',family:["three","triple","trio","trinity","triangle","trident","trilogy","tripod","trivia","viaduct","voyage","convey","obvious","previous","deviate","envoy","impervious","way","trimester","tricycle"],notes:{obvious:'Latin obvius, "in the way"',previous:'praevius, "going before on the road"',deviate:"de via, off the road",way:"Old English weg, the same root as via",convey:"Latin conviare, to go along the road with"},friends:[["tribute","Latin tribuere, to assign"],["trial","Anglo-French trier, to try"],["travel","from travail, a torture device"]]},{word:"whiskey",level:2,cat:"general",origin:'Gaelic for "the liquid of life", the clear stuff from the tap. That first half is the same ancient word as the English one it translates, and as a certain Russian drink.',story:`Irish and Scottish Gaelic uisce beatha translated Latin aqua vitae, "water of life", the alchemists' name for distilled spirit. English soldiers heard it as usquebaugh in the 1500s and clipped it to whisky by the 1700s. Uisce comes from the same Indo-European word for water as English water, Greek hyd\u014Dr and Russian voda, whose diminutive vodka is "little water". Otter is the same root: the water animal.`,family:["water","vodka","otter","hydrogen","hydrant","dehydrate","hydraulic","undulate","abundant","surround","redundant","inundate","wet","wash","usquebaugh","hydra"],notes:{vodka:"Russian voda, water, plus a diminutive",otter:'Old English otor, "water creature"',abundant:"Latin abundare, to overflow, from unda, wave",surround:'Latin superundare, to overflow; the "round" is folk spelling',redundant:"redundare, to overflow again"},friends:[["whisk","Old Norse visk, a wisp"],["whisper","Old English hwisprian"],["whist","from whist, hush"]]},{word:"clue",level:2,cat:"general",origin:'A respelling of an old word for a ball of thread: the one Ariadne gave Theseus to find his way out of the labyrinth. From a root meaning "to stick together".',story:`Old English cliwen was a ball of yarn. Because Theseus followed Ariadne's thread out of the maze, a clew came to mean anything that guides you out of a puzzle, and the spelling clue took over for that sense in the 1600s. The root meant "to stick, to cling": it gives clay, cling, clot, cloud (a clump of rock or earth, originally) and, through Latin gluten, glue.`,family:["clew","clay","cling","clod","cloud","clot","glue","gluten","agglutinate","clutch"],notes:{cloud:"Old English clud, a mass of rock; a cloud was a lump in the sky",glue:"Latin gluten, the same sticking root",clutch:"a clutch of eggs: a clump"},friends:[["cue","the letter Q, or French queue"],["club","Old Norse klubba"],["clumsy","Middle English clumsen, numb with cold"]]},{word:"nice",level:2,cat:"general",origin:'Latin nescius, "ignorant", from ne + a verb meaning "to know". It meant foolish, then fussy, then fine, then pleasant. The knowing half is the whole of one modern discipline.',story:'Latin scire, "to know", with ne, "not", made nescius, "not knowing". Old French nice meant silly, and so did the English word around 1300. Over five centuries it drifted: timid, then fussy and hard to please, then precise (a nice distinction), and by the late 1700s agreeable. Scire is the root of science, conscience and conscious, so nice and science are the same knowing, one with a not in front.',family:["science","conscience","conscious","omniscient","prescient","plebiscite","nescient","scientist","unconscious"],notes:{plebiscite:`Latin plebis scitum, "the people's decree", scitum from scire`},friends:[["niece","Latin neptis"],["nick","origin unknown"],["knife","Old Norse knifr"]]},{word:"alarm",level:2,cat:"general",origin:`Italian all'arme, "to weapons!" The shout became the noise, and the noise became the clock. The root beneath the weapons means "to fit together".`,story:`Italian all'arme, "to arms!", was the cry when an enemy appeared; Old French alarme carried it to English in the 1300s as the call, then any warning, then the device that sounds it. Arma, "weapons", is from an Indo-European root meaning "to fit together", which also fits together art (a skill, a fitting), article (a small joint), arthritis (Greek arthron, a joint), harmony (a fitting-together of notes) and armadillo (Spanish, "little armoured one").`,family:["arm","army","armour","armada","armistice","armadillo","armament","harmony","art","article","arthritis","artisan","inert","artefact","artifact","disarm"],notes:{harmony:"Greek harmos, a joint, a fitting",article:"Latin articulus, a little joint",arthritis:"Greek arthron, joint",inert:'Latin iners, "without art", unskilled, then sluggish',art:"Latin ars, skill, the same fitting-together"},friends:[["alas",'Old French, "ah, weary"'],["alert",`Italian all'erta, "to the watchtower": a cousin phrase, a different root`],["harm","Old English hearm"]]},{word:"daisy",level:2,cat:"general",origin:'Old English for "the eye of the day": it opens at first light and shuts at dusk. Both halves are still ordinary English words.',story:`Old English d\xE6ges \u0113age, "day's eye", was the flower's name before the Conquest, because it opens in the morning and closes at night. Day is Old English d\xE6g, a Germanic word; despite the look it is not related to Latin dies. Eye is Old English \u0113age, which is Latin oculus and Greek ops by another road, and window is the same eye with wind in front.`,family:["day","daily","today","dawn","eye","window","ocular","binocular","inoculate","ogle","eyelet","monocle","daybreak"],notes:{dawn:'Old English dagian, "to become day"',window:'Old Norse vindauga, "wind-eye"',inoculate:'Latin inoculare, to graft in an "eye", a bud'},friends:[["diary","Latin dies, the Roman day, no relation to the English one"],["journal","dies again, through French"],["dazzle","from daze, Old Norse"]]},{word:"salary",level:1,cat:"general",origin:"Latin salarium, a Roman soldier's allowance. The story says it was for buying one particular seasoning; the seasoning is in the word either way.",story:'Latin sal, "salt", gave salarium, an allowance paid to soldiers and officials. Pliny says it was salt money, though it may only have been "money for salt" the way we say "beer money". English took salary from French around 1300. Sal is an old root that Old English shared as sealt, so salt itself is family, and so is nearly everything the Romans preserved with it: salad (salted greens), sauce, sausage and salami.',family:["salt","salad","sauce","sausage","salsa","saline","salami","saltpetre","salinity","souse","silt"],notes:{salt:"Old English sealt, the same root",salad:"Vulgar Latin salata, salted",sauce:'Latin salsa, "salted"',sausage:"Latin salsicia, salted meat",saltpetre:"sal petrae, salt of the rock",souse:"to pickle, from Old Low German sultia, brine",silt:"probably from a Scandinavian word for a salt marsh"},friends:[["solar","Latin sol, the sun"],["sultan","Arabic for ruler"],["salute","Latin salus, health"]]},{word:"sabotage",level:2,cat:"general",origin:"French, from a heavy wooden shoe. Either from the noise of workers clattering in them, or from the shoe kicked into the machine; the shoe is certain, the kick is legend.",story:"French sabot is a wooden clog. Saboter meant to walk noisily in clogs, then to bungle a job, and by the 1890s French syndicalists used sabotage for deliberately slow, clumsy work as a weapon against employers. English took it in 1910. The story of a clog thrown into a loom is later decoration. Sabot itself is probably a blend of savate, an old shoe, and botte, a boot.",family:["sabot","saboteur","savate"],notes:{savate:"French kickboxing, from the old shoe you kicked with"},friends:[["sabre","Hungarian szablya"],["sabbath","Hebrew shabbat, rest"],["sable","Slavic, the animal"]]},{word:"sincere",level:2,cat:"general",origin:'Latin sincerus, "clean, pure, unmixed". The tale about wax-free statues is a tale; the true root is the word for "one, whole".',story:'Latin sincerus meant clean, sound, unmixed, and English took sincere from it in the 1530s. A popular story derives it from sine cera, "without wax", from sculptors hiding flaws with wax; it is false. The likely root is sem-, "one", the same as in simple (one-fold), single, and Latin semel, "once", plus a second element meaning "grow", so sincere is "of one growth", unmixed.',family:["simple","single","singular","simultaneous","assemble","resemble","similar","same","some","simplicity"],notes:{simple:'Latin simplus, "one-fold"',similar:"Latin similis, of the same kind",assemble:"Latin simul, together, at one time",same:"Old Norse samr, the same root by the Germanic road",some:"Old English sum, the same root"},friends:[["sin","Old English synn"],["since","Old English siththan, after that"],["sincerest","counts, obviously"]]},{word:"gossip",level:1,cat:"general",origin:"Old English for a sponsor at a baptism: a relative in God. It slid to a close friend, then to the friend who talks, then to the talk.",story:'Old English godsibb was god + sibb, "kin": a sponsor at a baptism, a godparent. By the 1300s it meant any familiar friend, especially a woman friend present at a birth, and by the 1500s the chatter such friends were supposed to enjoy. Sibb is the sib- of sibling, and god is the same god as ever.',family:["sibling","sib","godparent","godfather","godmother","god","goddess","godsend"],notes:{sibling:"Old English sibling, a relative, from sibb, kin; revived by anthropologists in 1903"},friends:[["gospel","Old English god spel, good news: a different god, meaning good"],["gosling","a little goose"],["gossamer","goose summer, the mild days in autumn"]]},{word:"ketchup",level:2,cat:"general",origin:"A Chinese word for a fish sauce, carried to English kitchens by way of Malay. The tomato arrived in it a century and a half later.",story:"Hokkien Chinese k\xEA-tsiap was a brine of pickled fish. Malay traders had it as kicap, and English sailors brought back catchup in the 1690s: a thin, salty sauce of anchovies, mushrooms or walnuts. Tomato versions appear in America around 1800 and Heinz made that the only one in 1876. The spelling ketchup is from the 1700s; catsup is the same word.",family:["catsup","catchup","kecap"],notes:{kecap:"the Indonesian soy sauce, the same Chinese word"},friends:[["kettle","Latin catillus, a bowl"],["cup","Latin cuppa"]]},{word:"avocado",level:2,cat:"general",origin:"Nahuatl ahuacatl, which also meant a testicle, for the shape and the way they hang in pairs. Spanish speakers bent it toward a familiar word for a lawyer.",story:'Nahuatl ahuacatl named the fruit and, by resemblance, a testicle. Spanish took it as aguacate in the 1500s, and folk etymology reshaped that into avocado, which already meant "lawyer" (Latin advocatus). English had avogato pear by 1697 and alligator pear by 1763, another mishearing. Guacamole is ahuacatl plus molli, sauce.',family:["guacamole","aguacate","advocate","avocat"],notes:{advocate:`Latin advocatus, "called to one's aid": the lawyer word the Spanish bent the fruit toward, so it is family by adoption`,avocat:"French for both the fruit and the lawyer"},friends:[["avoid","Old French esvuidier, to empty out"],["cargo","Spanish cargar, to load"],["alligator","Spanish el lagarto, the lizard; the pear was a mishearing"]]},{word:"robot",level:1,cat:"general",origin:"Czech, from a word for forced labour, the work a serf owed his lord. A playwright's brother suggested it in 1920.",story:'Czech robota meant compulsory labour, the days a peasant owed the landowner, from an old Slavic word for a slave. Karel \u010Capek needed a name for the artificial workers in his 1920 play R.U.R.; his brother Josef proposed roboti, and English had robot by 1923. The Slavic root is the same as German Arbeit, "work", and, further back, Latin orbus and English orphan: one bereft, then one put to work.',family:["robotics","orphan","orphanage","Arbeit"],notes:{orphan:"Greek orphanos, bereft, from the same Indo-European root as the Slavic word for slave labour",Arbeit:"German for work, the same root"},friends:[["rob","Germanic raubon, to plunder"],["robe","the same plunder: a garment taken as spoil"],["robin","a pet form of Robert"]]},{word:"nightmare",level:2,cat:"general",origin:"The second half is not a horse. It is an Old English word for a demon that sat on a sleeper's chest.",story:'Old English mare was an incubus, a goblin believed to sit on the chest and cause the suffocating dream; nightmare, from around 1300, was first the goblin and only later the dream. The word survives in French cauchemar and German Nachtmahr. Its deeper origin is disputed; it may be from a root meaning "to crush" or "to harm", and it has nothing to do with the female horse, which is Old English mere.',family:["cauchemar","Nachtmahr","mare"],notes:{mare:"the goblin, not the horse: the horse is a different Old English word"},friends:[["marine","Latin mare, sea"],["nocturnal","Latin nox, night, unrelated to English night despite the look"]]},{word:"lord",level:3,cat:"general",origin:'Old English for "the keeper of the bread". The woman of the house was the one who kneaded it.',story:'Old English hlafweard, "loaf-warden", the man who kept the bread and fed the household, wore down to hlaford and then lord by the 1300s. Lady is hl\xE6fdige, "loaf-kneader". Hlaf is loaf, and weard is ward, guard and warden: the same protector in a dozen words, including steward, the sty-warden, keeper of the hall.',family:["loaf","lady","ward","warden","guard","guardian","steward","reward","award","wary","aware","beware","landlord"],notes:{lady:"Old English hl\xE6fdige, loaf-kneader",guard:"the same ward through French, which turned w to gu",steward:"Old English stigweard, hall-warden",reward:"Old North French rewarder, to regard, to look after",aware:"Old English gew\xE6r, watchful"},friends:[["lore","Old English lar, teaching"],["lard","Latin lardum"],["laud","Latin laus, praise"]]},{word:"mortgage",level:2,cat:"general",origin:'Old French for "dead pledge": the deal dies when it is paid off, or when the borrower fails. The first half is the Latin for death.',story:`Old French mort gage, "dead pledge", was a loan against land where the lender took the land's income; the pledge "died" either when the debt was cleared or when the borrower defaulted. English lawyers had the word by the 1390s. Mort is Latin mors, mortis, "death", the root of mortal and mortuary, and gage is a Germanic pledge, the same word as wage and wed.`,family:["mortal","mortuary","mortify","morbid","mortician","immortal","moribund","murder","ambrosia","amortize","postmortem","gage","wage","wager","engage","wed","wedding"],notes:{murder:"Old English morthor, the same death root by the Germanic road",ambrosia:'Greek a- + mbrotos, "not mortal": the food of the gods',amortize:'to "kill" a debt by paying it down',wage:"the same pledge as gage, a payment promised",wed:"Old English weddian, to pledge"},friends:[["mortar","Latin mortarium, a bowl"],["morsel","Latin mordere, to bite"],["gauge","Old North French gauge, a measure"]]},{word:"sarcasm",level:1,cat:"general",origin:'Greek sarkazein, "to tear the meat off": to bite the lip in rage, then to sneer. The Greek word for meat is at the root.',story:'Greek sarx, sarkos, "flesh", gave sarkazein, "to tear flesh, to gnash the teeth", and sarkasmos, a sneer. Late Latin sarcasmus reached English in the 1570s. The flesh is in the sarcophagus, the "flesh-eating" limestone the Greeks thought dissolved a body in forty days, and in sarcoma, a tumour of the flesh.',family:["sarcastic","sarcophagus","sarcoma","sarcophagi","sarcoidosis","sarcopenia"],notes:{sarcophagus:'Greek sarkophagos, "flesh-eating", a coffin stone',sarcoma:"a tumour of the soft flesh"},friends:[["sardonic","Sardinia, from a plant said to twist the face"],["sarong","Malay"],["sergeant","Latin servire"]]},{word:"capital",level:3,cat:"money",origin:"Latin caput, the topmost part of the body. Money you start with, the leading city, the top of a column and a capital offence all come from it.",story:'Latin caput, capitis, "head", gave capitalis, "of the head, chief". A capital city is the head city; capital punishment takes the head; capital in the money sense (1600s) is the "head" sum, the principal, as opposed to interest. Old French wore caput into chef and chief, and cattle is capitale, "property", the head-count of a herd. English head is the same Indo-European root taken the Germanic way.',family:["captain","chief","chef","cattle","chapter","capitol","decapitate","capo","achieve","mischief","precipice","biceps","handkerchief","kerchief","cadet","capitulate","recapitulate","head","chieftain"],notes:{cattle:"Anglo-French catel, from Latin capitale, property: a herd counted by heads",chapter:'Latin capitulum, "little head", a heading',achieve:'Old French a chief, "to a head", to finish',mischief:'Old French meschief, "bad end"',precipice:"Latin praeceps, headfirst",biceps:'Latin, "two-headed" muscle',kerchief:"Old French couvre-chef, cover-head",cadet:'Gascon capdet, "little chief", a younger son',capitulate:"to settle under headings, then to surrender on terms",head:"Old English heafod, the same root"},friends:[["capture","Latin capere, to seize"],["captive","capere again"],["capacity","capere, to hold"]]},{word:"testament",level:2,cat:"money",origin:'Latin testis, "a witness". A will is witnessed, so it is a testament. The rude story about what Romans swore on is folk etymology.',story:`Latin testis, "witness", is probably from an old phrase meaning "a third party standing by". Testamentum was a will, "a witnessed thing", and English had testament by 1300 for both a will and each half of the Bible, a "witness" of God's covenant. Testify is to bear witness; contest, protest and detest are all to call a witness for, against or down. The anatomical testis is Roman slang, a "witness" to virility; the tale of oaths sworn on it is a later joke.`,family:["testify","testimony","contest","protest","attest","detest","intestate","testicle","testamentary","testimonial"],notes:{detest:"Latin detestari, to curse by calling the gods to witness",intestate:"having died without a witnessed will",testicle:'Latin testiculus, a "little witness" to virility'},friends:[["test","Latin testum, an earthen pot for assaying"],["testy","Old French teste, head"],["tetanus","Greek, stretched"]]},{word:"legal",level:3,cat:"money",origin:'Latin lex, legis, "law". The law was probably "what is gathered and read out", from a verb of gathering that later also meant reading.',story:'Latin lex, "law", is probably from legere, "to gather, pick out", which came to mean "to read" because reading is picking out letters. From lex: legal, legitimate, legislate, and through French loyal (faithful to the law) and legacy (a bequest under law). From legere: collect, select, elect, lecture, legend ("things to be read"), legible and, with intus, intelligent, "choosing between". Greek legein, the same root, meant to gather and then to speak, giving logos and every -logy.',family:["legislate","legitimate","loyal","legacy","legate","delegate","relegate","privilege","college","colleague","collect","elect","select","neglect","intelligent","lecture","legend","legible","lesson","elegant","sacrilege","diligent","logic","lexicon","dialect","catalogue","analogy","apology","legion","illegal","legitimacy"],notes:{loyal:'Old French leial, "lawful"',privilege:"Latin privilegium, a law for one person",college:"Latin collega, one chosen alongside",legend:'Latin legenda, "things to be read"',elegant:"Latin eligere, to pick out: choosy in dress",sacrilege:"Latin sacrilegus, one who gathers sacred things, a temple thief",legion:"Latin legio, a levy, a gathering of soldiers",logic:"Greek logos, from legein, to gather and to say"},friends:[["leg","Old Norse leggr"],["ledger","Dutch, a lying book"],["league","Latin ligare, to bind"]]},{word:"company",level:3,cat:"money",origin:'Latin com- plus the word for bread: people who eat together. The bread is Latin, and the root under it means "to feed".',story:'Late Latin companio, "one who eats bread with you", from com-, "with", and panis, "bread", was coined by Germanic soldiers in the Roman army translating their own word for a mess-mate. Old French compaignie reached English in the 1200s for companionship, then a band of people, then a trading firm. Panis comes from a root meaning "to feed" that also gives pastor (a feeder of flocks), pasture, repast, and the Germanic food, fodder and foster.',family:["companion","accompany","pantry","pannier","panini","panettone","pastor","pasture","pastoral","repast","antipasto","pabulum","food","fodder","foster","accompaniment"],notes:{pantry:"Old French paneterie, the bread room",pannier:"a bread basket",pastor:"Latin pastor, a feeder, a shepherd",repast:"Latin repascere, to feed again",food:"Old English foda, the same feeding root",foster:"Old English fostrian, to nourish"},friends:[["pan","Old English panne, a vessel"],["panic","the god Pan"],["pane","Latin pannus, cloth"]]},{word:"dictate",level:1,cat:"money",origin:'Latin dicere, "to say, to speak". The root behind it meant "to point out", which is why a finger is family.',story:'Latin dicere, "to say", is from an Indo-European root deik-, "to show, point out", which also gave Greek deiknynai, "to show", and the Germanic word behind teach and token. Dictare was to say repeatedly, so a dictator says and a dictionary collects what is said. A verdict is "truly said", an edict "said out", a judge (iudex) "one who says the law", and a vendetta "vengeance declared". Digit, the finger you point with, is the same root, and so is a policy, from Greek apodeixis, a "showing", a proof.',family:["dictionary","diction","dictator","verdict","edict","predict","contradict","addict","benediction","indicate","index","dedicate","abdicate","condition","jurisdiction","ditto","valediction","malediction","judge","vendetta","preach","teach","token","digit","paradigm","policy","dictaphone","indict"],notes:{judge:'Latin iudex, "law-sayer"',vendetta:'Italian, from Latin vindicta, "vengeance declared"',preach:"Latin praedicare, to proclaim",teach:"Old English t\xE6can, to show, the same root by the Germanic road",token:"Old English tacen, a sign",digit:"Latin digitus, the pointing finger",paradigm:"Greek paradeigma, a pattern shown",policy:"Greek apodeixis, a proof, through Italian polizza, a document",ditto:'Italian detto, "said"',condition:"Latin condicere, to agree by speaking",index:"the pointer"},friends:[["dice","Latin datum, given"],["ticket","French estiquet, no relation"]]},{word:"stupid",level:1,cat:"money",origin:'Latin stupere, "to be stunned, knocked senseless". The stunned came before the dim. The root meant "to strike", and it left a mark in the printing trade.',story:'Latin stupere, "to be struck senseless, amazed", gave stupidus, and English stupid meant dazed when it arrived in the 1540s; the "slow-witted" sense followed within decades. Stupor and stupendous (something that stuns) are the same verb. The root, "to push, to strike", also gave Greek typos, "a blow, an impression", which is type, the struck letter, and every -type word.',family:["stupor","stupendous","stupefy","stupefaction","type","typo","typical","stereotype","prototype","archetype","typewriter"],notes:{type:'Greek typos, "a blow, the mark of a blow", from the same striking root',stupendous:'Latin stupendus, "to be stunned at"'},friends:[["stew","Old French estuve, bathhouse"],["stub","Old English stybb"],["study","Latin studere, to be eager"]]},{word:"crypt",level:1,cat:"money",origin:'Greek kryptein, "to hide". A hidden vault, a hidden meaning, a hidden message, and one hidden gas.',story:`Greek kryptos, "hidden", from kryptein, "to hide", gave krypte, a vault, which Latin borrowed as crypta and English took in the 1400s for an underground chamber. Cryptic is "hidden in meaning", cryptography "hidden writing", the Apocrypha "hidden books". Krypton was named in 1898 because it hid in liquid air. Latin crypta also wore down into Italian grotta, a cave, and grotesque was the style of painting found in Nero's buried rooms.`,family:["cryptography","encrypt","decrypt","crypto","grotto","grotesque","apocrypha","crypt
